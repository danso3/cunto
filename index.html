<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="metaTema" content="#f8fafc">
<!-- La CSP vieta qualunque risorsa esterna: l'app non può comunicare in rete
     anche per errore. Per la pubblicazione si aprono soltanto manifest e
     service worker, che restano nella stessa origine del sito. img-src deve
     contenere 'self': Chrome scarica le icone del manifest seguendo proprio
     questa direttiva, e senza 'self' rifiuta l'installazione (scoperto sul
     deploy vero da Daniele, 26 ott 2026). data: copre il favicon -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'">
<!-- Favicon: il disegno di Daniele — il registro con la moneta €, come l'icona dell'app -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect x='0' y='0' width='512' height='512' fill='%232b5f9e'/><rect x='152' y='152' width='204' height='236' rx='20' fill='none' stroke='%23ffffff' stroke-width='14'/><line x1='192' y1='159' x2='192' y2='381' stroke='%23ffffff' stroke-width='14' stroke-linecap='round'/><line x1='216' y1='214' x2='320' y2='214' stroke='%23ffffff' stroke-width='12' stroke-linecap='round'/><line x1='216' y1='262' x2='320' y2='262' stroke='%23ffffff' stroke-width='12' stroke-linecap='round'/><line x1='216' y1='310' x2='320' y2='310' stroke='%23ffffff' stroke-width='12' stroke-linecap='round'/><line x1='216' y1='358' x2='276' y2='358' stroke='%23ffffff' stroke-width='12' stroke-linecap='round'/><circle cx='352' cy='176' r='58' fill='%230f141a' stroke='%23ffffff' stroke-width='13'/><line x1='352' y1='148' x2='352' y2='204' stroke='%23ffffff' stroke-width='10' stroke-linecap='round'/><line x1='343' y1='157' x2='361' y2='157' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/><line x1='343' y1='185' x2='361' y2='185' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/></svg>">
<!-- Il pacchetto PWA: dichiarato quando l'app è pubblicata su un sito.
     In anteprima o da file locale i file non ci sono e non succede nulla -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cunto">
<title>Cunto de li Cunti</title>
<style>
  /* ============ Base ============ */
  /* Palette «Blu notte»: di giorno chiara, di notte quella del piano.
     light-dark() sceglie la tinta secondo il color-scheme: di default
     segue il sistema, l'interruttore nelle Impostazioni forza lo scuro */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --verde: light-dark(#157a4a, #54c08d); --rosso: light-dark(#c0392b, #e27263);
    --neutro: light-dark(#5b6b7e, #8296ab);
    --bordo: light-dark(#e2e8f0, #243140); --sfondo: light-dark(#f8fafc, #0f141a);
    --carta: light-dark(#fff, #151e28); --accento: light-dark(#2b5f9e, #6aa5e0);
    --testo: light-dark(#1e293b, #dfe8f1); --tenue: light-dark(#eaf1f9, #1c2b3a);
    /* Slot colore delle categorie nella torta: uno per riga, assegnato alla
       nascita di ogni categoria e mai più cambiato, così i colori restano
       riconoscibili da un periodo all'altro. La tinta avanza dell'angolo
       aureo (137,5°) a ogni slot: 21 colori tutti diversi e sparsi attorno
       al cerchio, così due categorie vicine non si somigliano mai */
    --cat-1: light-dark(hsl(0 45% 48%), hsl(0 50% 62%));
    --cat-2: light-dark(hsl(138 45% 58%), hsl(138 50% 70%));
    --cat-3: light-dark(hsl(275 45% 48%), hsl(275 50% 62%));
    --cat-4: light-dark(hsl(53 45% 58%), hsl(53 50% 70%));
    --cat-5: light-dark(hsl(190 45% 48%), hsl(190 50% 62%));
    --cat-6: light-dark(hsl(328 45% 58%), hsl(328 50% 70%));
    --cat-7: light-dark(hsl(105 45% 48%), hsl(105 50% 62%));
    --cat-8: light-dark(hsl(243 45% 58%), hsl(243 50% 70%));
    --cat-9: light-dark(hsl(20 45% 48%), hsl(20 50% 62%));
    --cat-10: light-dark(hsl(158 45% 58%), hsl(158 50% 70%));
    --cat-11: light-dark(hsl(295 45% 48%), hsl(295 50% 62%));
    --cat-12: light-dark(hsl(73 45% 58%), hsl(73 50% 70%));
    --cat-13: light-dark(hsl(210 45% 48%), hsl(210 50% 62%));
    --cat-14: light-dark(hsl(348 45% 58%), hsl(348 50% 70%));
    --cat-15: light-dark(hsl(125 45% 48%), hsl(125 50% 62%));
    --cat-16: light-dark(hsl(263 45% 58%), hsl(263 50% 70%));
    --cat-17: light-dark(hsl(40 45% 48%), hsl(40 50% 62%));
    --cat-18: light-dark(hsl(178 45% 58%), hsl(178 50% 70%));
    --cat-19: light-dark(hsl(315 45% 48%), hsl(315 50% 62%));
    --cat-20: light-dark(hsl(93 45% 58%), hsl(93 50% 70%));
    --cat-21: light-dark(hsl(230 45% 48%), hsl(230 50% 62%));
    /* Tinte della barra a segmenti dei budget: una scala di blu ricavata
       dall'accento, NON gli slot della torta di Analisi (scelta di Daniele:
       qui il colore va per posizione, non per categoria, e quando le tinte
       finiscono si ricomincia — possono anche ripetersi) */
    --bud-1: var(--accento);
    --bud-2: color-mix(in srgb, var(--accento) 70%, var(--sfondo));
    --bud-3: color-mix(in srgb, var(--accento) 45%, var(--sfondo));
    --bud-4: color-mix(in srgb, var(--accento) 25%, var(--sfondo));
    color-scheme: light dark;
  }
  html[data-scuro] { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--sfondo); color: var(--testo); font-size: 16px;
    -webkit-tap-highlight-color: transparent;
    font-variant-numeric: tabular-nums;   /* cifre allineate, sempre */
  }
  /* manipulation: scroll verticale e zoom a due dita restano nativi del browser,
     i gesti orizzontali sono dell'app (swipe dei periodi). Con "pan-y pinch-zoom"
     Chrome, dopo uno swipe gestito dalla pagina, sopprime il click del primo
     tocco (lo tocca ri-toccare): "manipulation" non lo fa. Si perde solo lo
     zoom a doppio tap, che qui non serve.
     overflow-x: clip — il contenuto che entra da destra sfora di 46px per un attimo:
     senza il clip la pagina diventerebbe scrollabile di lato e la fascia fissa in
     basso (fascia 4) sparirebbe e riapparirebbe a ogni entrata da destra.
     padding-bottom: la barra fissa è alta 56px (44px di pulsanti + 12px d'aria)
     più la zona sicura del telefono; sopra ci lascio 14px di respiro */
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh;
         padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
         touch-action: manipulation; overflow-x: clip; }
  /* Foglio "nuovo movimento": sale dal basso sopra la pagina precedente */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    max-width: 480px; margin: 0 auto;
    background: var(--carta); border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 28px light-dark(rgba(15, 23, 42, .16), rgba(0, 0, 0, .55));
    max-height: 92vh; overflow-y: auto;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }
  .sheet.entra { animation: sale-su .2s ease-out; }
  @keyframes sale-su { from { transform: translateY(100%); } }
  /* Cambio sezione: il contenuto entra rapido dalla direzione dello swipe */
  .pagina-corpo.entra-dx { animation: scorre-da-dx .2s ease-out; }
  .pagina-corpo.entra-sx { animation: scorre-da-sx .2s ease-out; }
  @keyframes scorre-da-dx { from { transform: translateX(46px); opacity: .4; } }
  @keyframes scorre-da-sx { from { transform: translateX(-46px); opacity: .4; } }
  /* Cambio periodo: anche l'etichetta accompagna il movimento, piccola e leggera */
  .etichetta-periodo.entra-dx { animation: etichetta-da-dx .2s ease-out; }
  .etichetta-periodo.entra-sx { animation: etichetta-da-sx .2s ease-out; }
  @keyframes etichetta-da-dx { from { transform: translateX(14px); opacity: 0; } }
  @keyframes etichetta-da-sx { from { transform: translateX(-14px); opacity: 0; } }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; font-size: 16px; color: inherit; }

  /* ============ Fascia 1: selettore periodo ============ */
  /* Testata fissa: barra del periodo e riepilogo restano in cima anche scrollando.
     z-index sopra il menù in basso, così il tappeto del menù di chiusura lo copre */
  .testa-fissa { position: sticky; top: 0; z-index: 12; background: var(--sfondo); }
  .fascia1 {
    position: relative;   /* il menù di chiusura pende da qui */
    background: var(--sfondo);
    border-bottom: 1px solid var(--bordo);
    display: flex; align-items: center;
    padding: 10px 12px;
  }
  /* Il gruppo frecce+scritta sta esattamente al centro della fascia INTERA e
     non della parte che avanza dopo il ⋮: così la scritta è perfettamente
     centrata e le frecce le stanno accanto, equidistanti. Il gruppo copre
     tutta la fascia in overlay: pointer-events none sul contenitore e auto
     sui soli pulsanti, perché il ⋮ sotto resti toccabile */
  .fascia1 .nav-periodo {
    position: absolute; left: 0; top: 0; bottom: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .fascia1 .nav-periodo * { pointer-events: auto; }
  .btn-freccia {
    background: none; border: none; font-size: 22px; color: var(--accento);
    padding: 10px 14px; border-radius: 8px;
  }
  .btn-freccia:active { background: color-mix(in srgb, currentColor 8%, transparent); }
  .etichetta-periodo { font-weight: 600; font-size: 15px; }
  .btn-puntini {
    background: none; border: none; font-size: 22px; padding: 10px;
    border-radius: 8px; color: var(--neutro); font-weight: 700;
    margin-left: auto;
  }
  /* Freccia inibita ai limiti della navigazione (periodo aperto / più vecchio) */
  .btn-freccia.fermo { opacity: .25; pointer-events: none; }
  /* La parola "oggi" del periodo aperto: pulsante che apre il menù di chiusura */
  .btn-oggi {
    background: none; border: none; color: var(--accento);
    font-weight: 700; font-size: 15px; padding: 0; font-family: inherit;
  }
  /* Menù di chiusura del periodo: pende dalla fascia 1 (solo Libero) */
  .fascia1.con-menu { z-index: 12; }
  .menu-chiusura {
    position: absolute; top: 100%; right: 12px; margin-top: 4px; z-index: 12;
    background: var(--carta); border-radius: 0;
    box-shadow: 0 10px 28px light-dark(rgba(15, 23, 42, .18), rgba(0, 0, 0, .6));
    min-width: 215px; overflow: hidden;
  }
  /* Le voci dei due menù a tendina (chiusura periodo e puntini) sono le
     stesse: le regole si scrivono una volta sola */
  .menu-chiusura button, .menu-locale button {
    display: block; width: 100%; min-height: 46px; padding: 12px 16px;
    background: none; border: none; border-bottom: 1px solid var(--bordo);
    font-size: 15px; font-weight: 500; color: var(--testo); text-align: left;
    transition: background .1s;
  }
  .menu-chiusura button:last-child, .menu-locale button:last-child { border-bottom: none; }
  .menu-chiusura button:active, .menu-locale button:active { background: color-mix(in srgb, currentColor 8%, transparent); }
  /* Tappeto invisibile: chiude il menù toccando fuori */
  .tappeto-menu { position: fixed; inset: 0; z-index: 11; }
  /* Menù locale dei tre puntini (categorie e budget): stesso vestito del
     menù di chiusura, ma pende dal punto toccato. Sta SOPRA il foglio
     Impostazioni (z-index 40), perché da lì si aprono i menù di categoria */
  .tappeto-menu.sopra { z-index: 41; }
  .menu-locale {
    position: fixed; z-index: 42; min-width: 215px; overflow: hidden;
    background: var(--carta); border-radius: 0;
    box-shadow: 0 10px 28px light-dark(rgba(15, 23, 42, .18), rgba(0, 0, 0, .6));
  }
  .menu-locale button.pericoloso { color: var(--rosso); font-weight: 700; }

  /* ============ Fascia 2: riepilogo ============ */
  .kpi { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px; }
  .kpi2 { grid-template-columns: 1fr 1fr; }
  .kpi .casella { padding: 10px 6px; text-align: center; }
  .kpi .casella .titolo { font-size: 11px; color: var(--neutro); text-transform: uppercase; letter-spacing: .5px; }
  .kpi .casella .valore { font-size: 16px; font-weight: 700; margin-top: 4px; white-space: nowrap; }
  .verde { color: var(--verde); } .rosso { color: var(--rosso); } .neutro { color: var(--neutro); }

  /* ============ Corpo principale ============ */
  .corpo { padding: 4px 12px 12px; }
  .giorno {
    font-size: 12px; font-weight: 700; color: var(--neutro);
    text-transform: uppercase; letter-spacing: .5px; margin: 20px 2px 6px;
  }
  /* Niente fili sopra i gruppi giorno né tra i movimenti (richiesta di
     Daniele, 26 ott 2026): a staccarli bastano l'etichetta e l'aria */
  .mov {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 2px;
    transition: background .1s;
  }
  .mov:active { background: color-mix(in srgb, currentColor 8%, transparent); }
  .mov .icona-mov { width: 30px; flex: none; }
  .mov .info { flex: 1; min-width: 0; }
  .mov .titolo { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mov .sotto { font-size: 12px; color: var(--neutro); margin-top: 2px; }
  .mov .importo { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .vuoto { text-align: center; color: var(--neutro); padding: 40px 20px; font-size: 14px; }

  /* ============ Fascia 4: menu inferiore ============ */
  .nav-basso {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
    background: var(--sfondo);
    padding: 6px 0 max(6px, env(safe-area-inset-bottom)); z-index: 10;
  }
  .nav-basso button {
    background: none; border: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; font-size: 11px;
    color: var(--neutro); padding: 6px 0; min-height: 44px; transition: background .1s;
  }
  .nav-basso button.attivo { background: var(--tenue); color: var(--accento); font-weight: 700; }
  .nav-basso button .icona { font-size: 22px; }
  /* Il ＋ è l'ultimo elemento della barra, piatto come gli altri: fondo
     tenue e segno blu, niente cerchio */
  .nav-basso button.piu { background: var(--tenue); }
  .nav-basso button.piu .icona { color: var(--accento); font-size: 22px; }

  /* ============ Form movimento ============ */
  .intestazione-pagina {
    display: flex; align-items: center; gap: 8px; padding: 12px;
    border-bottom: 1px solid var(--bordo);
  }
  .intestazione-pagina h2 { font-size: 17px; flex: 1; }
  .importo-display {
    font-size: 34px; font-weight: 700; text-align: right; padding: 10px 16px 6px;
    font-variant-numeric: tabular-nums;
  }
  .nota-attaccata { margin: 0; }
  .nota-attaccata input {
    width: 100%; padding: 12px; border: none; border-bottom: 1px solid var(--bordo);
    background: none; font-size: 15px;
  }
  .tastierino { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; padding: 0 12px; margin-top: 10px; }
  .tastierino button {
    font-size: 22px; font-weight: 600; padding: 14px 0; border-radius: 0;
    border: none; background: none; transition: background .1s;
  }
  /* Operatori e ⌫: unico fondo del tastierino, tutto il resto è piatto */
  .tastierino button.op { background: var(--tenue); color: var(--accento); }
  .tastierino button:active { background: color-mix(in srgb, currentColor 8%, transparent); }
  .sezioni-form { padding: 16px 12px; display: flex; flex-direction: column; gap: 14px; }
  .campo .etichetta-campo { font-size: 12px; font-weight: 700; color: var(--neutro); text-transform: uppercase; margin-bottom: 6px; }
  .toggle-direzione { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toggle-direzione button {
    padding: 10px; border-radius: 999px; border: none;
    background: none; font-weight: 700; color: var(--neutro); font-size: 15px;
    transition: background .1s;
  }
  /* La direzione si dice col colore del testo, non col bordo: il fondo è una
     tinta leggera del colore, solo sulla selezione */
  .toggle-direzione button.uscita.sel { background: color-mix(in srgb, var(--rosso) 10%, transparent); color: var(--rosso); }
  .toggle-direzione button.entrata.sel { background: color-mix(in srgb, var(--verde) 10%, transparent); color: var(--verde); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 16px; border-radius: 999px; border: none;
    background: var(--tenue); font-size: 14px; font-weight: 700; color: var(--testo);
    display: inline-flex; align-items: center; gap: 6px;
  }
  /* Il grasso è sempre attivo: la selezione non cambia la larghezza e non sposta i vicini */
  .chip.sel { background: var(--accento); color: light-dark(#fff, #0f172a); }
  .campo input[type="text"], .campo input[type="number"] {
    width: 100%; padding: 12px 2px; border-radius: 0; border: none;
    border-bottom: 1px solid var(--bordo); background: none;
  }
  /* La data è un pulsante gemello di quello categoria: apre il calendario da qualsiasi punto */
  .btn-data {
    width: 100%; padding: 13px 16px; border-radius: 999px; border: none;
    background: var(--tenue); font-size: 15px; font-weight: 700; color: var(--testo);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  /* Testata del calendario: mese al centro, frecce ai lati */
  .cal-testata { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-testata .mese { font-size: 15px; font-weight: 700; }
  /* Calendario: griglia piatta, le celle si toccano come in una tabella */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0;
              touch-action: manipulation; }   /* lo swipe del mese non deve finire al browser (e niente click soppressi) */
  .cal-grid .cal-testa {
    text-align: center; font-size: 12px; font-weight: 700; color: var(--neutro);
    padding: 6px 0; border-bottom: 1px solid var(--bordo);
  }
  .cal-grid button {
    padding: 9px 0; min-height: 44px; border: none; border-radius: 0;
    background: none; font-size: 15px; font-weight: 600; color: var(--testo);
    transition: background .1s;
  }
  .cal-grid button:active { background: color-mix(in srgb, currentColor 8%, transparent); }
  /* Il giorno scelto è l'unico con un fondo pieno: un cerchio blu */
  .cal-grid button.oggi { color: var(--accento); font-weight: 700; }
  .cal-grid button.sel { background: var(--accento); border-radius: 999px; color: light-dark(#fff, #0f172a); font-weight: 700; }
  /* Giorni fuori dai limiti d'uso (chiusura/modifica periodo): visibili ma non scegliibili */
  .cal-grid button:disabled { color: light-dark(#cbd5e1, #33475c); background: none; font-weight: 500; }
  /* Celle vuote (giorni che non ci sono): stesse dimensioni dei bottoni, così il
     rettangolo del calendario è sempre di 6 settimane, qualunque sia il mese */
  .cal-grid span:not(.cal-testa) { min-height: 44px; }
  /* Cambio mese: la griglia scivola come i periodi (stesse keyframes) */
  .cal-grid.entra-dx { animation: scorre-da-dx .2s ease-out; }
  .cal-grid.entra-sx { animation: scorre-da-sx .2s ease-out; }
  .due-colonne { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* Pulsante-campo: apre le schermate di scelta */
  .btn-campo-scelta {
    width: 100%; padding: 13px 16px; border-radius: 999px; border: none;
    background: var(--tenue); font-size: 15px; font-weight: 700; color: var(--testo); text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .btn-campo-scelta.vuota { color: var(--neutro); font-weight: 500; }
  .btn-principale {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: var(--accento); color: light-dark(#fff, #0f172a); font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-pericoloso {
    width: 100%; padding: 13px; border-radius: 12px; border: 2px solid var(--rosso);
    background: none; color: var(--rosso); font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  /* ============ Analisi ============ */
  .torta { display: flex; align-items: center; gap: 28px; padding: 18px 0 6px; }
  .legenda { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .legenda .voce { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .legenda .voce .pallino { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .riga-cat { padding: 12px 2px; cursor: pointer; transition: background .1s; }
  .riga-cat:active, .riga-conto:active { background: color-mix(in srgb, currentColor 8%, transparent); }
  .riga-cat .testa, .riga-conto .testa { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; gap: 8px; }
  .riga-cat .perc { color: var(--neutro); font-weight: 500; font-size: 13px; white-space: nowrap; }
  .barra { height: 3px; background: var(--bordo); border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .barra .riempimento { height: 100%; border-radius: 99px; background: var(--neutro); }
  /* Barra e percentuale sulla stessa riga: la barra si accorcia per far posto al numero */
  .riga-barra { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .riga-barra .barra { flex: 1; margin-top: 0; }
  .riga-conto { padding: 12px 2px; min-height: 44px; cursor: pointer; }
  /* Niente linea spessa tra categorie e conti né fili tra i conti
     (richiesta di Daniele, 26–27 ott 2026): resta solo un po' d'aria */
  .riga-cat + .riga-conto { margin-top: 20px; }
  /* Selettore delle due pagine di Analisi: sta in cima al corpo, non nella
     fascia fissa — se si scorre, scorre via con la pagina (richiesta di Daniele) */
  .schede-analisi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 2px 2px 16px; }
  .schede-analisi button {
    padding: 10px 6px; min-height: 44px; border: none; border-radius: 999px;
    background: none; color: var(--neutro); font-weight: 700; font-size: 14px;
    transition: background .1s;
  }
  .schede-analisi button.sel { background: var(--tenue); color: var(--accento); }
  /* Grafico di flusso: solo le due linee, niente assi né griglia */
  .grafico-flusso { display: block; width: 100%; }
  .grafico-flusso text { fill: var(--neutro); font-size: 9px; font-weight: 600; }
  .grafico-flusso polyline { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  /* I due pulsanti sotto il grafico: la lingua del selettore entrate/uscite
     del form, più compatti ma alti 44px come ogni cosa da toccare */
  .pulsanti-flusso { display: flex; gap: 8px; justify-content: center; padding: 12px 0 18px; }
  .pulsanti-flusso button {
    padding: 10px 18px; min-height: 44px; border: none; border-radius: 999px;
    background: none; color: var(--neutro); font-weight: 700; font-size: 13.5px;
    transition: background .1s;
  }
  .pulsanti-flusso button.entrata.sel { background: color-mix(in srgb, var(--verde) 10%, transparent); color: var(--verde); }
  .pulsanti-flusso button.uscita.sel { background: color-mix(in srgb, var(--rosso) 10%, transparent); color: var(--rosso); }
  /* Le righe dei giorni della sintesi del flusso non si toccano */
  .riga-statica { cursor: default; }
  .banner-filtro {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--tenue); border-radius: 999px;
    padding-left: 14px; margin: 12px 12px 0; font-size: 14px; font-weight: 600; color: var(--accento);
  }
  .banner-filtro span { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .banner-filtro button { background: none; border: none; color: var(--accento); font-size: 18px; padding: 12px 16px; }

  /* ============ Budget ============ */
  /* Niente fili tra un budget e l'altro (richiesta di Daniele, 26 ott 2026):
     le schede si distinguono da sole, e non serve più nemmeno il caso
     speciale dell'ultima prima del pulsante */
  .riga-budget { padding: 14px 2px; }
  .riga-budget .testa { display: flex; align-items: center; gap: 8px; }
  .riga-budget .testa .nome { font-weight: 700; font-size: 15px; flex: 1; }
  .riga-budget .testa .tre-punti { background: none; border: none; font-size: 22px; color: var(--neutro); padding: 8px 12px; }
  .riga-budget .dati { display: flex; gap: 14px; margin-top: 6px; font-size: 13px; color: var(--neutro); }
  .riga-budget .dati b { color: var(--testo); }
  /* Barra del budget a segmenti: un pezzo per ogni categoria che ha speso
     qualcosa, largo come la sua parte del limite; i filetti bianchi tra i
     pezzi sono i traguardi intermedi */
  .barra-segmenti { display: flex; gap: 2px; height: 10px; margin-top: 10px;
                    background: var(--bordo); border-radius: 99px; overflow: hidden; }
  .barra-segmenti span { height: 100%; background: var(--col, var(--neutro)); }
  /* Traguardi sotto la barra: da ogni confine un filo scende fino alla riga
     della sua etichetta e si ferma alla base delle lettere; la scritta sta
     appena dopo il filo (o prima, se dopo non c'è spazio fino al margine,
     e allora il suo bordo destro arriva quasi al filo); chi si accavalla
     con una già posata scende di una riga e il filo si allunga */
  .traguardi { position: relative; margin-top: 2px; }
  .traguardi .filo { position: absolute; top: 0; width: 1px; background: var(--neutro); }
  .traguardi .etichetta { position: absolute; top: 0;
                    font-size: 10px; line-height: 16px; color: var(--neutro); white-space: nowrap;
                    padding: 0 3px; background: var(--sfondo); }
  .traguardi .fine { right: 0; font-weight: 700; }
  .riga-budget .rimanente { font-size: 13px; margin-top: 4px; color: var(--neutro); }
  .sforato .rimanente { color: var(--rosso); font-weight: 700; }
  .sforato .dati b, .sforato .testa .nome { color: var(--rosso); }
  .sforato .barra-segmenti span { background: var(--rosso); }
  .btn-secondario {
    width: 100%; padding: 13px; border-radius: 12px; border: 2px solid var(--accento);
    background: none; color: var(--accento); font-size: 15px; font-weight: 700; margin-top: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  /* «+ Imposta budget» senza cornice (prova di Daniele, 26 ott 2026): il
     tocco resta comodo, il pulsante si riconosce dall'accento */
  .senza-bordo { border: none; }

  /* ============ Impostazioni ============ */
  /* Foglio piatto: gruppi con titolo maiuscolo, niente scatole */
  .pag-impostazioni { padding: 12px; }
  .gruppo { margin-bottom: 24px; }
  .titolo-gruppo { font-size: 12px; font-weight: 700; color: var(--neutro); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  /* Sezione Categorie/Conti: il titolo è un bottone che la apre e la chiude */
  .bottone-gruppo { width: 100%; display: flex; align-items: center; justify-content: space-between; background: none; border: none; padding: 0; cursor: pointer; }
  .bottone-gruppo .ico { transition: transform .2s ease-out; }
  .bottone-gruppo.aperta .ico { transform: rotate(180deg); }
  .riga-tema { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
  .riga-tema .nome-opzione { font-size: 15px; font-weight: 600; }
  /* Righe delle istantanee automatiche nel gruppo Dati, piatte come le altre liste */
  .riga-backup { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                 border-bottom: 1px solid var(--bordo); font-size: 13px; color: var(--neutro); }
  .riga-backup .btn-testo { width: auto; padding: 10px 0; }
  /* Interruttore del tema scuro: pillola col pallino che scorre */
  .interruttore {
    width: 52px; height: 32px; border-radius: 999px; border: none; flex: none;
    background: var(--bordo); position: relative; transition: background .2s ease-out;
  }
  .interruttore::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    transition: left .2s ease-out;
  }
  .interruttore.on { background: var(--accento); }
  .interruttore.on::after { left: 23px; }
  .btn-testo {
    background: none; border: none; color: var(--accento); font-size: 14px; font-weight: 600;
    padding: 10px 0; display: flex; align-items: center; gap: 8px; width: 100%;
    text-align: left; min-height: 44px;
  }
  .btn-testo.rosso { color: var(--rosso); }
  .albero .nodo { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--bordo); }
  .albero .nodo:last-child { border-bottom: none; }
  .albero .nodo .nome { flex: 1; font-size: 15px; }
  .albero .tre-punti { background: none; border: none; font-size: 22px; color: var(--neutro); padding: 8px 12px; }
  .avviso { font-size: 13px; color: var(--neutro); margin-top: 8px; line-height: 1.4; }
  /* ============ Modifica periodi ============ */
  .riga-periodo { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin-bottom: 10px; }
  .riga-periodo.aperta { grid-template-columns: 1fr; }
  .trattino { display: flex; align-items: center; color: var(--neutro); font-weight: 700; }
  /* Apertura del periodo aperto: sola lettura, identico agli altri */
  .btn-campo-scelta.fermo { pointer-events: none; cursor: default; }

  /* ============ Modali ============ */
  .overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.aperto { display: flex; }
  /* Variante per il calendario: compare al centro, un po' più in alto */
  .overlay.centrata { align-items: center; padding: 0 16px; }
  .overlay.centrata .modale {
    border-radius: 16px; margin-bottom: 14vh; max-width: 400px;
    padding: 16px 14px max(16px, env(safe-area-inset-bottom));
  }
  .modale {
    background: var(--carta); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    max-height: 85vh; overflow-y: auto;
  }
  .modale h3 { margin-bottom: 14px; font-size: 17px; }
  .modale .campo { margin-bottom: 14px; }
  /* ============ Griglie e liste di scelta (toccabili) ============ */
  /* Celle piatte: il gap di 1px sul fondo --bordo disegna i filetti tra
     una cella e l'altra */
  .griglia-scelta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--bordo); border: 1px solid var(--bordo); }
  .griglia-scelta button {
    min-height: 64px; padding: 8px 4px; border-radius: 0; border: none;
    background: var(--carta); font-size: 12px; font-weight: 600; color: var(--testo);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .griglia-scelta button .icona-griglia { display: flex; color: var(--neutro); }
  .griglia-scelta button.sel { background: var(--tenue); color: var(--accento); }
  .griglia-scelta button.sel .icona-griglia { color: var(--accento); }
  /* Griglia delle icone del form categoria/conto: come sopra, sei colonne */
  .griglia-icone { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--bordo); border: 1px solid var(--bordo); margin-top: 6px; }
  .griglia-icone button {
    min-height: 48px; border-radius: 0; border: none; background: var(--carta);
    display: flex; align-items: center; justify-content: center; color: var(--testo);
  }
  .griglia-icone button.sel { background: var(--accento); color: light-dark(#fff, #0f172a); }
  /* Sfoglia le pagine del selettore icone: freccette ai lati, contatore al centro */
  .nav-icone { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .nav-icone button { background: none; border: none; font-size: 20px; color: var(--accento); padding: 6px 14px; }
  .nav-icone button:disabled { opacity: .25; }
  .nav-icone span { font-size: 12px; color: var(--neutro); font-variant-numeric: tabular-nums; }
  .lista-scelta { display: flex; flex-direction: column; }
  .lista-scelta button {
    padding: 14px 2px; border-radius: 0; border: none; border-bottom: 1px solid var(--bordo);
    background: none; font-size: 15px; font-weight: 600; color: var(--testo); text-align: left;
    display: flex; align-items: center; gap: 8px; min-height: 44px;
  }
  .lista-scelta button:last-child { border-bottom: none; }
  .lista-scelta button.sel { color: var(--accento); font-weight: 700; }
  .azioni-modale { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .azioni-modale .btn-secondario { margin-top: 0; }

  /* ============ Icone (sprite Lucide inline) ============ */
  .ico {
    width: 22px; height: 22px; flex: none; vertical-align: middle; fill: none;
    stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  /* Le icone di contorno (righe di lista e simili) stanno spente;
     altrove seguono il colore del testo che le contiene */
  .mov .icona-mov .ico, .albero .nodo .ico, .riga-cat .ico, .riga-conto .ico,
  .icona-budget, .btn-campo-scelta .ico { color: var(--neutro); }
  .mov .sotto .ico { width: 14px; height: 14px; }
  .chips .ico { width: 16px; height: 16px; }
  .banner-filtro .ico, .btn-data .ico, .btn-testo .ico { width: 18px; height: 18px; }
  /* Toast: conferma corta e galleggiante sopra la barra di navigazione */
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: light-dark(#1e293b, #dfe8f1); color: light-dark(#fff, #0f141a);
    font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 999px;
    z-index: 60; pointer-events: none; animation: toast-entra .2s ease-out;
  }
  @keyframes toast-entra { from { opacity: 0; transform: translate(-50%, 8px); } }
  /* Banner di memoria temporanea: fisso sopra la barra di navigazione,
     appare soltanto se l'archivio del telefono (IndexedDB) non risponde.
     In teoria non capita mai: se capita, meglio saperlo */
  .banner-memoria {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    width: min(456px, calc(100% - 24px)); z-index: 45;
    display: flex; align-items: center; gap: 8px;
    background: var(--tenue); border: 1px solid var(--bordo);
    border-radius: 16px; padding: 10px 8px 10px 14px;
    font-size: 13px; line-height: 1.45; color: var(--testo);
  }
  .banner-memoria .ico { width: 18px; height: 18px; flex: none; color: var(--rosso); }
  .banner-memoria strong { font-weight: 700; }
  .banner-memoria .x-banner {   /* tocco comodo, come tutto il resto */
    min-width: 44px; min-height: 44px; flex: none;
    background: none; border: none; color: var(--accento); font-size: 18px;
  }
  .banner-memoria.nascosto { display: none; }

</style>

<script>
"use strict";

/* ================================================================
   1. COSTANTI E UTILITÀ
   ================================================================ */
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio",
              "agosto","settembre","ottobre","novembre","dicembre"];
const MESI_BREVI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
/* Icone: sprite Lucide inline subito dopo il <body>. Nei dati viaggia solo
   l'id corto italiano, mai il disegno; "etichetta" è il fallback di tutto.
   ICONE_RAPIDE è la prima pagina del selettore del form categoria/conto,
   ICONE_VARIE è il set aggiuntivo per le categorie nuove: il selettore li
   sfoglia in ordine (ICONE_DEL_PICKER), 30 per pagina. DA_EMOJI traduce le
   emoji dei dati salvati (e dei backup) prima del restyle */
const ICONE = ["aggiorna","casa","documento","caffe","pizza","persone","libro","auto","posate",
               "utente","salute","spesa","gioco","tasse","telefono","bus","aereo","emergenza",
               "maglietta","regalo","lavoro","banca","banconote","lampadina","carta","bersaglio",
