               "freccia-su","freccia-giu"];   // trending-up: il tasto del tracciamento; le frecce: le righe della sintesi, fuori dal selettore
const ICONE_RAPIDE = ["casa","spesa","caffe","pizza","auto","telefono","lampadina","maglietta",
                      "libro","regalo","lavoro","salute","gioco","aereo","bus","posate","film",
                      "trofeo","ricevuta","carta","banconote","banca","bersaglio","busta","folgore",
                      "mondo","chiave","cuore","pin","pesi"];
const ICONE_VARIE = ["treno","barca","bici","benzina","martello","divano","letto","negozio",
                     "salvadanaio","laurea","giornale","televisione","schermo","cuffie","microfono",
                     "musica","arte","pennello","fotocamera","dadi","medaglia","festa","sorriso",
                     "stella","sole","luna","neve","ombrello","onde","montagna","tenda","alberi",
                     "pianta","foglia","fiore","cane","gatto","pesce","uccello","birra","vino",
                     "gelato","dolce","biscotto","panino","insalata","stetoscopio","pillola",
                     "microscopio","ancora","wifi","lavatrice","presa","biglietto","popcorn",
                     "cornetto","uovo","latte","mappa","bussola"];
const ICONE_DEL_PICKER = [...ICONE_RAPIDE, ...ICONE_VARIE];   // ordine di sfoglio, 30 per pagina
const DA_EMOJI = {"🔄":"aggiorna","🏠":"casa","📄":"documento","☕":"caffe","🍕":"pizza","👥":"persone",
                 "📚":"libro","🚗":"auto","🍽️":"posate","👤":"utente","🏥":"salute","🛒":"spesa",
                 "🎮":"gioco","🏛️":"tasse","📱":"telefono","🚌":"bus","✈️":"aereo","🚨":"emergenza",
                 "👕":"maglietta","🎁":"regalo","💼":"lavoro","🏦":"banca","💵":"banconote","💡":"lampadina",
                 "🧾":"ricevuta","💳":"carta","🎯":"bersaglio","🛍️":"busta","⚡":"folgore","🌐":"mondo",
                 "🔧":"chiave","❤️":"cuore","📌":"pin","🏋️":"pesi","🎬":"film","🏆":"trofeo","❓":"domanda",
                 "💰":"portafoglio","🏷️":"etichetta","🧪":"provetta","🗑️":"spazzatura","✏️":"matita",
                 "📊":"barre","📈":"torta","📅":"calendario","⬇️":"scarica","⬆️":"carica","➕":"piu","⚽":"trofeo"};
// L'icona valida o il fallback: mai un id inesistente dentro lo sprite
const icona = id => `<svg class="ico" aria-hidden="true"><use href="#i-${ICONE.includes(id) ? id : "etichetta"}"/></svg>`;

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const dataIt = s => s.slice(8,10) + "/" + s.slice(5,7) + "/" + s.slice(0,4);   // da ISO a gg/mm/aaaa
const eur = n => n.toLocaleString("it-IT", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
const num = n => n.toLocaleString("it-IT", {maximumFractionDigits: 2});   // compatto, per le etichette della barra
const arrotonda = n => Math.round(n * 100) / 100;
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                              .replace(/"/g,"&quot;").replace(/'/g,"&#39;").replace(/`/g,"&#96;");

// Data ISO che esiste davvero nel calendario: la sola regex lascerebbe
// passare i giorni impossibili (31 febbraio, mese 13), che nei render
// farebbero nascere "undefined NaN" e crash — entrano solo da un backup
// pasticciato, perché all'utente le date arrivano dal calendario.
// Attenzione: new Date arrotola "2026-02-31" al 3 marzo invece di dare
// NaN, quindi serve il giro di ritorno (parse UTC → riconfronto)
const dataOk = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s)) && new Date(s).toISOString().slice(0, 10) === s;
// Ricerca di categoria o conto per id
const cat = id => dati.categorie.find(c => c.id === id) || null;
const conto = id => dati.conti.find(c => c.id === id) || null;

/* ================================================================
   2. DATABASE (IndexedDB)
   Se IndexedDB non è disponibile (es. anteprima sandbox), l'app
   lavora solo in memoria: tutto il resto funziona identico.
   ================================================================ */
let db = null;

function prom(q) { return new Promise((ris, err) => { q.onsuccess = () => ris(q.result); q.onerror = () => err(q.error); }); }

function apriDB() {
  return new Promise(ris => {
    let r;
    try { r = indexedDB.open("finanze", 4); }
    catch (e) { return ris(null); }
    r.onupgradeneeded = e => {
      const d = e.target.result;
      // I negozi già esistenti (aggiornamento dalle versioni precedenti) non vanno ricreati
      if (!d.objectStoreNames.contains("movimenti"))   d.createObjectStore("movimenti",   {keyPath: "id", autoIncrement: true});
      if (!d.objectStoreNames.contains("categorie"))   d.createObjectStore("categorie",   {keyPath: "id", autoIncrement: true});
      if (!d.objectStoreNames.contains("conti"))       d.createObjectStore("conti",       {keyPath: "id", autoIncrement: true});
      if (!d.objectStoreNames.contains("budget"))      d.createObjectStore("budget",      {keyPath: "id", autoIncrement: true});
      if (!d.objectStoreNames.contains("periodi"))     d.createObjectStore("periodi",     {keyPath: "id", autoIncrement: true});
      if (!d.objectStoreNames.contains("impostazioni")) d.createObjectStore("impostazioni", {keyPath: "chiave"});
      if (!d.objectStoreNames.contains("backup"))      d.createObjectStore("backup",      {keyPath: "id", autoIncrement: true});   // le istantanee automatiche (v3)
      if (!d.objectStoreNames.contains("tracciamento")) d.createObjectStore("tracciamento", {keyPath: "chiave"});   // il punto di partenza e gli aggiustamenti del conto (v4)
    };
    r.onsuccess = () => ris(r.result);
    r.onerror = () => ris(null);
  });
}

const tabella = (s, m) => db.transaction(s, m).objectStore(s);

/* Lo «sporco»: qualcosa è cambiato nel database dall'ultima fotografia.
   È lui che decide se la foto di giornata scatta alla chiusura — aprire
   l'app soltanto per guardare non sporca niente. Vive in localStorage,
   così sopravvive a un'apertura finita male: il telefono che ammazza
   l'app senza eventi di chiusura lascia lo sporco acceso e il prossimo
   avvio fa la fotografia lui */
let sporcoVivo = false;
function sporcoAcceso() {
  if (!sporcoVivo) { try { sporcoVivo = localStorage.getItem("sporco") === "1"; } catch {} }
  return sporcoVivo;
}
function sporcoAccende() {
  sporcoVivo = true;
  try { localStorage.setItem("sporco", "1"); } catch {}
}
function sporcoPulito() {
  sporcoVivo = false;
  try { localStorage.removeItem("sporco"); } catch {}
}

async function dbSalva(s, obj) {
  if (db) {
    const o = tabella(s, "readwrite");
    // Impostazioni e tracciamento usano "chiave" come chiave: il put
    // inserisce o aggiorna senza mai andare in conflitto col record esistente
    if (s === "impostazioni" || s === "tracciamento") await prom(o.put(obj));
    else if (obj.id == null) obj.id = await prom(o.add(obj));
    else await prom(o.put(obj));
  } else if (s !== "impostazioni" && s !== "tracciamento" && obj.id == null) {
    // Senza IndexedDB: in memoria le impostazioni vivono già in dati
    obj.id = dati._id[s]++;
  }
  if (s !== "backup") sporcoAccende();   // una scrittura riuscita è una modifica: la foto di giornata ha materia
}
async function dbElimina(s, id) {
  if (db) await prom(tabella(s, "readwrite").delete(id));
  if (s !== "backup") sporcoAccende();   // eliminare è cambiare, come scrivere
}

async function caricaTutto() {
  if (db) {
    const leggi = s => prom(tabella(s, "readonly").getAll());
    dati.movimenti    = await leggi("movimenti");
    dati.categorie    = await leggi("categorie");
    dati.conti        = await leggi("conti");
    dati.budget       = await leggi("budget");
    dati.periodi      = await leggi("periodi");
    dati.impostazioni = (await leggi("impostazioni")).find(i => i.chiave === "app") || null;
    dati.tracciamento = (await leggi("tracciamento")).find(t => t.chiave === "app") || null;
    dati.backup = await leggi("backup");
  }
}

/* ================================================================
   3. DATI IN MEMORIA E VALORI PREDEFINITI
   Le categorie sono piatte: nome, icona e direzione.
   I budget hanno un nome e possono raccogliere più categorie.
   ================================================================ */
const dati = {
  movimenti: [], categorie: [], conti: [], budget: [], periodi: [],
  backup: [],   // le istantanee automatiche: al massimo tre, dentro l'app
  tracciamento: null,   // il punto di partenza e gli aggiustamenti del conto
  impostazioni: null,
  _id: {movimenti: 1, categorie: 1, conti: 1, budget: 1, periodi: 1, backup: 1}   // solo per la modalità senza IndexedDB
};

const CATEGORIE_DEFAULT = [
  // uscite
  ["Abbonamenti","aggiorna"],["Affitto","casa"],["Bollette e varie","documento"],["Caffè","caffe"],
  ["Cibo random","pizza"],["Eventi sociali","persone"],["Libri","libro"],["Macchina","auto"],
  ["Mangiare fuori","posate"],["Pagamenti ad personam","utente"],["Salute","salute"],["Spesa","spesa"],
  ["Svago personale","gioco"],["Tasse","tasse"],["Telefono","telefono"],["Trasporti ordinari","bus"],
  ["Trasporti eccezionali","aereo"],["Varie contingenti","emergenza"],["Vestiti","maglietta"],
  // entrate
  ["Regali","regalo"],["Stipendio","lavoro"]
];

const CONTI_DEFAULT = [["Carta","carta"], ["Satispay","telefono"], ["Contanti","banconote"]];

async function semina() {
  if (dati.conti.length === 0)
    for (const [nome, icona] of CONTI_DEFAULT) {
      const c = {nome, icona}; await dbSalva("conti", c); dati.conti.push(c);
    }
  if (dati.categorie.length === 0)
    for (const [nome, icona] of CATEGORIE_DEFAULT) {
      const c = {nome, icona,
                 direzione: (nome === "Regali" || nome === "Stipendio") ? "entrata" : "uscita"};
      await dbSalva("categorie", c); dati.categorie.push(c);
    }
  if (!dati.impostazioni) {
    dati.impostazioni = {chiave: "app", periodoModalita: "mensile",
                         contoDefault: dati.conti[0].id};
    await dbSalva("impostazioni", dati.impostazioni);
  }
  await assegnaOrdine();    // appena seminate, le categorie hanno subito l'ordine spostabile
  await assegnaColori();    // e il colore stabile della torta
}

const salvaImpostazioni = () => dbSalva("impostazioni", dati.impostazioni);

/* ================================================================
   4. PERIODI TEMPORALI
   Modalità: settimanale | mensile | libero
   In Libero i periodi chiusi vivono nella collezione "periodi";
   il periodo aperto corre dal giorno dopo l'ultima chiusura a oggi.
   ================================================================ */
const giorniInMese = (y, m) => new Date(y, m + 1, 0).getDate();
const giornoReset = (y, m, g) => Math.min(g, giorniInMese(y, m));   // serve alla migrazione e all'import dei backup vecchi
const ieriDi = s => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() - 1); return iso(d); };
const domaniDi = s => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + 1); return iso(d); };
// "Ieri" vero del calendario, senza sottrarre millisecondi (a mezzanotte del
// cambio d'ora legale 24 ore esatte potrebbero cadere sul giorno sbagliato)
const ieriIso = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); };
// L'etichetta di un giorno: Oggi, Ieri, poi giorno della settimana e mese
// per esteso — la usano i gruppi di Movimenti, la sintesi del flusso e il
// banner del filtro per giorno (uno solo vocabolario in tutta l'app)
function nomeGiorno(g, oggi = iso(new Date()), ieri = ieriIso()) {
  if (g === oggi) return "Oggi";
  if (g === ieri) return "Ieri";
  const d = new Date(g + "T12:00:00");
  return cap(GIORNI[d.getDay()]) + " " + d.getDate() + " " + MESI[d.getMonth()];
}

// Periodi chiusi in ordine cronologico
const periodiOrdinati = () => [...dati.periodi].sort((a, b) => a.inizio.localeCompare(b.inizio));

function periodo() {
  const imp = dati.impostazioni, oggi = new Date(), off = stato.offset;
  const fmt = (d, anno) => d.getDate() + " " + MESI_BREVI[d.getMonth()] + (anno ? " " + d.getFullYear() : "");

  if (imp.periodoModalita === "settimanale") {
    const da = new Date(oggi); da.setDate(oggi.getDate() - ((oggi.getDay() + 6) % 7) + off * 7);
    const a = new Date(da); a.setDate(da.getDate() + 6);
    const etichetta = da.getMonth() === a.getMonth()
      ? `${da.getDate()}–${a.getDate()} ${MESI_BREVI[da.getMonth()]} ${a.getFullYear()}`
      : `${da.getDate()} ${MESI_BREVI[da.getMonth()]} – ${a.getDate()} ${MESI_BREVI[a.getMonth()]} ${a.getFullYear()}`;
    return {da, a, etichetta};
  }

  if (imp.periodoModalita === "mensile") {
    const da = new Date(oggi.getFullYear(), oggi.getMonth() + off, 1);
    const a = new Date(da.getFullYear(), da.getMonth() + 1, 0);
    return {da, a, etichetta: cap(MESI[da.getMonth()]) + " " + da.getFullYear()};
  }

  // Libero: offset 0 = aperto; +1 = spese programmate; indietro tra i chiusi
  const chiusi = periodiOrdinati();
  const o = Math.max(-chiusi.length, Math.min(1, off));   // mai oltre i limiti
  const oggiIso = iso(oggi);
  if (o === 1) {   // oltre l'aperto: le spese registrate per giorni ancora da venire
    const da = new Date(oggi); da.setDate(oggi.getDate() + 1);
    return {da, a: new Date(9999, 11, 31), aperto: false, etichetta: "Spese programmate"};
  }
  if (o === 0) {
    const inizio = imp.liberoInizio || iso(new Date(oggi.getFullYear(), oggi.getMonth(), 1));
    const da = new Date(inizio + "T12:00:00"), a = new Date(oggi);
    const futuro = inizio > oggiIso;   // chiuso oggi: il nuovo aperto nasce domani
    return {da, a, aperto: true, menuOggi: !futuro,
            etichetta: fmt(da, da.getFullYear() !== a.getFullYear()) + (futuro ? " (da domani)" : " – oggi")};
  }
  const p = chiusi[chiusi.length + o];
  const da = new Date(p.inizio + "T12:00:00"), a = new Date(p.fine + "T12:00:00");
  return {da, a, aperto: false,
          etichetta: da.getFullYear() === a.getFullYear()
            ? fmt(da) + " – " + fmt(a)
            : fmt(da, true) + " – " + fmt(a, true)};
}

const movimentiNelPeriodo = () => {
  const p = periodo();
  return dati.movimenti.filter(m => m.data >= iso(p.da) && m.data <= iso(p.a));
};

function spostaPeriodo(d) {
  if (dati.impostazioni.periodoModalita === "libero") {
    // In Libero si fermano alle programmate (destra) e al chiuso più vecchio (sinistra)
    const nuovo = Math.max(-periodiOrdinati().length, Math.min(1, stato.offset + d));
    if (nuovo === stato.offset) return;
    stato.offset = nuovo;
  } else stato.offset += d;
  // Il cambio di periodo scorre come le pagine: avanti = entra da destra
  stato._dir = stato._per = d > 0 ? "entra-dx" : "entra-sx";
  stato._menu = false;
  render();
}

/* ---- Chiusura del periodo aperto (solo Libero) ---- */
async function chiudiPeriodo(fine) {
  fine = fine || iso(new Date());   // senza argomento: oggi
  const inizio = dati.impostazioni.liberoInizio;
  // Solo oggi o passato, mai prima dell'apertura
  if (!inizio || fine < inizio || fine > iso(new Date())) return;
  const p = {inizio, fine};
  await dbSalva("periodi", p); dati.periodi.push(p);
  dati.impostazioni.liberoInizio = domaniDi(fine);   // il nuovo aperto parte domani
  await salvaImpostazioni();   // niente foto qui: la chiusura sporca il database e ci pensa la foto di giornata quando l'app si mette in tasca
  stato.offset = -1;   // mostra il periodo appena chiuso
  stato._menu = false;
  render();
}

function menuChiudi() { if (!stato._menu) storiaApri(); stato._menu = true; render(); }
function chiudiMenu() { if (stato._menu) { stato._menu = false; storiaTogli(); render(); } }

function apriCalChiusura() {
  apriCalendario("chiusura", {data: null, min: dati.impostazioni.liberoInizio, max: iso(new Date())});
}

/* ---- Passaggio alla modalità Libero ----
   La prima volta (nessun periodo chiuso) i periodi si generano dai
   movimenti; ai ritorni successivi l'archivio esistente si riprende. */
async function attivaLibero(daMensileLibera) {
  const imp = dati.impostazioni;
  if (dati.periodi.length) {
    // Riancora l'aperto se manca o confligge con l'ultimo chiuso
    const ultimo = periodiOrdinati();
    const fine = ultimo[ultimo.length - 1].fine;
    if (!imp.liberoInizio || imp.liberoInizio <= fine) imp.liberoInizio = domaniDi(fine);
    return;
  }
  const gen = generaPeriodiLibero(daMensileLibera, dati.movimenti, imp.resetGiorno);
  for (const p of gen.chiusi) { await dbSalva("periodi", p); dati.periodi.push(p); }
  imp.liberoInizio = gen.inizioAperto;
}

// Genera i chiusi dal mese del movimento più antico fino al mese scorso.
// Arrivando da "mensile a data libera" si ricostruiscono i cicli col giorno
// di reset; negli altri casi si usano i mesi solari (1°–fine mese).
// È una funzione pura: non tocca né il database né i dati, così l'import
// di un backup può generare i periodi prima di sostituirli.
function generaPeriodiLibero(daMensileLibera, movimenti, g) {
  const oggi = new Date();
  let chiusi = [], inizioAperto = null;

  if (movimenti.length) {
    const prima = new Date([...movimenti].sort((a, b) => a.data.localeCompare(b.data))[0].data + "T12:00:00");
    if (daMensileLibera && g) {
      let y = prima.getFullYear(), m = prima.getMonth();
      if (prima.getDate() < giornoReset(y, m, g)) m--;   // ciclo in corso iniziato il mese scorso
      if (m < 0) { m = 11; y--; }
      let cy = oggi.getFullYear(), cm = oggi.getMonth();
      if (oggi.getDate() < giornoReset(cy, cm, g)) cm--;
      if (cm < 0) { cm = 11; cy--; }
      for (let t = y * 12 + m; t < cy * 12 + cm; t++) {
        const yy = Math.floor(t / 12), mm = t - yy * 12;
        chiusi.push({inizio: iso(new Date(yy, mm, giornoReset(yy, mm, g))),
                     fine: ieriDi(iso(new Date(yy, mm + 1, giornoReset(yy, mm + 1, g))))});
      }
      inizioAperto = iso(new Date(cy, cm, giornoReset(cy, cm, g)));
    } else {
      let y = prima.getFullYear(), m = prima.getMonth();
      while (y * 12 + m < oggi.getFullYear() * 12 + oggi.getMonth()) {
        chiusi.push({inizio: iso(new Date(y, m, 1)), fine: iso(new Date(y, m + 1, 0))});
        m++; if (m > 11) { m = 0; y++; }
      }
      inizioAperto = iso(new Date(oggi.getFullYear(), oggi.getMonth(), 1));
    }
  }
  // Zero movimenti: solo l'aperto, dall'1 del mese corrente
  if (!inizioAperto) inizioAperto = iso(new Date(oggi.getFullYear(), oggi.getMonth(), 1));
  return {chiusi, inizioAperto};
}

/* ================================================================
   5. RENDERING COMUNE
   ================================================================ */
const stato = {pagina: "movimenti", offset: 0, modifica: null,
               analisiScheda: "categorie",   // la seconda pagina di Analisi ("flusso") non si ricorda: si parte sempre da Categorie
               importoStr: "", direzione: "uscita", contoSel: null,
               categoria: null, _data: null, _nota: "", filtro: null, dietro: "movimenti",
               _cal: null, _menu: false, _dir: null, _per: null, _locale: null};
// L'ordine del menù in basso detta anche la direzione dell'animazione di vai()
const PAGINE = ["movimenti", "analisi", "budget"];
let sheetNuovo = false;   // true solo quando il foglio si apre: serve per l'animazione

// In Libero, oltre l'aperto (offset 1) c'è il periodo virtuale delle spese programmate
const speseProgrammate = () => dati.impostazioni.periodoModalita === "libero" && stato.offset === 1;

function render() {
  stato._fumetto = false;   // il render ricostruisce tutto: il fumetto non sopravvive (vale per ogni pagina)
  if (stato.pagina === "periodi") return renderPeriodi();
  if (stato.pagina === "tracciamento") return renderTracciamento();
  // Con un foglio aperto (form o Impostazioni), dietro resta la pagina d'origine.
  // Dietro alla scheda del movimento non c'è mai la schermata di tracciamento
  // (che disegna tutta da sé): c'è Analisi, la sua sezione
  const visibile = (stato.pagina === "form" || stato.pagina === "impostazioni")
    ? (stato.dietro === "tracciamento" ? "analisi" : stato.dietro) : stato.pagina;

  const p = periodo();
  const pagina = visibile === "movimenti" ? renderMovimenti()
              : visibile === "analisi"   ? renderAnalisi()
              : renderBudget();
  const foglio = stato.pagina === "form" ? corpoForm()
              : stato.pagina === "impostazioni" ? foglioImpostazioni() : "";
  // Direzione calcolata da vai(): consumata qui, una volta sola
  const dir = stato._dir; stato._dir = null;
  const dirE = stato._per; stato._per = null;   // anima l'etichetta solo se è cambiato il periodo

  // In Libero, sul periodo aperto, "oggi" diventa il pulsante di chiusura
  const libero = dati.impostazioni.periodoModalita === "libero";
  let etichetta = p.etichetta, sospeso = "";
  if (libero && p.aperto && p.menuOggi) {
    const ieri = ieriIso();
    etichetta = p.etichetta.replace("oggi",
      `<button class="btn-oggi" onclick="menuChiudi()">oggi ▾</button>`);
    if (stato._menu) sospeso = `
      <div class="tappeto-menu" onclick="chiudiMenu()"></div>
      <div class="menu-chiusura">
        <button onclick="chiudiMenu();chiudiPeriodo()">Chiudi periodo oggi</button>
        ${ieri >= dati.impostazioni.liberoInizio ? `<button onclick="chiudiMenu();chiudiPeriodo('${ieri}')">Chiudi periodo ieri</button>` : ""}
        <button onclick="chiudiMenu();apriCalChiusura()">Chiudi – seleziona data</button>
      </div>`;
  }
  const fermoSx = libero && stato.offset <= -periodiOrdinati().length;
  const fermoDx = libero && stato.offset >= 1;

  document.getElementById("app").innerHTML = `
    <div class="testa-fissa">
    <div class="fascia1${stato._menu ? " con-menu" : ""}">
      <button class="btn-puntini${promemoriaExport() ? " promemoria" : ""}" onclick="vai('impostazioni')">⋮</button>
      <div class="nav-periodo">
        <button class="btn-freccia${fermoSx ? " fermo" : ""}" onclick="spostaPeriodo(-1)">‹</button>
        <span class="etichetta-periodo${dirE ? " " + dirE : ""}">${etichetta}</span>
        <button class="btn-freccia${fermoDx ? " fermo" : ""}" onclick="spostaPeriodo(1)">›</button>
      </div>
      ${sospeso}
    </div>
    ${pagina.kpi}
    </div>
    <div class="pagina-corpo${dir ? " " + dir : ""}">${pagina.corpo}</div>
    <div class="sentinella-fusione"></div>
    ${foglio}
    ${tastoTracciaHtml()}
    <div class="nav-basso">
      <button class="${visibile === "movimenti" ? "attivo" : ""}" onclick="vai('movimenti')"><span class="icona">${icona("hand-coins")}</span>Movimenti</button>
      <button class="${visibile === "analisi" ? "attivo" : ""}" onclick="vai('analisi')"><span class="icona">${icona("torta")}</span>Analisi</button>
      <button class="${visibile === "budget" ? "attivo" : ""}" onclick="vai('budget')"><span class="icona">${icona("bersaglio")}</span>Budget</button>
      <button class="piu" onclick="apriInserimento()"><span class="icona">＋</span></button>
    </div>
    ${stato._locale ? `<div class="tappeto-menu sopra" onclick="chiudiMenuLocale()"></div>
    <div class="menu-locale" style="left:${stato._locale.x}px;top:${stato._locale.y}px">${stato._locale.voci.map((v, i) => `<button class="${v.pericoloso ? "pericoloso" : ""}" onclick="voceMenuLocale(${i})">${v.testo}</button>`).join("")}</div>` : ""}`;
  if (stato.pagina === "form") attivaSwipeFoglio();
  if (stato.pagina === "impostazioni") attivaSwipeFoglio(chiudiImpostazioni);
  aggiornaTastoTraccia();   // il tasto fluttuante nasce già nello stato dello scroll del momento
}

function vai(pagina) {
  // Tasto indietro: entrare in una pagina-schermo lascia una voce nella
  // cronologia, tornare indietro la toglie. Periodi sta IMPILATO sopra
  // Impostazioni: andarci è un'apertura, e il suo tasto ‹ è un ritorno.
  // Col tasto indietro del telefono non si tocca niente: la voce l'ha già
  // tolta il browser. (Il form entra ed esce per conto suo, con apriInserimento/apriModifica)
  if (!daIndietro && pagina !== stato.pagina) {
    const nuova = PAGINE_SCHERMO.includes(pagina), vecchia = PAGINE_SCHERMO.includes(stato.pagina);
    if ((nuova && !vecchia) || (stato.pagina === "impostazioni" && pagina === "periodi")) storiaApri();
    else if ((vecchia && !nuova) || (stato.pagina === "periodi" && pagina === "impostazioni")) storiaTogli();
  }
  // Analisi e Budget vivono "dentro" Movimenti per il tasto indietro: entrarci
  // mette una voce nella cronologia, il tasto indietro la consuma riportando
  // a Movimenti (e da lì, col secondo colpo, esce dall'app). Chi arriva a
  // Movimenti col filtro aperto (categoria, conto, giorno o dettaglio budget) non
  // tocca la voce della sezione: quella del filtro l'ha messa chi l'ha aperto,
  // e dietro c'è comunque la pagina d'origine.
  if (PAGINE.includes(pagina) && PAGINE.includes(stato.pagina) && pagina !== stato.pagina) {
    if (pagina === "movimenti") {
      if (!stato.filtro) {   // tornare alla base, non entrare in una schermata filtrata
        if (voceSezione && !daIndietro) storiaTogli();
        voceSezione = false;
      }
    } else if (!voceSezione && !daIndietro) { storiaApri(); voceSezione = true; }
  }
  // Il foglio Impostazioni entra con l'animazione e ricorda la pagina d'origine
  if (pagina === "impostazioni" && stato.pagina !== "impostazioni") {
    if (PAGINE.includes(stato.pagina)) stato.dietro = stato.pagina;
    sheetNuovo = true;   // il foglio entra con l'animazione di scorrimento dal basso
  }
  // Direzione dell'animazione: avanti nel menù = entra da destra
  const da = PAGINE.indexOf(stato.pagina), a = PAGINE.indexOf(pagina);
  stato._dir = da >= 0 && a >= 0 && da !== a ? (a > da ? "entra-dx" : "entra-sx") : null;
  stato.pagina = pagina; stato.modifica = null; stato._menu = false; render(); window.scrollTo(0, 0);
}

// Fascia 2: riepilogo a 3 caselle (o 2 nella pagina Budget)
function kpiHtml(ms) {
  if (ms === null) {   // variante Budget: budget totale / budget speso
    let totale = 0, speso = 0;
    const mp = movimentiNelPeriodo();
    for (const b of dati.budget) { totale += b.limite; speso += spesaBudget(b, mp); }
    return `<div class="kpi kpi2">
      <div class="casella"><div class="titolo">Budget totale</div><div class="valore neutro">${eur(arrotonda(totale))}</div></div>
      <div class="casella"><div class="titolo">Budget speso</div><div class="valore neutro">${eur(arrotonda(speso))}</div></div>
    </div>`;
  }
  let entrate = 0, uscite = 0;
  for (const m of ms) m.tipo === "entrata" ? entrate += m.importo : uscite += m.importo;
  const bilancio = arrotonda(entrate - uscite);
  return `<div class="kpi">
    <div class="casella"><div class="titolo">Entrate</div><div class="valore verde">+ ${eur(entrate)}</div></div>
    <div class="casella"><div class="titolo">Uscite</div><div class="valore rosso">− ${eur(uscite)}</div></div>
    <div class="casella"><div class="titolo">Bilancio</div><div class="valore ${bilancio >= 0 ? "verde" : "rosso"}">${bilancio >= 0 ? "+" : "−"} ${eur(Math.abs(bilancio))}</div></div>
  </div>`;
}

/* ================================================================
   6. PAGINA MOVIMENTI (Home)
   ================================================================ */
function renderMovimenti() {
  let ms = movimentiNelPeriodo();
  let banner = "";
  if (stato.filtro) {   // filtro attivo: solo i movimenti di categoria, conto o giorno
    banner = bannerFiltro();
    ms = ms.filter(m => corrispondeFiltro(m, stato.filtro));
  }
  ms = ms.sort((a, b) => b.data.localeCompare(a.data) || b.id - a.id);

  // Raggruppamento per giorno
  const gruppi = [];
  for (const m of ms) {
    const g = gruppi.find(x => x.data === m.data);
    g ? g.movs.push(m) : gruppi.push({data: m.data, movs: [m]});
  }

  let lista = "";
  const oggi = iso(new Date());
  const ieri = ieriIso();
  for (const g of gruppi) {
    lista += `<div class="giorno"><span>${nomeGiorno(g.data, oggi, ieri)}</span></div>`;
    for (const m of g.movs) lista += rigaMovimento(m);
  }
  if (!ms.length) lista = `<div class="vuoto">${speseProgrammate()
    ? "Nessuna spesa programmata per ora." : "Nessun movimento in questo periodo."}</div>`;

  return {kpi: kpiHtml(ms), corpo: banner + `<div class="corpo">${lista}</div>`};
}

// Un movimento corrisponde al filtro categoria/conto/giorno/budget attivo?
// Il filtro budget è il dettaglio di un budget: solo le spese delle sue categorie
function corrispondeFiltro(m, f) {
  if (f.tipo === "categoria") {
    const c = cat(m.categoria);
    return (c ? String(c.id) : "nessuna") === f.id;
  }
  // Il filtro giorno arriva dal tocco sulla sintesi del flusso: le uscite di quel giorno
  if (f.tipo === "giorno") return m.tipo === "uscita" && m.data === f.id;
  if (f.tipo === "budget") {
    const b = dati.budget.find(x => x.id === Number(f.id));
    return m.tipo === "uscita" && !!b && b.categorie.includes(m.categoria);
  }
  return String(m.conto) === f.id;
}

// Dalla pagina Analisi: tocca categoria, conto o giorno per vederne solo i
// movimenti. Si ricorda da dove è partito il filtro: il ✕ è un ritorno, non un resta lì
function filtraPer(tipo, id) {
  // Il filtro è una schermata: il tasto indietro la richiude e riporta indietro
  storiaApri();
  stato.filtro = {tipo, id: String(id), da: stato.pagina};
  vai("movimenti");
}
function togliFiltro() {
  // Il dettaglio di un budget è una schermata: il ✕ la richiude e torna ai budget
  if (stato.filtro?.tipo === "budget") return chiudiBudgetDettaglio();
  const da = stato.filtro?.da;
  stato.filtro = null;
  storiaTogli();   // la voce del filtro: col tasto indietro l'ha già tolta il browser
  // Filtro aperto da Analisi: il ✕ riporta alla pagina di provenienza
  if (da && da !== stato.pagina) return vai(da);
  render();
}

// Etichetta del filtro attivo, sopra la lista movimenti
function bannerFiltro() {
  const f = stato.filtro;
  let ico, nome;
  if (f.tipo === "categoria") {
    const c = f.id === "nessuna" ? null : cat(Number(f.id));
    ico = icona(c ? c.icona : "domanda"); nome = c ? c.nome : "Senza categoria";
  } else if (f.tipo === "budget") {
    const b = dati.budget.find(x => x.id === Number(f.id));
    ico = icona("bersaglio"); nome = b ? b.nome : "Budget";
  } else if (f.tipo === "giorno") {
    ico = icona("calendario"); nome = nomeGiorno(f.id);
  } else {
    const co = conto(Number(f.id));
    ico = icona(co ? co.icona : "portafoglio"); nome = co ? co.nome : "Conto";
  }
  return `<div class="banner-filtro"><span>${ico} ${esc(nome)}</span>
    <button onclick="togliFiltro()" aria-label="Togli filtro">✕</button></div>`;
}

let nuovoMov = null;   // l'ultimo movimento salvato: per l'entrata animata

function rigaMovimento(m) {
  const c = cat(m.categoria), co = conto(m.conto);
  const ico = icona(c ? c.icona : "portafoglio");
  const titolo = c ? c.nome : "Movimento";
  // Il disegno dell'icona non passa da esc(): si concatenano le parti già ripulite
  const parti = [];
  if (co) parti.push(icona(co.icona) + " " + esc(co.nome));
  if (m.nota) parti.push(esc(m.nota));
  const sotto = parti.join(" – ");
  const segno = m.tipo === "entrata" ? "+" : "−";
  // Il movimento appena salvato porta la classe per un solo giro di
  // rendering: qui l'entrata animata consuma il segnale
  const nuovo = m.id === nuovoMov;
  if (nuovo) nuovoMov = null;
  return `<div class="mov${nuovo ? " nuovo" : ""}" onclick="apriModifica(${m.id})">
    <div class="icona-mov">${ico}</div>
    <div class="info">
      <div class="titolo">${esc(titolo)}</div>
      ${sotto ? `<div class="sotto">${sotto}</div>` : ""}
    </div>
    <div class="importo ${m.tipo === "entrata" ? "verde" : "rosso"}">${segno} ${eur(m.importo)}</div>
  </div>`;
}

/* ================================================================
   7. PAGINA ANALISI (solo uscite)
   Torta statica con legenda affiancata + lista categorie con barre.
   ================================================================ */
function corpoCategorie() {
  const ms = movimentiNelPeriodo().filter(m => m.tipo === "uscita");

  // Aggregazione per categoria
  const gruppi = new Map();
  for (const m of ms) {
    const c = cat(m.categoria);
    const k = c ? c.id : "nessuna";
    const g = gruppi.get(k) || {k, nome: c ? c.nome : "Senza categoria",
                                ico: icona(c ? c.icona : "domanda"), slot: c?.colore, totale: 0};
    g.totale += m.importo;
    gruppi.set(k, g);
  }

  const voci = [...gruppi.values()].sort((a, b) => b.totale - a.totale);
  const totale = voci.reduce((s, v) => s + v.totale, 0);

  let corpo = "";
  if (!voci.length) corpo = `<div class="vuoto">Nessuna spesa in questo periodo.</div>`;
  else {
    const C = 2 * Math.PI * 60;   // grafico a torta: anelli SVG
    const GAP = voci.length > 1 ? C * 2 / 360 : 0;   // il filo d'aria tra gli spicchi (2°)
    let acc = 0, segmenti = "", legenda = "", barre = "";
    voci.forEach(v => {
      v.perc = totale ? v.totale / totale * 100 : 0;
      // Il colore è lo slot assegnato alla categoria (neutro chi non ce l'ha):
      // var() va nello style, negli attributi di presentazione non funziona
      const col = v.slot ? `var(--cat-${v.slot})` : "var(--neutro)";
      const len = C * v.perc / 100;
      // Ogni spicchio respira: un filo d'aria per lato lo stacca dai
      // vicini, così anche una fetta sottile si legge come fetta e non
      // come un refuso di rendering. Chi è più stretto dell'aria resta
      // un filetto, ma mai sotto il minimo visibile, centrato nel suo arco
      const dash = Math.max(len - GAP, Math.min(len, 1.5));
      const ini = acc + (len - dash) / 2;
      segmenti += `<circle r="60" cx="80" cy="80" fill="none" stroke-width="34" style="stroke:${col}"
        stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${(-ini).toFixed(2)}" transform="rotate(-90 80 80)"/>`;
      acc += len;
      legenda += `<div class="voce"><span class="pallino" style="background:${col}"></span>${esc(v.nome)}</div>`;
      barre += `<div class="riga-cat" onclick="filtraPer('categoria','${v.k}')">
        <div class="testa"><span>${v.ico} ${esc(v.nome)}</span><span>${eur(v.totale)}</span></div>
        <div class="riga-barra">
          <div class="barra"><div class="riempimento" style="width:${v.perc}%;background:${col}"></div></div>
          <span class="perc">${v.perc.toFixed(1).replace(".", ",")}%</span>
        </div>
      </div>`;
    });
    // Sintesi per conto: solo la somma delle uscite, senza grafico
    const perConto = dati.conti.map(co => ({
      id: co.id, ico: icona(co.icona), nome: co.nome,
      totale: arrotonda(ms.filter(m => m.conto === co.id).reduce((s, m) => s + m.importo, 0))
    })).filter(x => x.totale > 0).sort((a, b) => b.totale - a.totale);
    if (perConto.length) barre += perConto.map(v => `<div class="riga-conto" onclick="filtraPer('conto','${v.id}')">
        <div class="testa"><span>${v.ico} ${esc(v.nome)}</span><span>${eur(v.totale)}</span></div>
      </div>`).join("");
    corpo = `<div class="torta">
        <svg viewBox="0 0 160 160" width="150" height="150" style="flex:none">${segmenti}</svg>
        <div class="legenda">${legenda}</div>
      </div>${barre}`;
  }

  return corpo;
}

/* ---- Analisi: le due pagine (Categorie e Flusso giornaliero) ----
   Il selettore sta in cima al corpo, sotto la fascia fissa: scorre con
   la pagina. La pagina aperta non si ricorda: si riparte da Categorie. */
function renderAnalisi() {
  const corpo = selettoreAnalisi()
    + (stato.analisiScheda === "flusso" ? corpoFlusso() : corpoCategorie());
  return {kpi: kpiHtml(movimentiNelPeriodo()), corpo: `<div class="corpo">${corpo}</div>`};
}

const selettoreAnalisi = () => `<div class="schede-analisi">
  <button class="${stato.analisiScheda === "flusso" ? "" : "sel"}" onclick="vaiSchedaAnalisi('categorie')">Categorie</button>
  <button class="${stato.analisiScheda === "flusso" ? "sel" : ""}" onclick="vaiSchedaAnalisi('flusso')">Flusso giornaliero</button>
</div>`;

function vaiSchedaAnalisi(s) {
  if (stato.analisiScheda === s) return;
  stato.analisiScheda = s;
  render();
}

/* ---- La pagina del flusso ----
   Quali linee sono nascoste si ricorda da una seduta all'altra: sta
   nelle impostazioni, come il tema scuro, e viaggia col backup. */
const lineaNascosta = q => dati.impostazioni.flusso?.["nascondi" + cap(q)] === true;

function toggleLinea(q) {
  const f = dati.impostazioni.flusso ?? (dati.impostazioni.flusso = {});
  f["nascondi" + cap(q)] = !lineaNascosta(q);
  salvaImpostazioni();
  render();
}

function corpoFlusso() {
  const p = periodo(), ms = movimentiNelPeriodo();
  const mostraE = !lineaNascosta("entrate"), mostraU = !lineaNascosta("uscite");

  if (!ms.length) return `<div class="vuoto">Nessun movimento in questo periodo.</div>`;

  /* I giorni dell'asse: tutti quelli del periodo, anche quelli senza
     movimenti. I periodi senza fine (le spese programmate) si riducono
     ai soli giorni che hanno movimenti, l'asse infinito non si disegna */
  const giorni = [];
  if ((p.a - p.da) / 864e5 > 92) {
    for (const m of ms) if (!giorni.includes(m.data)) giorni.push(m.data);
    giorni.sort();
  } else for (let d = new Date(p.da); d <= p.a; d.setDate(d.getDate() + 1)) giorni.push(iso(d));
  if (!giorni.length) return `<div class="vuoto">Nessun movimento in questo periodo.</div>`;

  // I totali di ogni giorno, con le etichette dei gruppi di Movimenti
  const perGiorno = new Map();
  for (const g of giorni) perGiorno.set(g, {entrata: 0, uscita: 0});
  for (const m of ms) { const g = perGiorno.get(m.data); if (g) g[m.tipo] += m.importo; }

  // La scala segue le linee visibili: nascosta una, l'altra respira.
  // Ma ha un pavimento: non scende mai sotto i 200 € — nei periodi
  // poveri i piccoli restano piccoli, non si gonfiano fino al cielo
  // (regola di Daniele, 27 ott: le y si scalano sugli importi, da 200 in su)
  let maxVal = giorni.reduce((m, g) => {
    const t = perGiorno.get(g);
    return Math.max(m, mostraE ? t.entrata : 0, mostraU ? t.uscita : 0);
  }, 0);
  if (maxVal > 0 && maxVal < 200) maxVal = 200;   // il pavimento: senza movimenti la scala resta a zero

  /* Il grafico: un tratto sottile per linea, con uno snodo (puntino
     più spesso del filo) su ogni giorno che ha avuto movimento — la
     spesa si legge puntuale, non solo come profilo. Sotto il picco
     delle entrate il numero del giorno (verde). Sull'asse in fondo i
     numeri dei giorni con uscite; dove sarebbero troppo fitti, se ne
     salta uno. Sopra i quattro picchi di spesa più alti l'importo in
     rosso: se due etichette si pesterebbero i piedi, resta quella con
     l'importo più alto e le altre si nascondono; se è una linea del
     grafico a passarle sopra, prima si sposta un filo — di lato mai
     oltre la mezza distanza tra i giorni, salvo due scuse oneste: il
     picco che domina i vicini porta l'etichetta alta sopra le loro
     teste, e il bordo del disegno può spingerla nella striscia dove
     nessun punto abita; senza posto né scuse si nasconde pure lei.
     L'importo del massimo in alto a sinistra resta solo quando nessun
     picco porta il suo (le uscite nascoste, per dire, non lascerebbero
     leggere nessuna scala) */
  let grafico = `<div class="vuoto">Tutte e due le linee sono nascoste.</div>`;
  if (mostraE || mostraU) {
    const L = 8, S = 20, F = 14, W = 320, H = 168;   // lati, sopra, fondo, lato, altezza
    const n = giorni.length;
    const passo = n > 1 ? (W - 2 * L) / (n - 1) : 0;
    const x = i => L + i * passo;
    const y = v => maxVal > 0 ? H - F - (v / maxVal) * (H - S - F) : H - F;
    const puntiDi = tipo => giorni.map((g, i) => [x(i), y(perGiorno.get(g)[tipo])]);
    const punti = tipo => puntiDi(tipo).map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    // Gli snodi: un puntino su ogni giorno che ha avuto davvero un
    // movimento. Il tratto sottile li lega, il punto dice la spesa —
    // e segnano anche il periodo di un giorno solo (Libero chiuso
    // ieri), dove una polylinea di un punto non si vedrebbe
    const snodi = (tipo, col) => giorni.map((g, i) => perGiorno.get(g)[tipo] > 0
      ? `<circle cx="${x(i).toFixed(1)}" cy="${y(perGiorno.get(g)[tipo]).toFixed(1)}" r="3" style="fill:${col}"/>` : "").join("");
    const picco = tipo => {
      let mi = 0, mv = -1;
      giorni.forEach((g, i) => { const v = perGiorno.get(g)[tipo]; if (v > mv) { mv = v; mi = i; } });
      return mv > 0 ? {x: x(mi), testo: String(Number(giorni[mi].slice(8)))} : null;
    };
    const etichette = [];
    // lo style e non l'attributo fill: il CSS del grafico scrive fill:neutro
    // sui text, e un attributo di presentazione perderebbe sempre contro di lui
    const pe = mostraE ? picco("entrata") : null;
    if (pe) {
      etichette.push(`<text x="${pe.x.toFixed(1)}" y="${H - 3}" text-anchor="middle" style="fill:var(--verde)">${pe.testo}</text>`);
    }
    // Le tacche dell'asse: il numero del giorno sotto ogni giorno con uscite.
    // Dove sarebbero troppo fitte se ne salta una (13px di lato l'una dall'altra),
    // e nessuna va a pestare i piedi al numero verde del picco delle entrate,
    // che sta pure lui qua sotto, ovunque sia capitato il picco
    if (mostraU) {
      const verdeX = pe ? pe.x : -99;
      let ultimoTick = -99;
      giorni.forEach((g, i) => {
        const px = x(i);
        if (perGiorno.get(g).uscita > 0 && px - ultimoTick >= 13 && Math.abs(px - verdeX) >= 13) {
          etichette.push(`<text x="${px.toFixed(1)}" y="${H - 3}" text-anchor="middle">${Number(g.slice(8))}</text>`);
          ultimoTick = px;
        }
      });
    }
    // Gli importi dei quattro giorni di spesa più alti, rosso come la sua
    // linea: letti lì per lì, senza andare a pescare nella sintesi. Se due
    // etichette si pesterebbero davvero i piedi, resta quella con l'importo
    // più alto e le altre si nascondono (richiesta di Daniele). Se invece è
    // una linea del grafico a passarle sopra, prima si sposta un filo — su,
    // giù o di lato, sempre restando del suo picco — e solo quando non c'è
    // proprio posto si nasconde pure lei
    let conImporti = false;
    if (mostraU) {
      const picchi = giorni.map((g, i) => ({i, v: perGiorno.get(g).uscita}))
        .filter(p => p.v > 0).sort((a, b) => b.v - a.v).slice(0, 4);
      const occupati = [];   // [sinistra, destra, quota] delle etichette in piazza
      const mezzo = t => {   // mezza larghezza a 9px: cifre ed € contano il doppio del resto
        let w = 2;   // un filo d'aria ai lati
        for (const c of t) w += /[0-9€]/.test(c) ? 5.2 : 2.6;
        return w / 2;
      };
      // Le linee visibili, come coppie di punti: servono a capire se
      // un'etichetta ci finisce sotto (lo spessore del tratto sta nel margine)
      const linee = [];
      if (mostraE) linee.push(puntiDi("entrata"));
      linee.push(puntiDi("uscita"));
      // La linea attraversa la finestra dell'etichetta? Segmento per
      // segmento, alla quota dove la retta entra ed esce dalla finestra
      const lineaPassa = (ax, bx, ay, by) => linee.some(pts => pts.some((p, k) => {
        if (!k) return false;
        const [x1, y1] = pts[k - 1], [x2, y2] = p;
        if (Math.max(x1, x2) < ax || Math.min(x1, x2) > bx) return false;   // segmento fuori
        const sc = x2 - x1 || 1e-9;
        const ta = Math.max(0, Math.min(1, (ax - x1) / sc));
        const tb = Math.max(0, Math.min(1, (bx - x1) / sc));
        const qa = y1 + (y2 - y1) * ta, qb = y1 + (y2 - y1) * tb;
        return Math.max(qa, qb) >= ay && Math.min(qa, qb) <= by;
      }));
      // I posti dove un'etichetta può provarsi, in ordine di preferenza:
      // prima dov'è, poi su/giù di poco, poi di lato, poi entrambi — mai
      // oltre 18 di quota e 28 di lato: deve restare del suo picco
      const PROVE = [[0, 0]];
      // ...ma di lato c'è un limite: mai oltre la mezza distanza tra i
      // giorni — oltre, l'etichetta parrebbe di un altro punto. Due
      // scuse oneste però le permettono di uscire (regola di Daniele,
      // 27 ott): o vola alta sopra la testa di ogni snodo che tocca —
      // il picco che domina i vicini si capisce anche spostata — o a
      // spingerla è stato solo il bordo del disegno, nella striscia
      // dove non abita nessun punto. L'83,49 dell'1 del mese, bassa
      // come il vicino del 3, non ha scuse: meglio nascosta che ambigua
      const confine = passo > 0 ? passo / 2 : 1e9;   // periodo di un giorno solo: il punto è quello, confine inesistente
      for (const [dv, dl] of [[6,0],[0,10],[6,10],[12,0],[0,20],[12,10],
                              [6,20],[12,20],[18,0],[0,28],[18,20],[12,28],[18,28]])
        for (const sv of (dv ? [1, -1] : [1]))
          for (const sl of (dl ? [1, -1] : [1]))
            PROVE.push([dv * sv, dl * sl]);
      for (const p of picchi) {
        const t = eur(arrotonda(p.v)), m = mezzo(t);
        const cx0 = Math.min(Math.max(x(p.i), L + m), W - L - m);   // mai fuori dal disegno
        const base = y(p.v) - 7;   // il suo posto naturale: un filo sopra il picco
        // sul posto naturale c'è già un altro importo: si nasconde, non si
        // accavalla (regola di Daniele: vince l'importo più alto)
        if (occupati.some(o => cx0 - m < o[1] && cx0 + m > o[0] && Math.abs(base - o[2]) < 11)) continue;
        // una linea le passa sopra? si sposta; se nessun posto va bene, si nasconde
        let cx = -1, py = -1;
        for (const [dv, dl] of PROVE) {
          const c2 = Math.min(Math.max(cx0 + dl, L + m), W - L - m);
          const q = base + dv;
          if (q < 13 || q > 150) continue;   // mai sopra il cielo né giù nell'asse
          // oltre il confine servono le scuse: il cielo o il bordo
          if (Math.abs(c2 - x(p.i)) > confine) {
            const teste = [];   // le teste degli snodi che finiscono sotto la sua ala
            giorni.forEach((g, j) => {
              if (j === p.i) return;
              const tg = perGiorno.get(g);
              if ((tg.uscita > 0 || (mostraE && tg.entrata > 0)) && x(j) >= c2 - m && x(j) <= c2 + m)
                teste.push(y(Math.max(tg.uscita, mostraE ? tg.entrata : 0)));
            });
            // il cielo: la casa naturale vola almeno 18px sopra ogni testa toccata
            // (troppo in alto per sembrare loro) e il candidato non scende sotto
            // casa sua — la prominenza non si fabbrica scendendo di quota
            const cielo = teste.length > 0 && base <= Math.min(...teste) - 18 && q <= base;
            // il bordo: ha spinto solo il disegno (la casa era già dentro i
            // margini) e sotto l'ala non c'è proprio nessuno
            const bordo = Math.abs(c2 - cx0) <= confine && !teste.length;
            if (!cielo && !bordo) continue;   // senza scuse: troppo lontana dal suo picco, parrebbe di un altro punto
          }
          if (occupati.some(o => c2 - m < o[1] && c2 + m > o[0] && Math.abs(q - o[2]) < 11)) continue;
          if (lineaPassa(c2 - m - 2, c2 + m + 2, q - 9, q + 4)) continue;
          cx = c2; py = q;
          break;
        }
        if (cx < 0) continue;   // né lo spazio né uno spostamento piccolo la salvano
        etichette.push(`<text x="${cx.toFixed(1)}" text-anchor="middle" y="${py.toFixed(1)}" style="fill:var(--rosso)">${t}</text>`);
        occupati.push([cx - m, cx + m, py]);
        conImporti = true;
      }
    }
    grafico = `<svg class="grafico-flusso" viewBox="0 0 ${W} ${H}">
      ${conImporti ? "" : `<text x="0" y="10">${eur(maxVal)}</text>`}
      ${mostraE ? `<polyline points="${punti("entrata")}" style="stroke:var(--verde)"/>` : ""}
      ${mostraU ? `<polyline points="${punti("uscita")}" style="stroke:var(--rosso)"/>` : ""}
      ${mostraE ? snodi("entrata", "var(--verde)") : ""}${mostraU ? snodi("uscita", "var(--rosso)") : ""}
      ${etichette.join("")}
    </svg>`;
  }

  // I due pulsanti: acceso = la linea si vede
  const pulsanti = `<div class="pulsanti-flusso">
    <button class="entrata${mostraE ? " sel" : ""}" onclick="toggleLinea('entrate')">Entrate</button>
    <button class="uscita${mostraU ? " sel" : ""}" onclick="toggleLinea('uscite')">Uscite</button>
  </div>`;

  /* La sintesi per giorno: classifica delle uscite dal giorno più vorace;
     le righe si toccano e filtrano i movimenti di quel giorno, come le
     categorie nell'altra pagina. I giorni a zero si riuniscono in una
     sola riga in fondo (richiesta di Daniele) — quella non si tocca */
  const conUscite = giorni.filter(g => perGiorno.get(g).uscita > 0)
    .sort((a, b) => perGiorno.get(b).uscita - perGiorno.get(a).uscita);
  const totUscite = conUscite.reduce((s, g) => s + perGiorno.get(g).uscita, 0);
  const oggiI = iso(new Date()), ieriI = ieriIso();
  let sintesi = "";
  for (const g of conUscite) {
    const tot = arrotonda(perGiorno.get(g).uscita);
    const perc = totUscite ? tot / totUscite * 100 : 0;
    sintesi += `<div class="riga-cat" onclick="filtraPer('giorno','${g}')">
      <div class="testa"><span>${nomeGiorno(g, oggiI, ieriI)}</span><span>${eur(tot)}</span></div>
      <div class="riga-barra"><div class="barra"><div class="riempimento" style="width:${perc}%;background:var(--rosso)"></div></div>
        <span class="perc">${perc.toFixed(1).replace(".", ",")}%</span></div>
    </div>`;
  }
  const zero = giorni.length - conUscite.length;
  if (zero > 0) sintesi += `<div class="riga-cat riga-statica"><div class="testa">
    <span class="neutro">${zero} giorn${zero === 1 ? "o" : "i"} senza uscite</span>
    <span class="neutro">${eur(0)}</span></div></div>`;

  return grafico + pulsanti + sintesi;
}

/* ================================================================
   8. PAGINA BUDGETS
   Un budget ha un nome personalizzato e può coprire più categorie:
   somma le spese di tutte le categorie scelte nel periodo.
   ================================================================ */
function spesaBudget(b, ms) {
  return arrotonda(ms.filter(m => m.tipo === "uscita" && b.categorie.includes(m.categoria))
    .reduce((s, m) => s + m.importo, 0));
}

function renderBudget() {
  // Nelle spese programmate i budget non c'entrano: il futuro non è ancora speso
  if (speseProgrammate()) return {kpi: "",
    corpo: `<div class="corpo"><div class="vuoto">I budget non tengono conto delle spese programmate.</div></div>`};
  const ms = movimentiNelPeriodo();
  let righe = "";
  for (const b of dati.budget) {
    const speso = spesaBudget(b, ms);
    const rimanente = arrotonda(b.limite - speso);
    const sforato = speso > b.limite;
    const lim = b.limite > 0 ? b.limite : 1;
    // Parziale di ogni categoria che ha speso qualcosa, in ordine alfabetico
    const parziali = categorieOrdinate().filter(c => b.categorie.includes(c.id))
      .map(c => ({c, euro: arrotonda(spesaBudget({categorie: [c.id]}, ms))}))
      .filter(x => x.euro > 0);
    // Barra a segmenti: un pezzo per categoria, largo come la sua parte del
    // limite. Il colore NON è quello della torta di Analisi: i segmenti
    // seguono la scala di blu della palette (Blu bruma) per posizione, e
    // oltre la quarta tinta si ricomincia (possono ripetersi: qui l'unicità
    // non serve). Se sforato i pezzi si stringono per stare nel 100% della
    // barra, che è sempre e comunque il limite (e diventano rossi: il CSS
    // .sforato vince su --col)
    const scala = speso > lim ? lim / speso : 1;
    const segmenti = parziali.map((x, i) =>
      `<span style="width:${Math.min(100, x.euro * scala / lim * 100).toFixed(2)}%;--col:var(--bud-${i % 4 + 1})"></span>`).join("");
    // Sotto la barra i traguardi: da ogni confine un filo scende fino alla
    // riga della sua etichetta e si ferma alla BASE delle lettere (font
    // 10px in una riga da 16: le lettere finiscono ~12px dentro la riga),
    // senza sporgere sotto. La scritta comincia appena DOPO il filo; se da
    // lì sforerebbe il margine destro (in prima riga c'è il limite, che
    // non si muove mai) si sposta tutta PRIMA del filo, ancorata al filo
    // col suo bordo DESTRO: la stima di larghezza è volutamente prudente
    // (serve per gli scontri) e ancorare col bordo sinistro lasciava un
    // vuoto tra scritta e filo pari all'errore di stima; col bordo destro
    // la vicinanza al filo è esatta comunque. I marcatori si valutano da
    // sinistra a destra: chi tocca una scritta già posata scende di una
    // riga e il filo si allunga fino alla sua riga (scende sempre almeno
    // una).
    // Con una sola categoria i traguardi intermedi non servono: resta la
    // barra, che si conclude col limite in fondo (scelta di Daniele)
    const RIGA = 16, PIEDE = 12, CAR = 1.7, GAP = 1, DIETRO = 0.5;   // riga in px, base lettere in px, carattere stimato in %, stacco dal filo, stacco quando la scritta va prima del filo
    const tFine = `${num(b.limite)} €`;
    const filiT = [], etichT = [];
    let nRighe = 1;
    if (b.categorie.length > 1) {
      const fineSx = 100 - tFine.length * CAR;   // tratto della prima riga già occupato dal limite
      const fineRiga = [];                       // per ogni riga, il bordo destro dell'ultima etichetta
      let cum = 0;
      const marc = parziali.map(x => {
        cum += x.euro;
        return {x, pos: Math.min(100, cum * scala / lim * 100)};
      }).sort((a, b) => a.pos - b.pos);          // si valuta da sinistra a destra
      for (const m of marc) {
        const testo = `${m.x.c.nome}: ${num(m.x.euro)} €`;
        const lar = testo.length * CAR;
        let r = 0, sx = 0, prima = false;
        for (;;) {
          if (r > 6) { sx = Math.max(0, Math.min(m.pos + GAP, 100 - GAP - lar)); break; }   // caso estremo: clampato nei margini
          const margine = (r === 0 ? fineSx : 100) - GAP;   // oltre questo bordo destro non si va
          if (m.pos + GAP + lar <= margine) { sx = m.pos + GAP; prima = false; }   // dopo il filo
          else if (m.pos - DIETRO >= lar && (r > 0 || m.pos - DIETRO <= margine)) {   // prima del filo (sotto la prima riga il bordo destro è il filo stesso: resta sempre dentro lo schermo)
            sx = m.pos - DIETRO - lar; prima = true;   // sx qui conta solo per gli scontri: il bordo destro vero della scritta è il filo
          }
          else { r++; continue; }   // in questa riga non ci sta: scende
          if (sx > (fineRiga[r] ?? -1) + GAP) break;   // libera: si posa
          r++;                                        // tocca una scritta già posata: riga sotto
        }
        fineRiga[r] = Math.max(fineRiga[r] ?? -1, sx + lar);
        nRighe = Math.max(nRighe, r + 1);
        filiT.push(`<span class="filo" style="left:${m.pos.toFixed(2)}%;height:${r * RIGA + PIEDE}px"></span>`);
        // Prima del filo la scritta si ancora col bordo destro al filo, così lo stacco non dipende dalla stima
        const ancora = prima ? `right:${(100 - m.pos + DIETRO).toFixed(2)}%` : `left:${sx.toFixed(2)}%`;
        etichT.push(`<span class="etichetta" style="${ancora};top:${r * RIGA}px">${esc(testo)}</span>`);
      }
    }
    righe += `<div class="riga-budget ${sforato ? "sforato" : ""}" onclick="apriBudgetDettaglio(${b.id})">
      <div class="testa"><span class="icona-budget">${icona("bersaglio")}</span><span class="nome">${esc(b.nome)}</span>
        <button class="tre-punti" id="puntini-budget-${b.id}" onclick="event.stopPropagation();menuBudget(${b.id})">⋮</button></div>
      <div class="dati"><span>Limite: <b>${eur(b.limite)}</b></span><span>Speso: <b>${eur(speso)}</b></span></div>
      <div class="rimanente">${sforato ? "Sforato di: " + eur(-rimanente) : "Rimanente: " + eur(rimanente)}</div>
      <div class="barra-segmenti">${segmenti}</div>
      <div class="traguardi" style="height:${nRighe * RIGA}px">${filiT.join("")}${etichT.join("")}
        <span class="etichetta fine">${esc(tFine)}</span></div>
    </div>`;
  }
  if (!dati.budget.length) righe = `<div class="vuoto">Nessun budget impostato.</div>`;

  return {kpi: kpiHtml(null), corpo: `<div class="corpo">${righe}
    <button class="btn-secondario senza-bordo" onclick="apriBudgetModale(null)">${icona("piu")} Imposta budget</button></div>`};
}

// Seleziona/deseleziona una categoria del budget
function scegliCatBudget(id, btn) {
  const i = stato._budgetSel.indexOf(id);
  if (i >= 0) { stato._budgetSel.splice(i, 1); btn.classList.remove("sel"); }
  else { stato._budgetSel.push(id); btn.classList.add("sel"); }
}

async function salvaBudget(id) {
  const nome = document.getElementById("bNome").value.trim();
  const categorie = [...stato._budgetSel];
  const limite = parseFloat(String(document.getElementById("bLimite").value).replace(",", "."));
  if (!nome || !categorie.length || !(limite > 0))
    return apriModale(`<h3>Budget incompleto</h3>
      <p class="avviso">Serve un nome, almeno una categoria e un limite di spesa.</p>
      <button class="btn-principale" onclick="chiudiModale()">OK</button>`);
  if (id) {
    const b = dati.budget.find(x => x.id === id);
    b.nome = nome; b.categorie = categorie; b.limite = arrotonda(limite);
    await dbSalva("budget", b);
  } else {
    // Il nuovo budget nasce in fondo alla pagina (l'ordine si sposta dal menù ⋮)
    const b = {nome, categorie, limite: arrotonda(limite),
               ordine: dati.budget.reduce((m, x) => Math.max(m, x.ordine ?? 0), 0) + 1};
    await dbSalva("budget", b); dati.budget.push(b);
  }
  chiudiModale(); render();
}

function menuBudget(id) {
  // Menù locale ancorato ai puntini: le voci sono funzioni vere, e le voci
  // di spostamento non si offrono quando non c'è nulla da scambiare
  // (primo e ultimo della pagina)
  const i = dati.budget.findIndex(b => b.id === id);
  const voci = [{testo: "Modifica", azione: () => apriBudgetModale(id)}];
  if (i > 0) voci.push({testo: "Sposta sopra", azione: () => spostaBudget(id, -1)});
  if (i >= 0 && i < dati.budget.length - 1) voci.push({testo: "Sposta sotto", azione: () => spostaBudget(id, 1)});
  voci.push({testo: "Elimina", azione: () => eliminaBudget(id), pericoloso: true});
  apriMenuLocale("puntini-budget-" + id, voci);
}

// Sposta un budget su o giù nell'ordine della pagina Budget: si scambiano i
// numeri d'ordine dei due vicini (il primo non va sopra, l'ultimo non va
// sotto). Prima si ridisegna lo schermo e poi si persiste: la scheda si
// muove subito, e si muove anche se il salvataggio non torna
async function spostaBudget(id, dir) {
  const i = dati.budget.findIndex(b => b.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= dati.budget.length) return;
  const mosso = dati.budget[i], vicino = dati.budget[j];
  [mosso.ordine, vicino.ordine] = [vicino.ordine, mosso.ordine];
  dati.budget.sort((a, b) => (a.ordine ?? 1e9) - (b.ordine ?? 1e9));   // la pagina segue l'ordine
  render();
  await dbSalva("budget", mosso); await dbSalva("budget", vicino);
}

async function eliminaBudget(id) {
  await dbElimina("budget", id);
  dati.budget = dati.budget.filter(b => b.id !== id);
  render();
}

// Swipe verso il basso sul foglio in cima: scende e si chiude (solo touch)
function attivaSwipeFoglio(chiudi = chiudiForm) {
  const foglio = document.querySelector(".sheet");
  if (!foglio) return;
  let y0 = null, tirato = 0;

  foglio.addEventListener("touchstart", e => {
    y0 = foglio.scrollTop <= 0 ? e.touches[0].clientY : null;   // parte solo se è in cima
    tirato = 0;
  }, {passive: true});

  foglio.addEventListener("touchmove", e => {
    if (y0 === null) return;
    tirato = e.touches[0].clientY - y0;
    if (tirato <= 0) { foglio.style.transform = ""; return; }
    e.preventDefault();   // la pagina dietro non deve scorrere
    foglio.style.transition = "none";
    foglio.style.transform = "translateY(" + tirato + "px)";
  }, {passive: false});

  const fine = () => {
    if (y0 === null) return;
    y0 = null;
    if (tirato > 90) {   // tirato abbastanza: giù e chiuso, senza salvare nulla
      foglio.style.transition = "transform .22s ease-in";
      foglio.style.transform = "translateY(100%)";
      setTimeout(chiudi, 220);
    } else if (tirato > 0) {   // troppo poco: torna su
      foglio.style.transition = "transform .2s ease-out";
      foglio.style.transform = "";
      setTimeout(() => foglio.style.transition = "", 200);
    }
  };
  foglio.addEventListener("touchend", fine);
  foglio.addEventListener("touchcancel", fine);
}

// Swipe orizzontale (solo touch): decide tutto il tratto netto del dito, dalla
// partenza al rilascio — largo e più largo che alto. Durante il gesto l'asse
// si dichiara solo "orizzontale" (e anche a metà): il colpo secco col pollice
// curva un attimo verso il basso prima di correre di lato e non va condannato
// per quello; il "verticale" non lo dichiara mai il codice, se è davvero scroll
// il gesto se lo prende il browser e arriva un touchcancel che azzera lo swipe.
// Ridisegnare durante il tocco farebbe accendere e spegnere di colpo il bottone
// premuto (la fascia bassa "sussulta"); lo scroll verticale non è disturbato
function attivaSwipeOrizzontale(el, sinistra, destra) {
  if (!el) return;
  let x0 = null, y0 = null, orizzontale = false, scattato = false;

  el.addEventListener("touchstart", e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    orizzontale = false; scattato = false;
  }, {passive: true});

  el.addEventListener("touchmove", e => {
    if (x0 === null) return;
    // Nella schermata di tracciamento lo swipe è disabilitato per decisione
    // esplicita di Daniele (11 nov 2026): il pan orizzontale del grafico è
    // dello scorrimento nativo, e il preventDefault qui lo bloccherebbe
    if (stato.pagina === "tracciamento") return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if (!orizzontale && !(Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy))) return;
    orizzontale = true;
    e.preventDefault();
  }, {passive: false});

  // A fine gesto conta solo il tratto netto, dalla partenza al rilascio
  // (changedTouches, la posizione vera del dito — nei gesti veloci l'ultimo
  // touchmove resta indietro): largo oltre la soglia e più largo che alto.
  // Chi riporta il dito vicino alla partenza prima di alzarlo annulla.
  // L'azione parte subito DOPO, fuori dalla consegna dell'evento: cambiare
  // il DOM dentro il touchend lascia il riconoscitore dei click "spento"
  // su iPhone e il primo tocco dopo lo swipe non verrebbe registrato
  // (lo scroll invece sì)
  const fine = e => {
    let va = false, verso = false;
    if (x0 !== null && e.type === "touchend" && e.changedTouches && e.changedTouches[0]) {
      const xf = e.changedTouches[0].clientX - x0, yf = e.changedTouches[0].clientY - y0;
      va = Math.abs(xf) > 70 && Math.abs(xf) > Math.abs(yf);
      verso = xf < 0;
    }
    x0 = null; orizzontale = false;
    if (!va) return;
    scattato = true;
    setTimeout(() => verso ? sinistra() : destra(), 0);
  };
  el.addEventListener("touchend", fine);
  el.addEventListener("touchcancel", fine);

  // Assicurazione anti click fantasma: se il browser genera un click per lo
  // swipe appena finito, non deve raggiungere i pulsanti sotto il dito
  el.addEventListener("click", e => {
    if (!scattato) return;
    scattato = false;
    e.preventDefault();
    e.stopPropagation();
  }, true);
}

// Sposta il periodo col swipe: verso sinistra quello successivo (come girare

/* ---- Controlli del form ---- */
function tasto(t) {
  let s = stato.importoStr;
  const coda = () => (s.match(/[\d,]+$/) || [""])[0];   // numero in corso di digitazione
  if (t === "⌫") s = s.slice(0, -1);
  else if (t === "+" || t === "−" || t === "×" || t === "÷") {
    // Un operatore va solo tra due numeri: mai all'inizio, mai doppio
    if (s && !"+−×÷".includes(s.slice(-1))) s += t;
  } else if (t === ",") {
    const n = coda();
    if (n && !n.includes(",")) s += t;
    else if (!n) s += "0,";
  } else {
    const n = coda();
    const decimali = n.includes(",") ? n.split(",")[1].length : 0;
    if (decimali >= 2) return;
    s = n === "0" ? s.slice(0, -1) + t : s + t;
  }
  stato.importoStr = s;
  document.querySelector(".importo-display").textContent = "€ " + (s || "0");
}

// Valuta l'espressione del tastierino (numeri con virgola; × e ÷ hanno la precedenza)
function calcola(s) {
  const pezzi = s.match(/\d+(?:,\d+)?|[+−×÷]/g) || [];
  if (!pezzi.length || pezzi.length % 2 === 0) return NaN;   // espressione vuota o incompleta
  let n = parseFloat(pezzi[0].replace(",", "."));
  if (isNaN(n)) return NaN;
  const parziali = [n];
  for (let i = 1; i < pezzi.length; i += 2) {
    const v = parseFloat(pezzi[i + 1].replace(",", "."));
    if (isNaN(v)) return NaN;
    if (pezzi[i] === "÷" && v === 0) return NaN;   // divisione per zero
    if (pezzi[i] === "×") parziali[parziali.length - 1] *= v;
    else if (pezzi[i] === "÷") parziali[parziali.length - 1] /= v;
    else parziali.push(pezzi[i] === "+" ? v : -v);
  }
  return arrotonda(parziali.reduce((a, b) => a + b, 0));
}

    : `<div class="avviso">Nessuna categoria per questa direzione.</div>`}
    <button class="btn-secondario" onclick="chiudiModale();apriNuovoTag('categoria','form')">＋ Nuova categoria</button>
    <button class="btn-secondario" onclick="scegliCategoria(null)">Nessuna categoria</button>
  `);
}

function scegliCategoria(id) {
  stato.categoria = id;
  chiudiModale(); leggiCampiTesto(); render();
}

// Conserva la nota digitata attraverso i re-render del form
function leggiCampiTesto() {
  const n = document.getElementById("fNota");
  if (n) stato._nota = n.value;
}

// Calendario generico: data del movimento (senza limiti), chiusura del
// periodo o modifica di un periodo (solo giorni validi: min e max in ISO)
function apriCalendario(contesto, extra) {
  leggiCampiTesto();
  stato._cal = contesto
    ? {contesto, min: null, max: null, ...extra}
    : {contesto: "movimento", data: stato._data, min: null, max: null};
  const d = new Date((stato._cal.data || iso(new Date())) + "T12:00:00");
  stato._calAnno = d.getFullYear(); stato._calMese = d.getMonth();
  renderCalendario();
}

function spostaCalendario(dir) {
  stato._calMese += dir;
  if (stato._calMese < 0)  { stato._calMese = 11; stato._calAnno--; }
  if (stato._calMese > 11) { stato._calMese = 0;  stato._calAnno++; }
  // Il mese nuovo entra scivolando come i periodi: la direzione la dice il gesto
  stato._calDir = dir > 0 ? "entra-dx" : "entra-sx";
  renderCalendario();
}

function renderCalendario() {
  const anno = stato._calAnno, mese = stato._calMese, c = stato._cal;
  const inizio = (new Date(anno, mese, 1).getDay() + 6) % 7;   // la settimana parte dal lunedì
  const giorni = new Date(anno, mese + 1, 0).getDate();
  const oggiIso = iso(new Date());
  let celle = ["L","M","M","G","V","S","D"].map(x => `<span class="cal-testa">${x}</span>`).join("");
  for (let i = 0; i < inizio; i++) celle += "<span></span>";
  for (let g = 1; g <= giorni; g++) {
    const isoGiorno = iso(new Date(anno, mese, g));
    // Giorno fuori dai limiti d'uso: visibile ma non scegliibile
    if ((c.min && isoGiorno < c.min) || (c.max && isoGiorno > c.max)) {
      celle += `<button disabled>${g}</button>`;
      continue;
    }
    celle += `<button class="${isoGiorno === c.data ? "sel" : isoGiorno === oggiIso ? "oggi" : ""}" onclick="scegliData('${isoGiorno}')">${g}</button>`;
  }
  // Rettangolo di dimensione fissa: le settimane mancanti si riempiono di
  // celle vuote fino alla sesta (il massimo che un mese può occupare)
  for (let i = inizio + giorni; i < 42; i++) celle += "<span></span>";
  apriModale(`
    <div class="cal-testata">
      <button class="btn-freccia" onclick="spostaCalendario(-1)">‹</button>
      <span class="mese">${cap(MESI[mese])} ${anno}</span>
      <button class="btn-freccia" onclick="spostaCalendario(1)">›</button>
    </div>
    <div class="cal-grid${stato._calDir ? " " + stato._calDir : ""}">${celle}</div>`, "centrata");
  stato._calDir = null;   // consumato: all'apertura e alle scelte la griglia non anima
  // Swipe per cambiare mese, come le frecce della testata
  attivaSwipeOrizzontale(document.querySelector(".cal-grid"),
    () => spostaCalendario(1), () => spostaCalendario(-1));
}

function scegliData(g) {
  const c = stato._cal || {contesto: "movimento"};
  chiudiModale();
  if (c.contesto === "chiusura") return chiudiPeriodo(g);
  if (c.contesto === "periodo") return applicaDataPeriodo(c.indice, c.campo, g);
  stato._data = g;
  render();
}

async function salvaMovimento() {
  const importo = calcola(stato.importoStr);
  if (!(importo > 0) || !Number.isFinite(importo))
    return apriModale(`<h3>Importo non valido</h3>
      <p class="avviso">Digita un importo completo con il tastierino.</p>
      <button class="btn-principale" onclick="chiudiModale()">OK</button>`);
  leggiCampiTesto();
  const m = {
    tipo: stato.direzione, importo: arrotonda(importo),
    data: stato._data || iso(new Date()),
    nota: stato._nota.trim() || null,
    conto: stato.contoSel || dati.impostazioni.contoDefault,
    categoria: stato.categoria
  };
  if (stato.modifica) {
    m.id = stato.modifica;
    await dbSalva("movimenti", m);
    const i = dati.movimenti.findIndex(x => x.id === m.id);
    dati.movimenti[i] = m;
  } else {
    await dbSalva("movimenti", m);
    dati.movimenti.push(m);
    nuovoMov = m.id;   // l'entrata animata è la conferma visiva del salvataggio
  }
  vai(stato.dietro);   // il foglio si chiude sulla pagina da cui era partito
}

function eliminaMovimento() {
  apriConferma("Eliminare questo movimento?", async () => {
    await dbElimina("movimenti", stato.modifica);
    dati.movimenti = dati.movimenti.filter(m => m.id !== stato.modifica);
    chiudiModale(); vai(stato.dietro);
  });
}

function apriNuovoTag(tipo, contesto, idEsistente) {
  const esiste = idEsistente ? (tipo === "conto" ? conto(idEsistente) : cat(idEsistente)) : null;
  // L'icona è solo una delle ICONE: se il record ne porta una sconosciuta, si riparte dalla prima
  const ic = esiste && ICONE.includes(esiste.icona) ? esiste.icona : ICONE_RAPIDE[0];
  stato._tag = {tipo, contesto, id: idEsistente || null, icona: ic,
                pagina: Math.floor(Math.max(0, ICONE_DEL_PICKER.indexOf(ic)) / 30)};   // si parte dalla pagina dell'icona già scelta

  let corpo = `
    <div class="campo"><div class="etichetta-campo">Nome</div>
      <input type="text" id="tNome" maxlength="30" value="${esiste ? esc(esiste.nome) : ""}" placeholder="Es. Palestra"></div>
    <div class="campo"><div class="etichetta-campo">Icona</div>
      <div id="pannelloIcone">${pannelloIconeHtml()}</div></div>`;

  if (tipo === "categoria") {
    corpo += `
      <div class="campo"><div class="etichetta-campo">Direzione</div>
        <div class="toggle-direzione">
          <button class="uscita ${(!esiste || esiste.direzione === "uscita") ? "sel" : ""}" id="tDirU" onclick="scegliDirTag('uscita')">Uscita</button>
          <button class="entrata ${esiste && esiste.direzione === "entrata" ? "sel" : ""}" id="tDirE" onclick="scegliDirTag('entrata')">Entrata</button>
        </div></div>`;
  }

  const titoli = {conto: esiste ? "Modifica conto" : "Nuovo conto",
                  categoria: esiste ? "Modifica categoria" : "Nuova categoria"};
  apriModale(`<h3>${titoli[tipo]}</h3>
    ${corpo}
    <div class="azioni-modale">
      <button class="btn-secondario" onclick="chiudiModale()">Annulla</button>
      <button class="btn-principale" onclick="salvaTag()">Salva</button>
    </div>`);
}

function scegliDirTag(d) {
  document.getElementById("tDirU").classList.toggle("sel", d === "uscita");
  document.getElementById("tDirE").classList.toggle("sel", d === "entrata");
}

function scegliIcona(i, btn) {
  stato._tag.icona = i;
  btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("sel"));
  btn.classList.add("sel");
}

/* Il selettore icone mostra 30 disegni per pagina: le frecce scorrono
   ICONE_DEL_PICKER senza chiudere la modale né perdere il nome digitato */
function pannelloIconeHtml() {
  const per = 30, pag = stato._tag.pagina || 0;
  const pagine = Math.ceil(ICONE_DEL_PICKER.length / per);
  const blocco = ICONE_DEL_PICKER.slice(pag * per, (pag + 1) * per);
  return `<div class="griglia-icone">${blocco.map(i =>
      `<button class="${stato._tag.icona === i ? "sel" : ""}" onclick="scegliIcona('${i}', this)">${icona(i)}</button>`).join("")}</div>
    <div class="nav-icone">
      <button ${pag === 0 ? "disabled" : ""} onclick="paginaIcone(-1)" aria-label="Pagina precedente">‹</button>
      <span>${pag + 1}/${pagine}</span>
      <button ${pag === pagine - 1 ? "disabled" : ""} onclick="paginaIcone(1)" aria-label="Pagina successiva">›</button>
    </div>`;
}
function paginaIcone(d) {
  const per = 30, pagine = Math.ceil(ICONE_DEL_PICKER.length / per);
  // Mai oltre l'ultima pagina: le frecce si fermano ai bordi
  stato._tag.pagina = Math.min(pagine - 1, Math.max(0, (stato._tag.pagina || 0) + d));
  const p = document.getElementById("pannelloIcone");
  if (p) p.innerHTML = pannelloIconeHtml();
}

async function salvaTag() {
  const t = stato._tag;
  const nome = document.getElementById("tNome").value.trim();
  const ic = stato._tag.icona || "etichetta";
  if (!nome) return;

  if (t.tipo === "conto") {
    if (t.id) {
      const c = conto(t.id); c.nome = nome; c.icona = ic;
      await dbSalva("conti", c);
    } else {
      const c = {nome, icona: ic};
      await dbSalva("conti", c); dati.conti.push(c);
      if (stato.pagina === "form") stato.contoSel = c.id;   // preselezione nel form movimento
    }
    chiudiModale(); return aggiornaDopoTag(null);
  }

  // Categoria
  const dir = document.getElementById("tDirE").classList.contains("sel") ? "entrata" : "uscita";
  let c = t.id ? cat(t.id) : null;

  if (c) {   // modifica
    c.nome = nome; c.icona = ic; c.direzione = dir;
    await dbSalva("categorie", c);
    chiudiModale(); return aggiornaDopoTag(null);
  }

  // Creazione: la nuova categoria nasce in fondo alla lista (l'ordine si sposta da Impostazioni)
  // e prende il primo slot colore libero, così la torta non ne ruba uno a chi c'è già
  c = {nome, icona: ic, direzione: dir, colore: slotLibero(),
       ordine: dati.categorie.reduce((m, x) => Math.max(m, x.ordine ?? 0), 0) + 1};
  await dbSalva("categorie", c); dati.categorie.push(c);
  chiudiModale(); aggiornaDopoTag(c);
}

// Dopo la creazione/modifica di un tag: aggiorna la schermata di provenienza
function aggiornaDopoTag(nuovaCat) {
  if (stato._tag.contesto === "form" && stato.pagina === "form" && nuovaCat) {
    stato.categoria = nuovaCat.id;   // preseleziona la categoria appena creata
    stato.direzione = nuovaCat.direzione === "entrata" ? "entrata" : "uscita";
  }
  render();
}

/* ---- Tema: chiaro di giorno, scuro di notte, come dice il sistema.
   L'interruttore serve a chi vuole il tema scuro ANCHE di giorno: spento
   (o mai toccato) l'app segue il sistema. Il «chiaro forzato» non esiste:
   di notte il telefono è scuro e l'app con lui ---- */
// matchMedia può mancare (anteprima): si resta sul chiaro, salvo forzatura
const temaAttivoScuro = () => dati.impostazioni?.temaScuro === true
  || (window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)").matches : false);

function applicaTema() {
  const scuro = temaAttivoScuro();
  // Nell'anteprima senza DOM vero documentElement non esiste: si salta e basta.
  // Le fasce di sistema non possono seguire il tema del telefono: col cielo
  // fisso di Blu bruma la barra è #4f5f70 una volta per tutte (il meta è
  // statico nell'head), e qui si aggiorna solo il color-scheme del contenuto
  // data-scuro segue il tema RISOLTO: la forzatura accesa, o la notte del sistema
  if (document.documentElement) document.documentElement.toggleAttribute("data-scuro", scuro);
}

async function toggleTema() {
  dati.impostazioni.temaScuro = !dati.impostazioni.temaScuro;
  applicaTema();   // prima lo schermo, poi il disco
  renderTenendoIlFoglio();
  await salvaImpostazioni();
}

/* Il backup automatico: acceso di default (spento si salva esplicito).
   L'interruttore comanda solo le foto di giornata; quelle di
   sicurezza prima di una sostituzione restano sempre */
async function toggleBackupAuto() {
  const acceso = dati.impostazioni.backupAuto !== false;   // assente = acceso
  dati.impostazioni.backupAuto = !acceso;
  renderTenendoIlFoglio();
  await salvaImpostazioni();
}

function renderPeriodi() {
  const ps = periodiOrdinati();

    return d.getDate() + " " + MESI_BREVI[d.getMonth()] + " " + d.getFullYear(); };

      <span class="trattino">–</span>
      <button class="btn-campo-scelta" onclick="apriCalPeriodo(${i},'fine')">${breve(ps[i].fine)}</button>
    </div>`;

  document.getElementById("app").innerHTML = `
    <div class="intestazione-pagina">

    </div>

      <div class="riga-periodo aperta">
