function chiudiBannerMemoria() { if (bannerMemoriaEl) bannerMemoriaEl.classList.add("nascosto"); }

/* Il corpo del backup: quello che viaggia nell'export manuale e dentro
   le istantanee automatiche (stesso formato versione 3, così un'istantanea
   si può anche importare da fuori come un backup qualunque) */
const corpoBackup = () => ({versione: 3, esportatoIl: iso(new Date()),
  movimenti: dati.movimenti, categorie: dati.categorie, conti: dati.conti,
  budget: dati.budget, periodi: dati.periodi, impostazioni: {...dati.impostazioni}});

function esportaJSON() {
  scarica(`finanze_backup_${iso(new Date())}.json`, JSON.stringify(corpoBackup(), null, 2), "application/json");
  toast("Backup esportato");
}

/* ---- Backup automatici (interruttore in Impostazioni → Dati) ----
   Al massimo TRE istantanee, dentro l'app (collezione "backup"): salvano
   da bug, import pasticciati e ripensamenti. NON salvano dalla pulizia
   del browser: l'unica copia fuori dall'app resta l'esportazione manuale
   (che non viene mai toccata: è un file scaricato, la rotazione riguarda
   solo le istantanee). Scatti:
   - "periodo": all'avvio, se l'ultima istantanea non è già di questo
     periodo — così in Settimanale e Mensile, che non si chiudono a mano,
     il cambio di mese/settimana fa la sua fotografia;
   - "chiusura": chiudendo un periodo in Libero, prima che il nuovo aperto
     compaia (l'etichetta è il periodo che INIZIA: il giorno dopo l'avvio
     non ne fa una gemella);
   - "sicurezza": SEMPRE, anche a interruttore spento, prima di sostituire
     tutti i dati (import, ripristino, dati di esempio): lo stato di prima
     resta recuperabile. Il motivo viaggia nel record (diagnostica), in
     pagina si vede solo la data: le diciture non aggiungono nulla */
const quandoBackup = b => { const d = new Date(b.quando);
  return d.getDate() + " " + MESI_BREVI[d.getMonth()] + " " + d.getFullYear()
    + ", " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };

async function backupAuto(tipo) {
  const b = {quando: Date.now(), motivo: tipo};
  if (tipo !== "sicurezza") {   // le istantanee di periodo: interruttore e una sola per periodo
    if (dati.impostazioni?.backupAuto === false) return;
    b.inizio = iso(periodo().da);
    if (dati.backup.some(x => x.inizio === b.inizio)) return;
  }
  b.dati = JSON.stringify(corpoBackup());
  await dbSalva("backup", b); dati.backup.push(b);
  // Rotazione: al massimo tre, il più vecchio se ne va
  while (dati.backup.length > 3) {
    const vecchio = dati.backup.reduce((m, x) => x.quando < m.quando ? x : m);
    await dbElimina("backup", vecchio.id);
    dati.backup = dati.backup.filter(x => x.id !== vecchio.id);
  }
}

// Campo CSV: i valori che iniziano con = + - @ potrebbero essere letti come
// formule da un foglio di calcolo, quindi vengono anticipati da un apice.
// Poi, se restano separatori o virgolette, il campo va racchiuso.
const escapeCSV = s => {
  s = String(s ?? "");
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[;",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};

function esportaCSV() {
  const nome = id => { const c = cat(id) || conto(id); return c ? escapeCSV(c.nome) : ""; };
  const righe = ["Data;Direzione;Importo;Categoria;Conto;Nota"];
  for (const m of [...dati.movimenti].sort((a, b) => a.data.localeCompare(b.data)))
    righe.push([escapeCSV(m.data), m.tipo, m.importo.toFixed(2).replace(".", ","),
      nome(m.categoria), nome(m.conto), escapeCSV(m.nota || "")].join(";"));
  scarica(`finanze_movimenti_${iso(new Date())}.csv`, "\ufeff" + righe.join("\r\n"), "text/csv");
}

function importaJSON(input) {
  const file = input.files[0]; if (!file) return;
  // Un backup vero pesa pochi MB: un file enorme non è un backup, e
  // leggerlo tutto solo per scoprirlo congelerebbe il telefono
  if (file.size > 10 * 1024 * 1024) {
    apriModale(`<h3>File non valido</h3><p class="avviso">Il file è troppo grande per essere un backup.</p>
      <button class="btn-principale" onclick="chiudiModale()">OK</button>`);
    input.value = "";
    return;
  }
  const fr = new FileReader();
  fr.onload = () => {
    let b;
    try {
      b = JSON.parse(fr.result);
      if (!Array.isArray(b.movimenti) || !Array.isArray(b.categorie)) throw new Error();
    } catch {
      apriModale(`<h3>File non valido</h3><p class="avviso">Il file non è un backup riconosciuto.</p>
        <button class="btn-principale" onclick="chiudiModale()">OK</button>`);
      input.value = "";
      return;
    }
    apriConferma("Importare il backup? I dati attuali verranno sostituiti.", async () =>
      await sostituisciDati(b, "Importazione non riuscita"));
    input.value = "";
  };
  fr.readAsText(file);
}

/* Il ripristino di un'istantanea automatica: la stessa strada dell'import */
function ripristinaBackup(id) {
  const b = dati.backup.find(x => x.id === id); if (!b) return;
  apriConferma(`Ripristinare il backup del ${quandoBackup(b)}? I dati attuali verranno sostituiti.`, async () => {
    let rip = null;
    try { rip = JSON.parse(b.dati); } catch {}   // un'istantanea rovinata: lo dice la sostituzione
    await sostituisciDati(rip, "Ripristino non riuscito");
  });
}

/* La sostituzione integrale dei dati: la fanno l'import e il ripristino.
   PRIMA lo stato attuale diventa un'istantanea di sicurezza (sempre,
   anche a interruttore spento: uno sbaglio deve poter tornare indietro),
   poi tutto si normalizza e solo se niente è saltato i dati nuovi
   prendono il posto dei vecchi — o tutto o niente */
async function sostituisciDati(b, titolo) {
  try {
    if (!b || !Array.isArray(b.movimenti) || !Array.isArray(b.categorie)) throw new Error("backup");
    await backupAuto("sicurezza");
    // Un id che arriva da fuori vale solo se è un numero intero positivo,
    // mai ripetuto: tutto il resto diventa null e al salvataggio gliene
    // viene assegnato uno nuovo (niente roba iniettabile negli onclick)
    const fabbricaId = () => { const v = new Set(); return x =>
      (Number.isInteger(x) && x > 0 && !v.has(x) && v.add(x)) ? x : null; };
    const idCat = fabbricaId(), idConto = fabbricaId(), idBudget = fabbricaId();
    const rifOk = x => (Number.isInteger(x) && x > 0) ? x : null;   // riferimento in un movimento
    // Rende il backup compatibile: le sovra-categorie non esistono più.
    // I nomi diventano stringhe tagliate a 30 (come l'input dell'app): un
    // backup pasticciato con un nome non-stringa crasherebbe il sort
    // alfabetico. Il numero d'ordine viaggia col backup: quello scelto da
    // Daniele non va perso ripartendo dall'alfabeto. L'icona vale solo se
    // è una dello sprite; le emoji dei backup vecchi si traducono, il
    // resto diventa il fallback. Il colore anche: slot 1-21, mai due
    // categorie con lo stesso (le importate senza slot lo ereditano dopo)
    const slotVisti = new Set();
    const coloreOk = s => Number.isInteger(s) && s >= 1 && s <= 21 && !slotVisti.has(s) && slotVisti.add(s) ? s : undefined;
    b.categorie = b.categorie.filter(c => c.livello !== 1)
      .map(c => ({id: idCat(c.id), nome: String(c.nome ?? "").slice(0, 30),
                  icona: ICONE.includes(c.icona) ? c.icona : (DA_EMOJI[String(c.emoji)] ?? "etichetta"),
                  direzione: c.direzione === "entrata" ? "entrata" : "uscita",
                  colore: coloreOk(c.colore),
                  ordine: Number.isInteger(c.ordine) && c.ordine > 0 ? c.ordine : undefined}));
    // Anche i conti arrivano da fuori: nome e icona ripuliti nello stesso modo
    b.conti = (b.conti || []).map(c => ({id: idConto(c.id), nome: String(c.nome ?? "").slice(0, 30),
                  icona: ICONE.includes(c.icona) ? c.icona : (DA_EMOJI[String(c.emoji)] ?? "etichetta")}));
    // Movimenti: solo record riconoscibili, con tipi sicuri (mai fidarsi di un backup pasticciato)
    b.movimenti = b.movimenti.filter(m => m && (m.tipo === "entrata" || m.tipo === "uscita")
      && dataOk(String(m.data))
      && Number.isFinite(+m.importo) && +m.importo > 0)
      .map(m => ({tipo: m.tipo, importo: arrotonda(+m.importo), data: String(m.data),
                  nota: m.nota == null ? null : String(m.nota).slice(0, 80),
                  conto: rifOk(m.conto), categoria: rifOk(m.categoria)}));
    // I budget: limite sensato, nome sempre una stringa (i backup vecchi
    // col catId lo prendono dalla categoria puntata), categorie sempre come
    // array di id validi, e l'ordine che viaggia
    b.budget = (b.budget || []).filter(x => x && Number.isFinite(+x.limite) && +x.limite > 0)
      .map(x => {
        const cats = (Array.isArray(x.categorie) ? x.categorie
          : (x.catId != null ? [x.catId] : [])).filter(Number.isInteger);
        const nome = (Array.isArray(x.categorie)
          ? String(x.nome ?? "")
          : String((b.categorie.find(c => c.id === x.catId) || {}).nome ?? "")).slice(0, 30);
        return {id: idBudget(x.id), limite: arrotonda(+x.limite), nome: nome || "Budget",
                 categorie: cats,
                 ordine: Number.isInteger(x.ordine) && x.ordine > 0 ? x.ordine : undefined};
      });
    // I periodi chiusi (modalità Libero): solo date ben formate
    b.periodi = (b.periodi || []).filter(p =>
      dataOk(p.inizio) && dataOk(p.fine) && p.inizio <= p.fine)
      .map(p => ({inizio: p.inizio, fine: p.fine}));
    // Tutto si prepara nelle strutture qui sotto: i dati attuali restano
    // al loro posto finché la sostituzione non è riuscita davvero
    const nuovo = {movimenti: b.movimenti, categorie: b.categorie, conti: b.conti,
                   budget: b.budget, periodi: b.periodi};
    const imp = {...(b.impostazioni && typeof b.impostazioni === "object"
      ? b.impostazioni : {periodoModalita: "mensile", contoDefault: null})};
    imp.chiave = "app";
    imp.contoDefault = rifOk(imp.contoDefault);
    imp.temaScuro = imp.temaScuro === true;   // solo un booleano vero conta, il resto è rumore
    imp.backupAuto = imp.backupAuto !== false;   // il backup automatico è acceso salvo disdetta esplicita
    // Le linee nascoste del flusso: solo booleani, il resto è rumore iniettabile
    imp.flusso = {nascondiEntrate: imp.flusso?.nascondiEntrate === true,
                  nascondiUscite: imp.flusso?.nascondiUscite === true};
    // I backup delle versioni precedenti passano a Libero e generano i periodi
    const daLibera = imp.periodoModalita === "mensileLibera";
    if (daLibera) imp.periodoModalita = "libero";
    else if (!["settimanale","mensile","libero"].includes(imp.periodoModalita))
      imp.periodoModalita = "mensile";
    // Il giorno di reset va usato solo se è davvero un giorno: il resto
    // è roba iniettabile da un backup pasticciato
    const gReset = Number.isInteger(imp.resetGiorno) ? imp.resetGiorno : null;
    delete imp.resetGiorno;           // il giorno di reset non esiste più
    // In Libero l'aperto si riancora all'ultimo chiuso, o si genera da zero
    if (imp.periodoModalita === "libero") {
      if (nuovo.periodi.length) {
        const ord = [...nuovo.periodi].sort((x, y) => x.inizio.localeCompare(y.inizio));
        const fine = ord[ord.length - 1].fine;
        // liberoInizio deve restare una data ISO: una stringa qualsiasi
        // passata dal backup romperebbe il periodo aperto
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(imp.liberoInizio ?? "")) || imp.liberoInizio <= fine)
          imp.liberoInizio = domaniDi(fine);
      } else {
        const gen = generaPeriodiLibero(daLibera, nuovo.movimenti, gReset);
        nuovo.periodi = gen.chiusi;
        imp.liberoInizio = gen.inizioAperto;
      }
    }
    // Id freschi per i record senza un id valido: il prossimo record
    // nuovo dell'app partirà oltre a quelli importati
    for (const s of ["movimenti", "categorie", "conti", "budget", "periodi"]) {
      let id = nuovo[s].reduce((m, o) => Math.max(m, o.id || 0), 0) + 1;
      for (const o of nuovo[s]) if (o.id == null) o.id = id++;
      dati._id[s] = id;
    }
    if (db) {
      // Sostituzione in un'unica transazione: o entra tutto, o niente
      await new Promise((ris, err) => {
        const tx = db.transaction(["movimenti","categorie","conti","budget","periodi","impostazioni"], "readwrite");
        for (const s of ["movimenti", "categorie", "conti", "budget", "periodi"]) {
          const o = tx.objectStore(s);
          o.clear();
          for (const x of nuovo[s]) o.put(x);
        }
        tx.objectStore("impostazioni").put(imp);
        tx.oncomplete = ris;
        tx.onerror = () => err(tx.error || new Error("transazione"));
        tx.onabort = () => err(tx.error || new Error("annullata"));
      });
    }
    // Solo ora che i nuovi dati sono davvero al loro posto, l'app li usa
    for (const s of ["movimenti", "categorie", "conti", "budget", "periodi"]) dati[s] = nuovo[s];
    dati.impostazioni = imp;
    await assegnaOrdine();   // i backup senza numeri d'ordine ereditano quello della lista
    await assegnaColori();   // e chi è arrivato senza slot colore prende il primo libero
    // Si torna come da un foglio Impostazioni chiuso: così anche la sua
    // voce nella cronologia se ne va, e il tasto indietro non resta orfano
    chiudiModale(); stato.offset = 0; stato.filtro = null; vai(stato.dietro);
  } catch (e) {
    // Onesto: se qualcosa salta DOPO la transazione riuscita il database è
    // già sostituito — ma l'istantanea di sicurezza conserva lo stato di prima
    apriModale(`<h3>${titolo}</h3>
      <p class="avviso">O i dati attuali sono rimasti al loro posto, o lo stato di prima resta comunque nell'ultima istantanea di sicurezza. (${e && e.name ? e.name : "errore"})</p>
      <button class="btn-principale" onclick="chiudiModale()">OK</button>`);
  }
}

/* ================================================================
   13. DATI DI ESEMPIO, CANCELLAZIONE TOTALE, MODALI, AVVIO
   ================================================================ */
async function svuotaDati() {
  for (const s of ["movimenti", "categorie", "conti", "budget", "periodi", "impostazioni"])
    if (db) await prom(tabella(s, "readwrite").clear());
  dati.movimenti = []; dati.categorie = []; dati.conti = []; dati.budget = [];
  dati.periodi = []; dati.impostazioni = null;
  // Le istantanee sopravvivono allo svuotamento: il loro contatore id continua
  dati._id = {movimenti: 1, categorie: 1, conti: 1, budget: 1, periodi: 1, backup: dati._id.backup};
}

function caricaEsempio() {
  apriConferma("Caricare dati di esempio? I dati attuali verranno sostituiti.", async () => {
    await backupAuto("sicurezza");   // anche l'esempio sostituisce tutto: lo stato di prima resta recuperabile
    await svuotaDati();
    await semina();
    const oggi = new Date();
    const trova = nome => dati.categorie.find(c => c.nome === nome).id;
    const spesa = trova("Spesa"), caffe = trova("Caffè"), fuori = trova("Mangiare fuori"),

    const contanti = idConto("Contanti"), contoB = idConto("Carta"), satispay = idConto("Satispay");
    const d = giorni => { const x = new Date(oggi); x.setDate(oggi.getDate() - giorni); return iso(x); };
    const esempi = [
      {tipo: "entrata", importo: 2400,    data: d(2), nota: "Stipendio",        conto: contoB,   categoria: stipendio},
      {tipo: "uscita",  importo: 520,     data: d(2), nota: "Affitto",          conto: contoB,   categoria: casa},
      {tipo: "uscita",  importo: 45.60,   data: d(0), nota: "Supermercato",     conto: satispay, categoria: spesa},
      {tipo: "uscita",  importo: 1.30,    data: d(0), nota: "Caffè al bar",     conto: contanti, categoria: caffe},
      {tipo: "uscita",  importo: 12.50,   data: d(1), nota: "Pizzeria",         conto: contanti, categoria: fuori},
      {tipo: "uscita",  importo: 32.10,   data: d(1), nota: "Spesa",           conto: satispay, categoria: spesa},
      {tipo: "uscita",  importo: 8.40,    data: d(3), nota: "Caffè e cornetto", conto: contanti, categoria: caffe},
      {tipo: "uscita",  importo: 15.90,   data: d(4), nota: "Spesa",            conto: contoB,   categoria: spesa}
    ];
    for (const e of esempi) {
      await dbSalva("movimenti", e); dati.movimenti.push(e);
    }
    for (const [nome, cats, limite] of [["Supermercato e caffè", [spesa, caffe], 220], ["Solo caffè", [caffe], 20]]) {
      const b = {nome, categorie: cats, limite};
      await dbSalva("budget", b); dati.budget.push(b);
    }
    await assegnaOrdine();   // i budget d'esempio nascono SENZA numero d'ordine, ma l'avvio (che lo assegna) è già passato: senza questa riga il menù ⋮ li scambia senza muoverli
    chiudiModale(); stato.offset = 0; stato.filtro = null; vai(stato.dietro);
  });
}

function cancellaTutto() {
  apriConferma("Cancellare TUTTI i dati? L'operazione è definitiva.", () => {
    apriConferma("Confermi davvero? Non si può annullare.", async () => {
      await svuotaDati();

      for (const vecchia of [...dati.backup]) await dbElimina("backup", vecchia.id);
      dati.backup = [];
      await semina();
      chiudiModale(); stato.offset = 0; stato.filtro = null; vai(stato.dietro);
    });

}

/* ---- Modali generiche ---- */
function apriModale(html, classe) {

  if (!document.getElementById("overlay").className.includes("aperto")) storiaApri();
  document.getElementById("modale").innerHTML = html;
  const o = document.getElementById("overlay");

}
function chiudiModale() {
  const o = document.getElementById("overlay");
  if (o.className.includes("aperto")) storiaTogli();
  o.className = "overlay";
}
function eventoOverlay(e) { if (e.target.id === "overlay") chiudiModale(); }
function apriConferma(testo, azione) {

    <p class="avviso" style="font-size:15px;color:var(--testo)">${testo}</p>

/* ---- Menù locale dei tre puntini (categorie e budget) ----
   Pende dal punto toccato come il menù di chiusura del periodo, si
   chiude col tappeto o col tasto indietro, e lascia una voce nella
   cronologia come ogni altra schermata che copre.
   L'ancora la si cerca nel DOM vivo per id, non nell'evento: nell'anteprima
   l'evento consegnato all'onclick può avere il target staccato dal documento,
   col rettangolo tutto a zero — e il menù finiva in cima alla pagina */
function apriMenuLocale(ancoraId, voci) {
  if (stato._locale) return;
  const r = document.getElementById(ancoraId).getBoundingClientRect();
  const largo = 230, alto = voci.length * 48 + 10;
  const largoSchermo = window.innerWidth ?? 380, altoSchermo = window.innerHeight ?? 720;
  // A sinistra non oltre il bordo, a destra allineato al bottone: se ci sta,
  // il menù finisce dove finiscono i puntini
  const x = Math.max(8, Math.min(r.right - largo, largoSchermo - largo - 8));
  // Se sotto non c'è spazio, il menù si apre sopra il punto toccato
  const y = r.bottom + alto + 8 > altoSchermo ? r.top - alto - 8 : r.bottom + 4;
  stato._locale = {x, y, voci};
  storiaApri();
  renderTenendoIlFoglio();
}
function chiudiMenuLocale() {
  if (!stato._locale) return;
  stato._locale = null;
  storiaTogli();
  renderTenendoIlFoglio();
}
// La voce del menù: chiude e poi agisce. L'azione parte FUORI dalla consegna
// del click, come lo swipe: dentro l'evento il render di chiusura cambiava il
// DOM sotto il dito e su iPhone il riconoscitore dei click restava "spento",
// con lo spostamento dei budget che non scattava mai
function voceMenuLocale(i) {
  const voce = stato._locale && stato._locale.voci[i];
  if (!voce) return;
  chiudiMenuLocale();
  setTimeout(() => voce.azione(), 0);
}
// Il render ricostruisce anche il foglio Impostazioni, l'unico scrollabile
// suo: la lista non deve saltare in cima quando il menù si apre o si chiude
function renderTenendoIlFoglio() {
  const foglio = document.querySelector(".sheet");
  const scrollo = foglio ? foglio.scrollTop : 0;
  render();
  const rifatto = document.querySelector(".sheet");
  if (rifatto) rifatto.scrollTop = scrollo;
}

/* Numero d'ordine di categorie e budget: è quello che Daniele sposta dai tre
   puntini in Impostazioni e dal menù del budget. Chi non ce l'ha (dati vecchi
   o appena seminati) eredita l'ordine che già vedeva — alfabetico per le
   categorie, quello della lista per i budget — e viene salvato */
async function assegnaOrdine() {
  let max = dati.categorie.reduce((m, c) => Math.max(m, c.ordine ?? 0), 0);
  for (const c of categorieOrdinate()) if (c.ordine == null) { c.ordine = ++max; await dbSalva("categorie", c); }
  let maxB = dati.budget.reduce((m, b) => Math.max(m, b.ordine ?? 0), 0);
  for (const b of dati.budget) if (b.ordine == null) { b.ordine = ++maxB; await dbSalva("budget", b); }
  dati.budget.sort((a, b) => (a.ordine ?? 1e9) - (b.ordine ?? 1e9));   // la pagina segue l'ordine
}

/* Colore della categoria nella torta: uno slot stabile (1-21), assegnato
   alla nascita e mai più cambiato. Chi resta senza slot (dati vecchi o
   importati) eredita il primo libero, nello stesso ordine della lista */
const slotLibero = () => {
  const usati = new Set(dati.categorie.map(c => c.colore));
  for (let s = 1; s <= 21; s++) if (!usati.has(s)) return s;
  return 1;   // oltre le 21 categorie gli slot ricominciano (non capiterà)
};

async function assegnaColori() {
  for (const c of categorieOrdinate())
    if (!Number.isInteger(c.colore) || c.colore < 1 || c.colore > 21) {
      c.colore = slotLibero(); await dbSalva("categorie", c);
    }
}

/* ---- Migrazione dei dati salvati con versioni precedenti dell'app ---- */
async function migraDati() {
  // Una volta esistevano le sovra-categorie (categorie "livello 1"): eliminate
  for (const c of [...dati.categorie]) {
    if (c.livello === 1) { await dbElimina("categorie", c.id); dati.categorie = dati.categorie.filter(x => x.id !== c.id); }
    else if (c.padre != null) { c.padre = null; await dbSalva("categorie", c); }
  }
  // Le icone di una volta erano emoji: diventano gli id dello sprite Lucide
  for (const c of dati.categorie)
    if (!ICONE.includes(c.icona)) {
      c.icona = DA_EMOJI[String(c.emoji)] || "etichetta";
      delete c.emoji;
      await dbSalva("categorie", c);
    }
  for (const c of dati.conti)
    if (!ICONE.includes(c.icona)) {
      c.icona = DA_EMOJI[String(c.emoji)] || "etichetta";
      delete c.emoji;
      await dbSalva("conti", c);
    }
  // I budget vecchi puntavano a una sola categoria (catId)
  for (const b of [...dati.budget]) {
    if (b.categorie) continue;
    const c = b.catId != null ? dati.categorie.find(x => x.id === b.catId) : null;
    await dbElimina("budget", b.id);
    dati.budget = dati.budget.filter(x => x.id !== b.id);
    if (c) {
      const nb = {id: b.id, nome: c.nome, categorie: [c.id], limite: b.limite};
      await dbSalva("budget", nb); dati.budget.push(nb);
    }
  }
  // La vecchia modalità "mensile a data libera" (con giorno di reset) diventa Libero
  let cambiate = false;
  if (dati.impostazioni?.periodoModalita === "mensileLibera") {
    dati.impostazioni.periodoModalita = "libero";
    await attivaLibero(true);   // i cicli si ricostruiscono col giorno di reset
    delete dati.impostazioni.resetGiorno;
    cambiate = true;
  } else if (dati.impostazioni?.periodoModalita === "libero" &&
             !dati.periodi.length && !dati.impostazioni.liberoInizio) {
    // Libero attivato in passato ma mai generato (archivio vuoto alla prima volta)
    await attivaLibero(false);
    cambiate = true;
  }
  if (cambiate) await salvaImpostazioni();
  await assegnaOrdine();    // i dati vecchi prendono il numero d'ordine spostabile
  await assegnaColori();    // e il colore stabile della torta
}

/* ---- Tasto indietro del telefono ----
   Ogni schermata che copre le sezioni base (foglio del movimento, foglio
   Impostazioni, pagina Modifica periodi, menù a tendina, finestrella/modale,
   filtro di categoria o conto) lascia una voce nella cronologia del browser:
   il tasto indietro chiude la schermata aperta. Anche Analisi e Budget
   lasciano la loro voce (voceSezione): il tasto indietro riporta prima a
   Movimenti e da lì, col secondo colpo, esce dall'app. */
const PAGINE_SCHERMO = ["form", "impostazioni", "periodi"];
let pilaStoria = 0;          // voci messe nella cronologia e non ancora tolte
let storiaAspetta = false;   // in volo il popstate di una chiusura già fatta da noi
let spingeInAttesa = false;  // schermata aperta mentre quel popstate era in volo
let daIndietro = false;      // chiusura comandata dal tasto indietro: niente history.back
let voceSezione = false;     // la voce messa entrando in Analisi o Budget

function storiaApri() {
  // Se è in volo il back di una chiusura fatta un attimo prima (chiusa una
  // schermata e subito aperta un'altra nello stesso tocco, come menù →
  // calendario), la voce si mette quando quel back è arrivato: altrimenti
  // se la mangerebbe lui
  if (storiaAspetta) { spingeInAttesa = true; return; }
  pilaStoria++;
  try { history.pushState({schermata: true}, ""); } catch { pilaStoria--; }
}
function storiaTogli() {
  if (daIndietro || pilaStoria === 0) {
    // C'è una voce rimandata che non è mai partita e si sta chiudendo la
    // schermata che l'aveva chiesta: la voce si annulla e basta
    if (spingeInAttesa && pilaStoria === 0 && !daIndietro) spingeInAttesa = false;
    return;
  }
  pilaStoria--; storiaAspetta = true;
  try { history.back(); } catch {}
}

// Quale schermata è aperta, dalla più alta in cima
function chiudeSchermata() {
  if (document.getElementById("overlay").className.includes("aperto")) return chiudiModale;
  if (stato._locale) return chiudiMenuLocale;
  if (stato._menu) return chiudiMenu;
  if (stato.pagina === "form") return chiudiForm;
  if (stato.pagina === "impostazioni") return chiudiImpostazioni;
  if (stato.pagina === "periodi") return () => vai("impostazioni");
  if (stato.filtro?.tipo === "budget") return chiudiBudgetDettaglio;
  if (stato.filtro && stato.pagina === "movimenti") return togliFiltro;
  // Sezione Analisi o Budget: il tasto indietro riporta a Movimenti
  if (PAGINE.includes(stato.pagina) && stato.pagina !== "movimenti") {
    voceSezione = false;
    return () => vai("movimenti");
  }
  return null;
}

window.addEventListener("popstate", () => {
  if (storiaAspetta) {   // chiusa da noi con tasto, swipe o cambio pagina: la voce era già tolta
    storiaAspetta = false;
    if (spingeInAttesa) { spingeInAttesa = false; storiaApri(); }
    return;
  }
  // Tasto indietro: chiudi la schermata aperta, senza toccare la cronologia
  daIndietro = true;
  if (pilaStoria > 0) pilaStoria--;
  const chiudi = chiudeSchermata();
  if (chiudi) chiudi();
  daIndietro = false;
});

/* ---- Avvio ---- */
(async function avvio() {
  try { db = await apriDB(); } catch { db = null; }
  if (!db) bannerMemoria();   // rarissimo, ma meglio saperlo subito
  // Un archivio che si apre ma non si lascia leggere (corrotto) non deve
  // fermare l'app su schermo vuoto: si lavora in memoria, col banner a dirlo
  try { await caricaTutto(); } catch { db = null; bannerMemoria(); }
  await migraDati();
  await semina();
  await backupAuto("periodo");   // il primo avvio dentro un periodo nuovo ne fotografa l'inizio (una sola per periodo)
  if (navigator.storage?.persist) { try { await navigator.storage.persist(); } catch {} }
  applicaTema();
  // Il sistema può cambiare idea mentre l'app è aperta: lo si segue, salvo forzatura
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applicaTema);
  render();
  attivaSwipePeriodi();   // una volta sola: copre tutto lo schermo
  /* Il service worker porta l'app offline quando è pubblicata su un sito
     (https): in anteprima o da file locale non serve e non si registra */
  try {
    if (typeof location === "object" && location && location.protocol === "https:" && navigator.serviceWorker)
      navigator.serviceWorker.register("sw.js");
  } catch (e) {}
})();
</script>
