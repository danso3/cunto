      </div>
      ${ps.length ? `<div class="giorno">Periodi chiusi</div>` : ""}
      ${chiusi || `<div class="avviso">Nessun periodo chiuso per ora.</div>`}
    </div>`;
}

// Limiti del calendario: solo date che mantengano ogni periodo di almeno un giorno
function apriCalPeriodo(i, campo) {
  const ps = periodiOrdinati();
  let data, min, max;
  if (campo === "inizio") {        // apertura di un chiuso
    data = ps[i].inizio;
    min = i > 0 ? domaniDi(ps[i - 1].inizio) : null;
    max = ps[i].fine;
  } else {                         // chiusura di un chiuso
    data = ps[i].fine;
    min = ps[i].inizio;
    max = i < ps.length - 1 ? ieriDi(ps[i + 1].fine) : iso(new Date());
  }
  apriCalendario("periodo", {indice: i, campo, data, min, max});
}

// Applica la nuova data spostando il confine del vicino (mai buchi/sovrapposizioni)
async function applicaDataPeriodo(i, campo, g) {
  const ps = periodiOrdinati();
  if (campo === "inizio") {        // confine col chiuso precedente
    ps[i].inizio = g;
    if (i > 0) ps[i - 1].fine = ieriDi(g);
  } else {                         // confine col periodo successivo
    ps[i].fine = g;
    if (i < ps.length - 1) ps[i + 1].inizio = domaniDi(g);
    else dati.impostazioni.liberoInizio = domaniDi(g);   // l'aperto segue l'ultimo chiuso
  }
  for (const p of dati.periodi) await dbSalva("periodi", p);
  await salvaImpostazioni();
  renderPeriodi();
}

/* ---- Eliminazione sicura di categorie ---- */
/* I tre puntini di una categoria in Impostazioni: tutto quello che le si può
   fare sta qui dentro, come per i budget */
function menuCategoria(id) {
  // Menù locale ancorato ai puntini: le voci sono funzioni vere, e le voci
  // di spostamento non si offrono quando non c'è nulla da scambiare
  // (prima e ultima della lista)
  const lista = categorieOrdinate();
  const i = lista.findIndex(c => c.id === id);
  const voci = [{testo: "Modifica", azione: () => apriNuovoTag("categoria", "gestione", id)}];
  if (i > 0) voci.push({testo: "Sposta sopra", azione: () => spostaCategoria(id, -1)});
  if (i >= 0 && i < lista.length - 1) voci.push({testo: "Sposta sotto", azione: () => spostaCategoria(id, 1)});
  voci.push({testo: "Elimina", azione: () => apriEliminaCategoria(id), pericoloso: true});
  apriMenuLocale("puntini-cat-" + id, voci);
}

// Sposta una categoria su o giù nell'ordine scelto (lo stesso che si vede in
// Impostazioni e poi ovunque): si scambiano i numeri d'ordine dei due vicini.
// La prima non va sopra, l'ultima non va sotto. Prima si ridisegna lo schermo
// (col foglio che tiene il suo scroll) e poi si persiste
async function spostaCategoria(id, dir) {
  const lista = categorieOrdinate();
  const i = lista.findIndex(c => c.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= lista.length) return;
  const mosso = lista[i], vicino = lista[j];
  [mosso.ordine, vicino.ordine] = [vicino.ordine, mosso.ordine];
  renderTenendoIlFoglio();
  await dbSalva("categorie", mosso); await dbSalva("categorie", vicino);
}

function apriEliminaCategoria(id) {
  const c = cat(id);
  const usi = dati.movimenti.filter(m => m.categoria === id);

  if (!usi.length) return apriConferma(`Eliminare "${c.nome}"?`, async () => {
    await eliminaCategoria(id, null);
    chiudiModale(); render();
  });

  // Alternative di riassegnazione: categorie della stessa direzione, alfabetiche
  const alternative = categorieDi(c.direzione).filter(x => x.id !== id);
  stato._destCat = null;
  apriModale(`<h3>Eliminare "${esc(c.nome)}"?</h3>
    <p class="avviso">Ha ${usi.length} moviment${usi.length === 1 ? "o" : "i"} associat${usi.length === 1 ? "o" : "i"}.</p>
    <div class="campo"><div class="etichetta-campo">Cosa fare con quei movimenti?</div>
      <div class="lista-scelta">
        <button class="sel" onclick="scegliDestCat(null, this)">Rimuovi il tag dai movimenti</button>
        ${alternative.map(a => `<button onclick="scegliDestCat(${a.id}, this)">Riassegna a: ${icona(a.icona)} ${esc(a.nome)}</button>`).join("")}
      </div></div>
    <div class="azioni-modale">
      <button class="btn-secondario" onclick="chiudiModale()">Annulla</button>
      <button class="btn-pericoloso" onclick="confermaEliminaCategoria(${id})">Elimina</button>
    </div>`);
}

// Sceglie la destinazione dei movimenti durante l'eliminazione di una categoria
function scegliDestCat(id, btn) {
  stato._destCat = id;
  btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("sel"));
  btn.classList.add("sel");
}

async function confermaEliminaCategoria(id) {
  await eliminaCategoria(id, stato._destCat);
  chiudiModale(); render();
}

async function eliminaCategoria(id, destinazione) {
  // Aggiorna i movimenti che referenziano la categoria eliminata
  for (const m of dati.movimenti.filter(m => m.categoria === id)) {
    m.categoria = destinazione || null;
    await dbSalva("movimenti", m);
  }
  // I budget perdono la categoria; senza categorie rimaste si eliminano
  for (const b of [...dati.budget].filter(b => b.categorie.includes(id))) {
    b.categorie = b.categorie.filter(x => x !== id);
    if (b.categorie.length) { await dbSalva("budget", b); continue; }
    await dbElimina("budget", b.id);
    dati.budget = dati.budget.filter(x => x.id !== b.id);
  }

  await dbElimina("categorie", id);
  dati.categorie = dati.categorie.filter(x => x.id !== id);
}

/* ---- Eliminazione sicura di conti ---- */
function apriEliminaConto(id) {
  const c = conto(id);
  const usi = dati.movimenti.filter(m => m.conto === id);
  const alternative = dati.conti.filter(x => x.id !== id);
  if (!alternative.length) return apriModale(`<h3>Impossibile eliminare</h3>
    <p class="avviso">È l'unico conto presente: ogni movimento richiede un conto.</p>
    <button class="btn-principale" onclick="chiudiModale()">OK</button>`);
  if (usi.length) stato._destConto = alternative[0].id;   // destinazione predefinita
  apriModale(`<h3>Eliminare "${esc(c.nome)}"?</h3>
    ${usi.length ? `<p class="avviso">Ha ${usi.length} moviment${usi.length === 1 ? "o" : "i"} associat${usi.length === 1 ? "o" : "i"}.</p>
    <div class="campo"><div class="etichetta-campo">Riassegna quei movimenti a:</div>
      <div class="lista-scelta">
        ${alternative.map(a => `<button class="${a.id === alternative[0].id ? "sel" : ""}" onclick="scegliDestConto(${a.id}, this)">${icona(a.icona)} ${esc(a.nome)}</button>`).join("")}
      </div></div>` : `<p class="avviso">Nessun movimento associato.</p>`}
    <div class="azioni-modale">
      <button class="btn-secondario" onclick="chiudiModale()">Annulla</button>
      <button class="btn-pericoloso" onclick="confermaEliminaConto(${id})">Elimina</button>
    </div>`);
}

// Sceglie il conto di destinazione durante l'eliminazione di un conto
function scegliDestConto(id, btn) {
  stato._destConto = id;
  btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("sel"));
  btn.classList.add("sel");
}

async function confermaEliminaConto(id) {
  const dest = stato._destConto ?? null;
  for (const m of dati.movimenti.filter(m => m.conto === id)) {
    m.conto = dest;
    await dbSalva("movimenti", m);
  }
  if (dati.impostazioni.contoDefault === id) {
    dati.impostazioni.contoDefault = dati.conti.find(c => c.id !== id).id;
    await salvaImpostazioni();
  }
  await dbElimina("conti", id);
  dati.conti = dati.conti.filter(c => c.id !== id);
  chiudiModale(); render();
}

/* ================================================================
   12. EXPORT / IMPORT
   ================================================================ */
function scarica(nome, contenuto, tipo) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([contenuto], {type: tipo}));
  a.download = nome;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// Conferma corta che galleggia un attimo sopra la barra di navigazione
function toast(testo) {
  if (!document.body || !document.body.appendChild) return;   // anteprima senza DOM
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = testo;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* Se l'archivio del telefono (IndexedDB) non risponde — non dovrebbe mai
   succedere, ma meglio saperlo — un banner sopra la barra di navigazione
   avverte che ogni modifica vive solo in memoria e sparisce chiudendo l'app */
let bannerMemoriaEl = null;
function bannerMemoria() {
  if (db || !document.body || !document.body.appendChild) return;
  const b = document.createElement("div");
  b.id = "banner-memoria";
  b.className = "banner-memoria";
  b.innerHTML = '<svg class="ico" aria-hidden="true"><use href="#i-attenzione"/></svg>' +
    '<span><strong>Memoria temporanea.</strong> L\'archivio del telefono non risponde: ' +
    'le modifiche spariscono chiudendo l\'app. Un export manuale mette i dati al sicuro.</span>' +
    '<button class="x-banner" aria-label="Chiudi l\'avviso" onclick="chiudiBannerMemoria()">✕</button>';
  document.body.appendChild(b);
  bannerMemoriaEl = b;
}
function chiudiBannerMemoria() { if (bannerMemoriaEl) bannerMemoriaEl.classList.add("nascosto"); }

/* Il corpo del backup: quello che viaggia nell'export manuale e dentro
   le istantanee automatiche (stesso formato versione 4, così un'istantanea
   si può anche importare da fuori come un backup qualunque) */
const corpoBackup = () => ({versione: 4, esportatoIl: iso(new Date()),
  movimenti: dati.movimenti, categorie: dati.categorie, conti: dati.conti,
  budget: dati.budget, periodi: dati.periodi, tracciamento: dati.tracciamento,
  impostazioni: {...dati.impostazioni}});

/* Il promemoria dell'export manuale: l'unica copia dei dati che vive
   fuori dall'app è il file scaricato, e una copia scaricata due
   settimane fa è già un ricordo. La data dell'ultimo export JSON sta
   in localStorage («ultimoExport», il giorno in forma ISO) come lo
   sporco, con la stessa memoria di fortuna se il browser rifiuta la
   memoria; NON viaggia col backup: è un ricordo di questo telefono.
   Chi non ha mai esportato vede l'alone subito (nessuna copia è
   l'urgenza massima) e il CSV non conta: l'import accetta solo JSON.
   Si rilegge a ogni rendering, così il valore non resta mai appiccicato */
let ultimoExportVivo = null;   // memoria di fortuna senza localStorage
function promemoriaExport() {
  let ultima = null;
  try { ultima = localStorage.getItem("ultimoExport"); } catch { ultima = ultimoExportVivo; }
  if (!ultima || isNaN(Date.parse(ultima))) return true;   // mai scaricata (o data spastacciata)
  return (Date.parse(iso(new Date())) - Date.parse(ultima)) / 86400000 > 14;   // il quindicesimo giorno accende
}
function segnaExport() {
  ultimoExportVivo = iso(new Date());
  try { localStorage.setItem("ultimoExport", ultimoExportVivo); } catch {}
}

function esportaJSON() {
  scarica(`finanze_backup_${iso(new Date())}.json`, JSON.stringify(corpoBackup(), null, 2), "application/json");
  segnaExport();   // la copia fuori è fresca: l'alone del promemoria si spegne
  toast("Backup esportato");
  renderTenendoIlFoglio();   // ridisegna col foglio aperto: l'alone se ne va subito
}

/* ---- Backup automatici (interruttore in Impostazioni → Dati) ----
   Al massimo TRE istantanee, dentro l'app (collezione "backup"): salvano
   da bug, import pasticciati e ripensamenti. NON salvano dalla pulizia
   del browser: l'unica copia fuori dall'app resta l'esportazione manuale
   (che non viene mai toccata: è un file scaricato, la rotazione riguarda
   solo le istantanee). Scatti:
   - "giorno": alla CHIUSURA dell'app (pagina che si nasconde o se ne va),
     SOLO se qualcosa è cambiato dall'ultima fotografia — chi apre l'app
     per guardare non sporca la memoria. Una sola per giornata: l'ultima
     chiusura del giorno vince, tanto ogni azione scrive subito sul disco
     e la foto contiene comunque tutto;
   - "sicurezza": SEMPRE, anche a interruttore spento, prima di sostituire
     tutti i dati (import, ripristino, dati di esempio): lo stato di prima
     resta recuperabile. Il motivo viaggia nel record (diagnostica), in
     pagina si vede solo la data: le diciture non aggiungono nulla */
const quandoBackup = b => { const d = new Date(b.quando);
  return d.getDate() + " " + MESI_BREVI[d.getMonth()] + " " + d.getFullYear()
    + ", " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };

let fotoInCorso = false;   // semaforo della foto di giornata: una per volta
async function backupAuto(tipo) {
  // I due eventi di chiusura possono arrivare nella stessa manciata: senza
  // semaforo entrambi vedrebbero lo sporco acceso prima che la prima foto
  // finisca, e nascerebbero due foto dello stesso giorno, con due dei tre
  // slot occupati. La sicurezza non è in gara con nessuno: passa sempre
  if (tipo !== "sicurezza" && fotoInCorso) return;
  if (tipo !== "sicurezza") fotoInCorso = true;
  try { await backupAutoDentro(tipo); }
  finally { if (tipo !== "sicurezza") fotoInCorso = false; }   // si riapre anche se la foto è andata storta
}
async function backupAutoDentro(tipo) {
  const b = {quando: Date.now(), motivo: tipo};
  if (tipo !== "sicurezza") {   // la foto di giornata: interruttore, sporco e una sola al giorno
    if (dati.impostazioni?.backupAuto === false) return;
    if (!sporcoAcceso()) return;   // niente di nuovo: si guarda e basta
    b.giorno = iso(new Date());
    // la foto di oggi sostituisce la foto di oggi: l'ultima chiusura vince
    for (const vecchia of dati.backup.filter(x => x.motivo === "giorno" && x.giorno === b.giorno)) {
      await dbElimina("backup", vecchia.id);
      dati.backup = dati.backup.filter(x => x.id !== vecchia.id);
    }
  }
  b.dati = JSON.stringify(corpoBackup());
  await dbSalva("backup", b); dati.backup.push(b);
  sporcoPulito();   // fotografato: il database torna pulito fino alla prossima modifica
  // Rotazione: al massimo tre, il più vecchio se ne va
  while (dati.backup.length > 3) {
    const vecchio = dati.backup.reduce((m, x) => x.quando < m.quando ? x : m);
    await dbElimina("backup", vecchio.id);
    dati.backup = dati.backup.filter(x => x.id !== vecchio.id);
  }
}

/* La chiusura dell'app: quando lo schermo si nasconde (telefono in tasca,
   cambio app, schermo spento) o la pagina se ne va. I due eventi possono
   arrivare insieme: il semaforo lascia partire solo la prima fotografia,
   la seconda non ha più materia. Se il telefono ammazza l'app senza
   salutare, lo sporco resta acceso e il prossimo avvio fa la fotografia lui */
const fotografaGiornata = () => backupAuto("giorno");
if (document.addEventListener) document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") fotografaGiornata();
});
if (window.addEventListener) window.addEventListener("pagehide", fotografaGiornata);

// Campo CSV: i valori che iniziano con = + - @ potrebbero essere letti come
// formule da un foglio di calcolo, quindi vengono anticipati da un apice.
// Poi, se restano separatori o virgolette, il campo va racchiuso.
const escapeCSV = s => {
  s = String(s ?? "");
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[;",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};

function esportaCSV() {
  // Categoria e conto si cercano ognuno nella SUA collezione: gli id nascono
  // indipendenti (uno per collezione) e si sovrappongono, quindi una ricerca
  // unica metterebbe il nome della categoria nella colonna Conto
  const nomeCat = id => { const c = cat(id); return c ? escapeCSV(c.nome) : ""; };
  const nomeConto = id => { const c = conto(id); return c ? escapeCSV(c.nome) : ""; };
  const righe = ["Data;Direzione;Importo;Categoria;Conto;Nota"];
  for (const m of [...dati.movimenti].sort((a, b) => a.data.localeCompare(b.data)))
    righe.push([escapeCSV(m.data), m.tipo, m.importo.toFixed(2).replace(".", ","),
      nomeCat(m.categoria), nomeConto(m.conto), escapeCSV(m.nota || "")].join(";"));
  scarica(`finanze_movimenti_${iso(new Date())}.csv`, "\ufeff" + righe.join("\r\n"), "text/csv");
}

function importaJSON(input) {
  const file = input.files[0]; if (!file) return;
  // Un backup vero pesa pochi MB: un file enorme non è un backup, e
  // leggerlo tutto solo per scoprirlo congelerebbe il telefono
  if (file.size > 10 * 1024 * 1024) {
    apriModale(`<h3>File non valido</h3><p class="avviso">Il file è troppo grande per essere un backup.</p>
      <button class="btn-principale" onclick="chiudiModale()">OK</button>`);
    input.value = "";
    return;
  }
  const fr = new FileReader();
  fr.onload = () => {
    let b;
    try {
      b = JSON.parse(fr.result);
      if (!Array.isArray(b.movimenti) || !Array.isArray(b.categorie)) throw new Error();
    } catch {
      apriModale(`<h3>File non valido</h3><p class="avviso">Il file non è un backup riconosciuto.</p>
        <button class="btn-principale" onclick="chiudiModale()">OK</button>`);
      input.value = "";
      return;
    }
    apriConferma("Importare il backup? I dati attuali verranno sostituiti.", async () =>
      await sostituisciDati(b, "Importazione non riuscita"));
    input.value = "";
  };
  fr.readAsText(file);
}

/* Il ripristino di un'istantanea automatica: la stessa strada dell'import */
function ripristinaBackup(id) {
  const b = dati.backup.find(x => x.id === id); if (!b) return;
  apriConferma(`Ripristinare il backup del ${quandoBackup(b)}? I dati attuali verranno sostituiti.`, async () => {
    let rip = null;
    try { rip = JSON.parse(b.dati); } catch {}   // un'istantanea rovinata: lo dice la sostituzione
    await sostituisciDati(rip, "Ripristino non riuscito");
  });
}

/* La sostituzione integrale dei dati: la fanno l'import e il ripristino.
   PRIMA lo stato attuale diventa un'istantanea di sicurezza (sempre,
   anche a interruttore spento: uno sbaglio deve poter tornare indietro),
   poi tutto si normalizza e solo se niente è saltato i dati nuovi
   prendono il posto dei vecchi — o tutto o niente */
async function sostituisciDati(b, titolo) {
  try {
    if (!b || !Array.isArray(b.movimenti) || !Array.isArray(b.categorie)) throw new Error("backup");
    await backupAuto("sicurezza");
    // Un id che arriva da fuori vale solo se è un numero intero positivo,
    // mai ripetuto: tutto il resto diventa null e al salvataggio gliene
    // viene assegnato uno nuovo (niente roba iniettabile negli onclick)
    const fabbricaId = () => { const v = new Set(); return x =>
      (Number.isInteger(x) && x > 0 && !v.has(x) && v.add(x)) ? x : null; };
    const idCat = fabbricaId(), idConto = fabbricaId(), idBudget = fabbricaId();
    const rifOk = x => (Number.isInteger(x) && x > 0) ? x : null;   // riferimento in un movimento
    // Rende il backup compatibile: le sovra-categorie non esistono più.
    // I nomi diventano stringhe tagliate a 30 (come l'input dell'app): un
    // backup pasticciato con un nome non-stringa crasherebbe il sort
    // alfabetico. Il numero d'ordine viaggia col backup: quello scelto da
    // Daniele non va perso ripartendo dall'alfabeto. L'icona vale solo se
    // è una dello sprite; le emoji dei backup vecchi si traducono, il
    // resto diventa il fallback. Il colore anche: slot 1-21, mai due
    // categorie con lo stesso (le importate senza slot lo ereditano dopo)
    const slotVisti = new Set();
    const coloreOk = s => Number.isInteger(s) && s >= 1 && s <= 21 && !slotVisti.has(s) && slotVisti.add(s) ? s : undefined;
    b.categorie = b.categorie.filter(c => c.livello !== 1)
      .map(c => ({id: idCat(c.id), nome: String(c.nome ?? "").slice(0, 30),
                  icona: ICONE.includes(c.icona) ? c.icona : (DA_EMOJI[String(c.emoji)] ?? "etichetta"),
                  direzione: c.direzione === "entrata" ? "entrata" : "uscita",
                  colore: coloreOk(c.colore),
                  ordine: Number.isInteger(c.ordine) && c.ordine > 0 ? c.ordine : undefined}));
    // Anche i conti arrivano da fuori: nome e icona ripuliti nello stesso modo
    b.conti = (b.conti || []).map(c => ({id: idConto(c.id), nome: String(c.nome ?? "").slice(0, 30),
                  icona: ICONE.includes(c.icona) ? c.icona : (DA_EMOJI[String(c.emoji)] ?? "etichetta")}));
    // Movimenti: solo record riconoscibili, con tipi sicuri (mai fidarsi di un backup pasticciato)
    b.movimenti = b.movimenti.filter(m => m && (m.tipo === "entrata" || m.tipo === "uscita")
      && dataOk(String(m.data))
      && Number.isFinite(+m.importo) && +m.importo > 0)
      .map(m => ({tipo: m.tipo, importo: arrotonda(+m.importo), data: String(m.data),
                  nota: m.nota == null ? null : String(m.nota).slice(0, 80),
                  conto: rifOk(m.conto), categoria: rifOk(m.categoria)}));
    // I budget: limite sensato, nome sempre una stringa (i backup vecchi
    // col catId lo prendono dalla categoria puntata), categorie sempre come
    // array di id validi, e l'ordine che viaggia
    b.budget = (b.budget || []).filter(x => x && Number.isFinite(+x.limite) && +x.limite > 0)
      .map(x => {
        const cats = (Array.isArray(x.categorie) ? x.categorie
          : (x.catId != null ? [x.catId] : [])).filter(Number.isInteger);
        const nome = (Array.isArray(x.categorie)
          ? String(x.nome ?? "")
          : String((b.categorie.find(c => c.id === x.catId) || {}).nome ?? "")).slice(0, 30);
        return {id: idBudget(x.id), limite: arrotonda(+x.limite), nome: nome || "Budget",
                 categorie: cats,
                 ordine: Number.isInteger(x.ordine) && x.ordine > 0 ? x.ordine : undefined};
      });
    // I periodi chiusi (modalità Libero): solo date ben formate
    b.periodi = (b.periodi || []).filter(p =>
      dataOk(p.inizio) && dataOk(p.fine) && p.inizio <= p.fine)
      .map(p => ({inizio: p.inizio, fine: p.fine}));
    // Il tracciamento (v4): nei backup vecchi non c'è e resta vuoto. Il
    // punto di partenza deve avere date e cifra vere: il resto è rumore
    b.tracciamento = (b.tracciamento && typeof b.tracciamento === "object"
      && dataOk(String(b.tracciamento.inizio)) && Number.isFinite(+b.tracciamento.saldo))
      ? {chiave: "app", inizio: String(b.tracciamento.inizio),
         fine: dataOk(String(b.tracciamento.fine)) ? String(b.tracciamento.fine) : String(b.tracciamento.inizio),
         saldo: arrotonda(+b.tracciamento.saldo),
         aggiustamenti: (Array.isArray(b.tracciamento.aggiustamenti) ? b.tracciamento.aggiustamenti : [])
           .filter(a => a && dataOk(String(a.periodo)) && Number.isFinite(+a.saldo))
           .map(a => ({periodo: String(a.periodo), saldo: arrotonda(+a.saldo)}))}
      : null;
    // Tutto si prepara nelle strutture qui sotto: i dati attuali restano
    // al loro posto finché la sostituzione non è riuscita davvero
    const nuovo = {movimenti: b.movimenti, categorie: b.categorie, conti: b.conti,
                   budget: b.budget, periodi: b.periodi};
    const imp = {...(b.impostazioni && typeof b.impostazioni === "object"
      ? b.impostazioni : {periodoModalita: "mensile", contoDefault: null})};
    imp.chiave = "app";
    imp.contoDefault = rifOk(imp.contoDefault);
    imp.temaScuro = imp.temaScuro === true;   // solo un booleano vero conta, il resto è rumore
    imp.backupAuto = imp.backupAuto !== false;   // il backup automatico è acceso salvo disdetta esplicita
    // Le linee nascoste del flusso: solo booleani, il resto è rumore iniettabile
    imp.flusso = {nascondiEntrate: imp.flusso?.nascondiEntrate === true,
                  nascondiUscite: imp.flusso?.nascondiUscite === true};
    // I backup delle versioni precedenti passano a Libero e generano i periodi
    const daLibera = imp.periodoModalita === "mensileLibera";
    if (daLibera) imp.periodoModalita = "libero";
    else if (!["settimanale","mensile","libero"].includes(imp.periodoModalita))
      imp.periodoModalita = "mensile";
    // Il giorno di reset va usato solo se è davvero un giorno: il resto
    // è roba iniettabile da un backup pasticciato
    const gReset = Number.isInteger(imp.resetGiorno) ? imp.resetGiorno : null;
    delete imp.resetGiorno;           // il giorno di reset non esiste più
    // In Libero l'aperto si riancora all'ultimo chiuso, o si genera da zero
    if (imp.periodoModalita === "libero") {
      if (nuovo.periodi.length) {
        const ord = [...nuovo.periodi].sort((x, y) => x.inizio.localeCompare(y.inizio));
        const fine = ord[ord.length - 1].fine;
        // liberoInizio deve restare una data ISO VERA: la sola forma
        // lascerebbe entrare un 31 febbraio e romperebbe il periodo aperto
        if (!dataOk(String(imp.liberoInizio ?? "")) || imp.liberoInizio <= fine)
          imp.liberoInizio = domaniDi(fine);
      } else {
        const gen = generaPeriodiLibero(daLibera, nuovo.movimenti, gReset);
        nuovo.periodi = gen.chiusi;
        imp.liberoInizio = gen.inizioAperto;
      }
    }
    // Id freschi per i record senza un id valido: il prossimo record
    // nuovo dell'app partirà oltre a quelli importati
    for (const s of ["movimenti", "categorie", "conti", "budget", "periodi"]) {
      let id = nuovo[s].reduce((m, o) => Math.max(m, o.id || 0), 0) + 1;
      for (const o of nuovo[s]) if (o.id == null) o.id = id++;
      dati._id[s] = id;
    }
    if (db) {
      // Sostituzione in un'unica transazione: o entra tutto, o niente
      await new Promise((ris, err) => {
        const tx = db.transaction(["movimenti","categorie","conti","budget","periodi","impostazioni","tracciamento"], "readwrite");
        for (const s of ["movimenti", "categorie", "conti", "budget", "periodi"]) {
          const o = tx.objectStore(s);
          o.clear();
          for (const x of nuovo[s]) o.put(x);
        }
        tx.objectStore("impostazioni").put(imp);
        tx.objectStore("tracciamento").clear();
        if (b.tracciamento) tx.objectStore("tracciamento").put(b.tracciamento);
        tx.oncomplete = ris;
        tx.onerror = () => err(tx.error || new Error("transazione"));
        tx.onabort = () => err(tx.error || new Error("annullata"));
      });
    }
    // Solo ora che i nuovi dati sono davvero al loro posto, l'app li usa
    for (const s of ["movimenti", "categorie", "conti", "budget", "periodi"]) dati[s] = nuovo[s];
    dati.impostazioni = imp;
    dati.tracciamento = b.tracciamento;   // nei backup vecchi arriva null: tracciamento vuoto
    await assegnaOrdine();   // i backup senza numeri d'ordine ereditano quello della lista
    await assegnaColori();   // e chi è arrivato senza slot colore prende il primo libero
    // Si torna come da un foglio Impostazioni chiuso: così anche la sua
    // voce nella cronologia se ne va, e il tasto indietro non resta orfano
    chiudiModale(); stato.offset = 0; stato.filtro = null; vai(stato.dietro);
  } catch (e) {
    // Onesto: se qualcosa salta DOPO la transazione riuscita il database è
    // già sostituito — ma l'istantanea di sicurezza conserva lo stato di prima
    apriModale(`<h3>${titolo}</h3>
      <p class="avviso">O i dati attuali sono rimasti al loro posto, o lo stato di prima resta comunque nell'ultima istantanea di sicurezza. (${e && e.name ? e.name : "errore"})</p>
      <button class="btn-principale" onclick="chiudiModale()">OK</button>`);
  }
}

/* ================================================================
   12-bis. TRACCIAMENTO CONTO
   Un saldo noto (il punto di partenza, a FINE del periodo scelto) e
   i movimenti registrati fanno il resto: ogni periodo è il precedente
   più il suo bilancio. Gli aggiustamenti manuali fissano un saldo
   lì dove il calcolo non basta più, e la catena si ricalcola in
   avanti da lì. Solo movimenti registrati: le spese programmate non
   c'entrano (decisione di Daniele). Se cambia la modalità dei
   periodi, il tracciamento riparte da zero in silenzio.
   ================================================================ */

// I periodi del tracciamento: in mensile (e settimanale) i mesi dal primo
// movimento a oggi; in Libero i chiusi più l'aperto. L'ultimo chiude a
// oggi: il suo punto nel grafico è vivo, si muove col presente
function periodiTracciamento() {
  const imp = dati.impostazioni, og = new Date();
  if (imp.periodoModalita === "libero") {
    const lista = periodiOrdinati().map(p => ({inizio: p.inizio, fine: p.fine}));
    if (imp.liberoInizio) lista.push({inizio: imp.liberoInizio, fine: iso(og)});
    if (lista.length) lista[lista.length - 1].aperto = true;
    return lista;
  }
  // Nel settimanale il tracciamento conta a mesi: l'elenco del punto di
  // partenza resta leggibile anche a settimane fittate
  let y = og.getFullYear(), m = og.getMonth();
  if (dati.movimenti.length) {
    const prima = new Date([...dati.movimenti].sort((a, b) => a.data.localeCompare(b.data))[0].data + "T12:00:00");
    y = prima.getFullYear(); m = prima.getMonth();
  }
  const lista = [];
  while (y * 12 + m <= og.getFullYear() * 12 + og.getMonth()) {
    lista.push({inizio: iso(new Date(y, m, 1)), fine: iso(new Date(y, m + 1, 0)),
                etichetta: cap(MESI[m]) + " " + y});
    m++; if (m > 11) { m = 0; y++; }
  }
  if (lista.length) { lista[lista.length - 1].fine = iso(og); lista[lista.length - 1].aperto = true; }
  return lista;
}

// L'etichetta di un periodo del tracciamento
function etichettaTraccia(p) {
  if (p.etichetta) return p.etichetta + (p.aperto ? " – oggi" : "");
  const da = new Date(p.inizio + "T12:00:00"), a = new Date(p.fine + "T12:00:00");
  const f = d => d.getDate() + " " + MESI_BREVI[d.getMonth()];
  const anno = a.getFullYear() !== da.getFullYear() ? " " + a.getFullYear() : "";
  return da.getFullYear() === a.getFullYear() && da.getMonth() === a.getMonth()
    ? cap(MESI[da.getMonth()]) + " " + da.getFullYear()
    : f(da) + " – " + f(a) + anno;
}

// Il bilancio dei movimenti registrati tra due date (estremi inclusi)
const bilancioTra = (da, a) => arrotonda(dati.movimenti.reduce((s, m) =>
  (m.data >= da && m.data <= a) ? s + (m.tipo === "entrata" ? m.importo : -m.importo) : s, 0));

// La catena dei saldi: dal punto di partenza in avanti. Senza punto, o con
// un punto che nei periodi di oggi non esiste più (modalità cambiata),
// restituisce null: la schermata si comporta come alla prima apertura
function catenaTracciamento() {
  const t = dati.tracciamento;
  if (!t || !dataOk(String(t.inizio)) || !Number.isFinite(+t.saldo)) return null;
  const periodi = periodiTracciamento();
  const i0 = periodi.findIndex(p => p.inizio === t.inizio);
  if (i0 < 0) return null;
  // Gli aggiustamenti si agganciano all'INIZIO del periodo: è l'unica
  // cosa che non si sposta da un giorno all'altro (l'aperto chiude a oggi)
  const fissi = new Map((Array.isArray(t.aggiustamenti) ? t.aggiustamenti : [])
    .filter(a => dataOk(String(a.periodo)) && Number.isFinite(+a.saldo))
    .map(a => [a.periodo, arrotonda(+a.saldo)]));
  const catena = [];
  let saldo = null;
  for (let i = i0; i < periodi.length; i++) {
    const p = periodi[i];
    const bil = i === i0 ? null : bilancioTra(p.inizio, p.fine);
    saldo = saldo === null ? arrotonda(+t.saldo) : arrotonda(saldo + bil);
    const fisso = fissi.get(p.inizio);
    if (fisso != null) saldo = fisso;   // l'aggiustamento fissa il saldo: la catena riparte da lui
    catena.push({...p, bilancio: bil, saldo, aggiustato: fisso != null});
  }
  return catena;
}

const salvaTracciamento = () => dati.tracciamento ? dbSalva("tracciamento", dati.tracciamento) : Promise.resolve();

// L'ingresso nel tracciamento: solo dal tasto fluttuante in Analisi, e
// solo in apertura. Si esce con la freccetta ‹ della pagina o col tasto
// indietro del telefono (v. renderTracciamento): niente toggle
function apriTracciamento() {
  stato._panTraccia = null;   // entrando da fuori si riparte dal presente
  vai("tracciamento");
}

/* ---- Il punto di partenza: cifra e periodo dall'elenco fisso ---- */
function apriPuntoPartenza() {
  const periodi = periodiTracciamento();
  apriModale(`<h3>Punto di partenza</h3>
    <div class="campo"><div class="etichetta-campo">Periodo</div>
      <select id="tPeriodo">${periodi.map((p, i) =>
        `<option value="${i}"${i === periodi.length - 1 ? " selected" : ""}>${esc(etichettaTraccia(p))}</option>`).join("")}</select></div>
    <div class="campo"><div class="etichetta-campo">Saldo a fine periodo (€)</div>
      <input type="text" id="tSaldo" inputmode="decimal" placeholder="es. 1250,00"></div>
    <div class="azioni-modale">
      <button class="btn-secondario" onclick="chiudiModale()">Annulla</button>
      <button class="btn-principale" onclick="salvaPuntoPartenza()">Salva</button>
    </div>`);
}

async function salvaPuntoPartenza() {
  const periodi = periodiTracciamento();
  const p = periodi[Number(document.getElementById("tPeriodo").value)];
  const saldo = parseFloat(String(document.getElementById("tSaldo").value).replace(",", "."));
  if (!p || !Number.isFinite(saldo))
    return apriModale(`<h3>Punto incompleto</h3><p class="avviso">Serve una cifra: è il saldo a fine del periodo scelto.</p>
      <button class="btn-principale" onclick="apriPuntoPartenza()">OK</button>`);
  dati.tracciamento = {chiave: "app", inizio: p.inizio, fine: p.fine,
                       saldo: arrotonda(saldo), aggiustamenti: []};
  await salvaTracciamento();
  chiudiModale(); render();
}

/* ---- L'aggiustamento manuale di un periodo ---- */
function apriAggiustamento(inizio) {
  const catena = catenaTracciamento();
  const p = catena && catena.find(x => x.inizio === inizio);
  if (!p) return;
  /* Le due scritte del foglietto sono invertite (richiesta di Daniele):
     l'intestazione è il NOME del periodo, e «Aggiusta manualmente» sta
     sotto, al posto dell'etichetta, in tondo semplice (classe .tonda) */
  apriModale(`<h3>${esc(etichettaTraccia(p))}</h3>
    <div class="campo"><div class="etichetta-campo tonda">Aggiusta manualmente</div>
      <!-- type text e non number: un number con la virgola («1245,55») il browser lo scarta e la casella nasce vuota -->
      <input type="text" id="tSaldo" inputmode="decimal" value="${p.saldo.toFixed(2).replace(".", ",")}"></div>
    <div class="azioni-modale">
      ${p.aggiustato ? `<button class="btn-secondario" onclick="annullaAggiustamento('${inizio}')">Annulla questo aggiustamento</button>` : ""}
      <button class="btn-secondario" onclick="chiudiModale()">Chiudi</button>
      <button class="btn-principale" onclick="salvaAggiustamento('${inizio}')">Salva</button>
    </div>`);
}

async function salvaAggiustamento(inizio) {
  const t = dati.tracciamento; if (!t) return;
  const saldo = parseFloat(String(document.getElementById("tSaldo").value).replace(",", "."));
  if (!Number.isFinite(saldo))
    return apriModale(`<h3>Cifra mancante</h3><p class="avviso">Serve una cifra: è il saldo a fine del periodo.</p>
      <button class="btn-principale" onclick="apriAggiustamento('${inizio}')">OK</button>`);
  const lista = (t.aggiustamenti || []).filter(a => a.periodo !== inizio);
  lista.push({periodo: inizio, saldo: arrotonda(saldo)});
  lista.sort((a, b) => a.periodo.localeCompare(b.periodo));
  t.aggiustamenti = lista;
  await salvaTracciamento();
  chiudiModale(); render();
}

async function annullaAggiustamento(inizio) {
  const t = dati.tracciamento; if (!t) return;
  t.aggiustamenti = (t.aggiustamenti || []).filter(a => a.periodo !== inizio);
  await salvaTracciamento();
  render();
}

async function annullaAggiustamenti() {
  const t = dati.tracciamento;
  if (!t || !(t.aggiustamenti || []).length) return toast("Nessun aggiustamento da annullare");
  apriConferma("Annullare tutti gli aggiustamenti manuali? I saldi tornano al calcolo dai movimenti.", async () => {
    t.aggiustamenti = [];
    await salvaTracciamento();
    chiudiModale(); render();
  });
}

async function reimpostaPunto() {
  apriConferma("Reimpostare il punto di partenza? Il tracciamento riparte da zero.", async () => {
    dati.tracciamento = null;
    if (db) await dbElimina("tracciamento", "app");
    chiudiModale(); render();
  });
}

/* ---- La schermata: pagina intera a scorrimento, con la sua voce nella
   cronologia (l'indietro riporta ad Analisi). Niente fasce fisse in cima:
   tutto scorre, la fusione in fondo incontra solo la barra di navigazione ---- */
function renderTracciamento() {
  const catena = catenaTracciamento();
  const testa = `<div class="intestazione-pagina">
      <button class="btn-freccia" onclick="vai('analisi')">‹</button>
      <h2>Tracciamento conto</h2></div>`;
  let corpo;
  if (!catena) {
    // Prima apertura (o modalità dei periodi cambiata): solo il punto di partenza
    corpo = testa +
      `<button class="btn-secondario senza-bordo" onclick="apriPuntoPartenza()">${icona("trending-up")} Imposta punto di partenza</button>`;
  } else {
    corpo = testa + graficoTracciamento(catena) +
      catena.map((p, i) => rigaTracciamento(p, i > 0 ? catena[i - 1].saldo : null)).join("") +
      `<button class="btn-secondario senza-bordo" onclick="annullaAggiustamenti()">Annulla tutti gli aggiustamenti manuali</button>
      <button class="btn-secondario senza-bordo" onclick="reimpostaPunto()">Reimposta punto di partenza</button>`;
  }
  document.getElementById("app").innerHTML = `
    <div class="pagina-traccia"><div class="corpo">${corpo}</div></div>
    <div class="sentinella-fusione"></div>
    <div class="nav-basso">
      <button onclick="vai('movimenti')"><span class="icona">${icona("hand-coins")}</span>Movimenti</button>
      <button class="attivo" onclick="vai('analisi')"><span class="icona">${icona("torta")}</span>Analisi</button>
      <button onclick="vai('budget')"><span class="icona">${icona("bersaglio")}</span>Budget</button>
      <button class="piu" onclick="apriInserimento()"><span class="icona">＋</span></button>
    </div>`;
  ripristinaPanTraccia();
  aggiornaTastoTraccia();
}

// Una riga della sintesi: il tocco apre l'aggiustamento del saldo.
// Prima del saldo la freccia del confronto col SALDO VERO del periodo
// precedente (prec, passato dal chiamante): non basta guardare il
// bilancio, perché un aggiustamento manuale può invertire la direzione
// (il saldo scende anche con il periodo in attivo) e la freccia deve
// seguirlo. Il punto di partenza (senza precedente) non ha freccia
function rigaTracciamento(p, prec) {
  const bil = p.bilancio == null ? "" :
    `<div class="sotto-bilancio">${p.bilancio >= 0 ? "+" : "−"} ${eur(Math.abs(p.bilancio))}</div>`;
  const sale = prec != null && p.saldo >= prec;
  const freccia = prec == null ? "" :
    `<span class="${sale ? "verde" : "rosso"}">${icona(sale ? "freccia-su" : "freccia-giu")}</span>`;
  return `<div class="riga-traccia${p.aperto ? " aperta" : ""}" onclick="apriAggiustamento('${p.inizio}')">
    <div><div class="quando">${esc(etichettaTraccia(p))}${p.aggiustato ? ` <span class="aggiustato">aggiustato</span>` : ""}</div>${bil}</div>
    <div class="saldo">${freccia}${eur(p.saldo)}</div>
  </div>`;
}

// La proiezione all'indietro (richiesta di Daniele, 11 nov 2026): i periodi
// PRIMA del punto di partenza non hanno un saldo noto, ma i movimenti sì.
// Risalendo dal punto e togliendo il bilancio di ogni periodo si ricostruisce
// il saldo che il conto DEVE aver avuto: è esatta se il punto è esatto e i
// movimenti completi, e per questo si disegna grigia e tratteggiata, come
// «coerente coi dati, ma non giurata». Si ferma al primo movimento: prima
// di lui non c'è nulla da ricostruire. Solo per il grafico: la sintesi e
// gli aggiustamenti non la vedono
function proiezioneTracciamento(catena) {
  if (!catena.length) return [];
  const periodi = periodiTracciamento();
  const i0 = periodi.findIndex(p => p.inizio === catena[0].inizio);
  if (i0 <= 0) return [];   // il punto è sul primo periodo: niente indietro
  const indietro = [];
  let saldo = catena[0].saldo;
  for (let i = i0 - 1; i >= 0; i--) {
    saldo = arrotonda(saldo - bilancioTra(periodi[i + 1].inizio, periodi[i + 1].fine));
    indietro.unshift({...periodi[i], saldo});
  }
  return indietro;
}

/* ---- Il grafico: una linea sola (il saldo), asse x per periodi.
   Pallini alle chiusure, punto vivo sull'aperto. L'asse dice il numero
   del mese; al cambio d'anno "m/aa" e una riga verticale tratteggiata,
   solo lì. La scala copre TUTTI i saldi, proiezione e negativi compresi
   (due lati). Oltre 12 periodi il disegno si allarga e il pan è lo
   scorrimento nativo del contenitore: niente riconoscitori scritti a mano ---- */
function graficoTracciamento(catena) {
  const L = 10, S = 16, F = 20, H = 170, PASSO = 26, LARGO = 344;
  // Il disegno completo: la proiezione grigia davanti, poi i periodi reali
  // (gli unici con le scritte dei saldi e i pallini in accento)
  const proiezione = proiezioneTracciamento(catena);
  const disegno = proiezione.map(p => ({...p, proiettato: true})).concat(catena);
  const n = disegno.length, re = proiezione.length;   // da qui in poi: periodi reali
  const largo = n < 12 ? LARGO : L * 2 + (n - 1) * PASSO;
  const passo = n > 1 ? (largo - 2 * L) / (n - 1) : 0;
  const x = i => L + i * passo;
  const saldi = disegno.map(p => p.saldo);
  // Il pavimento della scala (richiesta di Daniele): l'asse sale sempre
  // almeno a 10.000 €, così i periodi poveri non gonfiano le oscillazioni
  let max = Math.max(10000, ...saldi), min = Math.min(0, ...saldi);
  const y = v => S + (max - v) / (max - min) * (H - S - F);
  let g = `<div class="scorrimento-traccia" onscroll="segnaPanTraccia()">
    <svg class="grafico-traccia" width="${largo}" height="${H}" viewBox="0 0 ${largo} ${H}" role="img" aria-label="Andamento del saldo">`;
  if (min < 0) g += `<line x1="${L}" y1="${y(0).toFixed(1)}" x2="${largo - L}" y2="${y(0).toFixed(1)}" stroke="var(--bordo)" stroke-dasharray="3 3"/>`;
  // La proiezione (grigia e tratteggiata, v. CSS) tocca il punto del periodo
  // del punto di partenza: il suo ultimo punto è il primo della linea reale
  if (re) g += `<polyline class="proiezione" points="${disegno.slice(0, re + 1).map((p, i) => x(i).toFixed(1) + "," + y(p.saldo).toFixed(1)).join(" ")}"/>`;
  g += `<polyline points="${disegno.slice(re).map((p, i) => x(re + i).toFixed(1) + "," + y(p.saldo).toFixed(1)).join(" ")}" style="stroke:var(--accento)"/>`;
  disegno.forEach((p, i) => {
    const d = new Date(p.inizio + "T12:00:00");
    const cambio = i > 0 && d.getFullYear() !== new Date(disegno[i - 1].inizio + "T12:00:00").getFullYear();
    if (cambio) g += `<line x1="${x(i).toFixed(1)}" y1="${S - 4}" x2="${x(i).toFixed(1)}" y2="${H - F + 4}" stroke="var(--bordo)" stroke-dasharray="3 3"/>`;
    g += `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${d.getMonth() + 1}${cambio ? "/" + String(d.getFullYear()).slice(2) : ""}</text>`;
  });
  disegno.forEach((p, i) => {
    if (p.proiettato)   // pallino grigino e piccolo: presente ma non garantito
      g += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.saldo).toFixed(1)}" r="2.5" class="punto-proiettato"/>`;
    else g += p.aperto
      ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.saldo).toFixed(1)}" r="4" style="fill:var(--accento)" class="punto-vivo"/>`
      : `<circle cx="${x(i).toFixed(1)}" cy="${y(p.saldo).toFixed(1)}" r="3" style="fill:var(--accento)"/>`;
  });
  /* Le scritte dei saldi: quante più ne stanno, mai sovrapposte (se due si
     pestano i piedi se ne nasconde una, resta l'altra). Il saldo dell'ULTIMO
     periodo è il riferimento fisso: si vede SEMPRE, in accento, e gli altri
     si posizionano attorno a lui, da sinistra a destra, sopra o sotto il
     proprio punto; chi non trova posto in nessuna delle due si nasconde.
     SOLO sui periodi reali: sulla proiezione sarebbero una precisione
     che non c'è. Solo interi e SENZA il punto delle migliaia (richiesta
     di Daniele: fa confusione, il numero semplice si legge meglio);
     larghezza stimata prudente, come le etichette del flusso */
  const intero = v => String(Math.round(v));
  const lar = s => s.length * 5.4 + 4;
  const posate = [];   // le scritte già al loro posto
  const scrivi = (i, sopra, ultimo) => {
    const cx = x(i), cy = y(disegno[i].saldo), w = lar(intero(disegno[i].saldo));
    const ty = sopra ? cy - 9 : cy + 16;   // solo interi, e un filo più lontano dal puntino
    const y1 = sopra ? cy - 18 : cy + 8, y2 = sopra ? cy - 8 : cy + 18;
    if (y1 < S - 6 || y2 > H - 10) return false;   // fuori dal disegno o addosso all'asse dei mesi
    if (posate.some(b => Math.abs(b.x - cx) < (b.w + w) / 2 && y1 < b.y2 && y2 > b.y1)) return false;
    posate.push({x: cx, y1, y2, w});
    g += `<text x="${cx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle"${ultimo ? ' style="fill:var(--accento)"' : ""}>${intero(disegno[i].saldo)}</text>`;
    return true;
  };
  const cima = y(disegno[n - 1].saldo) - 18 >= S - 6;   // il riferimento: sopra se ci sta, altrimenti sotto
  if (!scrivi(n - 1, cima, true)) scrivi(n - 1, !cima, true);
  for (let i = re; i < n - 1; i++) if (!scrivi(i, true, false)) scrivi(i, false, false);
  return g + `</svg></div>`;
}

// Il pan si conserva tra i render: chi è andato a guardare il passato ci resta
function segnaPanTraccia() {
  const el = document.querySelector(".scorrimento-traccia");
  if (el) stato._panTraccia = el.scrollLeft;
}
function ripristinaPanTraccia() {
  const el = document.querySelector(".scorrimento-traccia");
  if (!el) return;
  if (stato._panTraccia == null) el.scrollLeft = el.scrollWidth;   // si apre sul presente (destra)
  else el.scrollLeft = stato._panTraccia;
}

/* ---- Il tasto fluttuante ----
   Solo in Analisi (nella schermata si chiude con la freccetta ‹ o coi
   tasti di sistema: niente toggle), e solo alla sommità
   della pagina: scorrendo scende e sfuma, con isteresi sulla soglia (si
   nasconde appena si scolla, ritorna solo a pagina ferma in cima). Il
   tocco lungo (400ms) accende il fumetto col nome del tasto; il click del
   rilascio viene inghiottito in cattura su document, così la didascalia
   si legge senza aprire la schermata. */
const tastoTracciaHtml = () =>
  (stato.pagina === "analisi") && !stato._locale
    ? `<div class="tasto-traccia" id="tasto-traccia">
    <button id="btn-traccia" aria-label="Tracciamento conto"
      ontouchstart="tieniTastoTraccia()" ontouchend="lasciaTastoTraccia()" ontouchcancel="lasciaTastoTraccia()"
      onmousedown="tieniTastoTraccia()" onmouseup="lasciaTastoTraccia()" onmouseleave="lasciaTastoTraccia()"
      onclick="apriTracciamento()">${icona("trending-up")}</button>
  </div>` : "";

let tracciaNascosto = null;   // l'ultimo stato del tasto: l'isteresi vive qui
function aggiornaTastoTraccia() {
  const el = document.getElementById("tasto-traccia");
  if (!el || !el.classList) { tracciaNascosto = null; return; }
  const y = (typeof window === "object" && window.scrollY) || 0;
  const nascosto = tracciaNascosto == null ? y > 8 : (tracciaNascosto ? y > 2 : y > 8);
  tracciaNascosto = nascosto;
  el.classList.toggle("nascosto", nascosto);
}
if (typeof window === "object" && window.addEventListener)
  window.addEventListener("scroll", aggiornaTastoTraccia, {passive: true});

let tracciaTieni = null;   // il timer del tocco lungo
function tieniTastoTraccia() {
  lasciaTastoTraccia();
  tracciaTieni = setTimeout(mostraFumettoTraccia, 400);
}
function lasciaTastoTraccia() {
  if (tracciaTieni) { clearTimeout(tracciaTieni); tracciaTieni = null; }
}
function mostraFumettoTraccia() {
  tracciaTieni = null;
  if (stato._fumetto) return;
  const b = document.getElementById("btn-traccia");
  if (!b) return;
  stato._fumetto = true;   // lo stato prima del DOM: è lui la verità anche in prova
  if (b.appendChild) {   // il DOM vero lo ha; dove non c'è resta lo stato
    const f = document.createElement("span");
    f.className = "fumetto";
    f.textContent = "Tracciamento conto";
    b.appendChild(f);
  }
  // il click del rilascio non deve aprire la schermata: uno solo, inghiottito
  const ingoia = e => { e.stopPropagation(); e.preventDefault();
                        document.removeEventListener("click", ingoia, true); };
  document.addEventListener("click", ingoia, true);
  // il fumetto se ne va al tocco dopo, che passa normalmente
  const via = () => { togliFumettoTraccia();
                      document.removeEventListener("pointerdown", via, true); };
  document.addEventListener("pointerdown", via, true);
}
function togliFumettoTraccia() {
  if (!stato._fumetto) return;
  stato._fumetto = false;
  const f = document.querySelector(".fumetto");
  if (f && f.remove) f.remove();
}

/* ================================================================
   13. DATI DI ESEMPIO, CANCELLAZIONE TOTALE, MODALI, AVVIO
   ================================================================ */
async function svuotaDati() {
  for (const s of ["movimenti", "categorie", "conti", "budget", "periodi", "impostazioni", "tracciamento"])
    if (db) await prom(tabella(s, "readwrite").clear());
  dati.movimenti = []; dati.categorie = []; dati.conti = []; dati.budget = [];
  dati.periodi = []; dati.impostazioni = null; dati.tracciamento = null;
  // Le istantanee sopravvivono allo svuotamento: il loro contatore id continua
  dati._id = {movimenti: 1, categorie: 1, conti: 1, budget: 1, periodi: 1, backup: dati._id.backup};
}

function caricaEsempio() {
  apriConferma("Caricare dati di esempio? I dati attuali verranno sostituiti.", async () => {
    await backupAuto("sicurezza");   // anche l'esempio sostituisce tutto: lo stato di prima resta recuperabile
    await svuotaDati();
    await semina();
    const oggi = new Date();
    const trova = nome => dati.categorie.find(c => c.nome === nome).id;
    const spesa = trova("Spesa"), caffe = trova("Caffè"), fuori = trova("Mangiare fuori"),
          casa = trova("Affitto"), stipendio = trova("Stipendio");
    const idConto = nome => dati.conti.find(c => c.nome === nome).id;
    const contanti = idConto("Contanti"), contoB = idConto("Carta"), satispay = idConto("Satispay");
    const d = giorni => { const x = new Date(oggi); x.setDate(oggi.getDate() - giorni); return iso(x); };
    // ventiquattro mesi di esempio (richiesta di Daniele, 11 nov: così lo
    // scorrimento laterale del grafico si prova davvero): stipendio e
    // affitto lo stesso giorno — il picco a V del flusso si vede subito —
    // e attorno le spesucce del quotidiano, con importi che respirano da
    // un mese all'altro. Ogni mese ha il suo gruppo ancorato al 15 (il
    // mese corrente parte da oggi meno due), così nessuno si sparpaglia
    const esempi = [];
    const o0 = new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate());
    for (let k = 0; k < 24; k++) {
      const gg = new Date(oggi.getFullYear(), oggi.getMonth() - k, k === 0 ? Math.max(1, oggi.getDate() - 2) : 15);
      const fa = Math.round((o0 - gg) / 864e5);
      const onda = 1 + (k % 3) * 0.08;   // i mesi non sono mai uguali
      esempi.push(
        {tipo: "entrata", importo: arrotonda(2400 * onda), data: d(fa),      nota: "Stipendio",        conto: contoB,   categoria: stipendio},
        {tipo: "uscita",  importo: 520,                  data: d(fa),        nota: "Affitto",          conto: contoB,   categoria: casa},
        {tipo: "uscita",  importo: arrotonda(45.60 * onda), data: d(fa + 1),  nota: "Supermercato",     conto: satispay, categoria: spesa},
        {tipo: "uscita",  importo: 12.50,                data: d(fa + 3),    nota: "Pizzeria",         conto: contanti, categoria: fuori},
        {tipo: "uscita",  importo: 1.30,                 data: d(fa + 5),    nota: "Caffè al bar",     conto: contanti, categoria: caffe},
        {tipo: "uscita",  importo: 8.40,                 data: d(fa + 8),    nota: "Caffè e cornetto", conto: contanti, categoria: caffe},
        {tipo: "uscita",  importo: arrotonda(32.10 * onda), data: d(fa + 12), nota: "Spesa",            conto: satispay, categoria: spesa});
    }
    // e il presente: oggi e ieri, con le piccole spese della giornata
    esempi.push(
      {tipo: "uscita",  importo: 45.60, data: d(0), nota: "Supermercato", conto: satispay, categoria: spesa},
      {tipo: "uscita",  importo: 1.30,  data: d(0), nota: "Caffè al bar",  conto: contanti, categoria: caffe},
      {tipo: "uscita",  importo: 12.50, data: d(1), nota: "Pizzeria",      conto: contanti, categoria: fuori},
      {tipo: "uscita",  importo: 32.10, data: d(1), nota: "Spesa",         conto: satispay, categoria: spesa},
      {tipo: "uscita",  importo: 15.90, data: d(1), nota: "Spesa",         conto: contoB,   categoria: spesa});
    for (const e of esempi) {
      await dbSalva("movimenti", e); dati.movimenti.push(e);
    }
    for (const [nome, cats, limite] of [["Supermercato e caffè", [spesa, caffe], 220], ["Solo caffè", [caffe], 20]]) {
      const b = {nome, categorie: cats, limite};
      await dbSalva("budget", b); dati.budget.push(b);
    }
    // I periodi personalizzati del Libero: coprono gli stessi mesi dei
    // movimenti, così anche in Libero (e nel tracciamento) c'è storia da
    // sfogliare. In mensile restano dormienti
    const prima = esempi.reduce((m, e) => e.data < m ? e.data : m);
    const pd = new Date(prima + "T12:00:00");
    let y = pd.getFullYear(), mo = pd.getMonth();
    while (y * 12 + mo < oggi.getFullYear() * 12 + oggi.getMonth()) {
      const p = {inizio: iso(new Date(y, mo, 1)), fine: iso(new Date(y, mo + 1, 0))};
      await dbSalva("periodi", p); dati.periodi.push(p);
      mo++; if (mo > 11) { mo = 0; y++; }
    }
    dati.impostazioni.liberoInizio = iso(new Date(oggi.getFullYear(), oggi.getMonth(), 1));
    await salvaImpostazioni();
    await assegnaOrdine();   // i budget d'esempio nascono SENZA numero d'ordine, ma l'avvio (che lo assegna) è già passato: senza questa riga il menù ⋮ li scambia senza muoverli
    chiudiModale(); stato.offset = 0; stato.filtro = null; vai(stato.dietro);
  });
}

function cancellaTutto() {
  apriConferma("Cancellare TUTTI i dati? L'operazione è definitiva.", () => {
    apriConferma("Confermi davvero? Non si può annullare.", async () => {
      await svuotaDati();
      // Definitiva davvero: se ne vanno anche le istantanee automatiche
      for (const vecchia of [...dati.backup]) await dbElimina("backup", vecchia.id);
      dati.backup = [];
      await semina();
      chiudiModale(); stato.offset = 0; stato.filtro = null; vai(stato.dietro);
    });
  });
}

/* ---- Modali generiche ---- */
function apriModale(html, classe) {
  // Tasto indietro: una voce per la finestrella, una sola anche se si ridisegna
  if (!document.getElementById("overlay").className.includes("aperto")) storiaApri();
  document.getElementById("modale").innerHTML = html;
  const o = document.getElementById("overlay");
  o.className = "overlay" + (classe ? " " + classe : "") + " aperto";
}
function chiudiModale() {
  const o = document.getElementById("overlay");
  if (o.className.includes("aperto")) storiaTogli();
  o.className = "overlay";
}
function eventoOverlay(e) { if (e.target.id === "overlay") chiudiModale(); }
function apriConferma(testo, azione) {
  stato._conferma = azione;
  // il testo si neutralizza QUI, al punto di rendering: chi chiama non
  // deve ricordarsi l'escape, e chi ha già dati puliti non ci perde niente
  apriModale(`<h3>Conferma</h3>
    <p class="avviso" style="font-size:15px;color:var(--testo)">${esc(testo)}</p>
    <div class="azioni-modale" style="margin-top:14px">
      <button class="btn-secondario" onclick="chiudiModale()">Annulla</button>
      <button class="btn-principale" onclick="stato._conferma()">OK</button>
    </div>`);
}

/* ---- Menù locale dei tre puntini (categorie e budget) ----
   Pende dal punto toccato come il menù di chiusura del periodo, si
   chiude col tappeto o col tasto indietro, e lascia una voce nella
   cronologia come ogni altra schermata che copre.
   L'ancora la si cerca nel DOM vivo per id, non nell'evento: nell'anteprima
   l'evento consegnato all'onclick può avere il target staccato dal documento,
   col rettangolo tutto a zero — e il menù finiva in cima alla pagina */
function apriMenuLocale(ancoraId, voci) {
  if (stato._locale) return;
  const r = document.getElementById(ancoraId).getBoundingClientRect();
  const largo = 230, alto = voci.length * 48 + 10;
  const largoSchermo = window.innerWidth ?? 380, altoSchermo = window.innerHeight ?? 720;
  // A sinistra non oltre il bordo, a destra allineato al bottone: se ci sta,
  // il menù finisce dove finiscono i puntini
  const x = Math.max(8, Math.min(r.right - largo, largoSchermo - largo - 8));
  // Se sotto non c'è spazio, il menù si apre sopra il punto toccato
  const y = r.bottom + alto + 8 > altoSchermo ? r.top - alto - 8 : r.bottom + 4;
  stato._locale = {x, y, voci};
  storiaApri();
  renderTenendoIlFoglio();
}
function chiudiMenuLocale() {
  if (!stato._locale) return;
  stato._locale = null;
  storiaTogli();
  renderTenendoIlFoglio();
}
// La voce del menù: chiude e poi agisce. L'azione parte FUORI dalla consegna
// del click, come lo swipe: dentro l'evento il render di chiusura cambiava il
// DOM sotto il dito e su iPhone il riconoscitore dei click restava "spento",
// con lo spostamento dei budget che non scattava mai
function voceMenuLocale(i) {
  const voce = stato._locale && stato._locale.voci[i];
  if (!voce) return;
  chiudiMenuLocale();
  setTimeout(() => voce.azione(), 0);
}
// Il render ricostruisce anche il foglio Impostazioni, l'unico scrollabile
// suo: la lista non deve saltare in cima quando il menù si apre o si chiude
function renderTenendoIlFoglio() {
  const foglio = document.querySelector(".sheet");
  const scrollo = foglio ? foglio.scrollTop : 0;
  render();
  const rifatto = document.querySelector(".sheet");
  if (rifatto) rifatto.scrollTop = scrollo;
}

/* Numero d'ordine di categorie e budget: è quello che Daniele sposta dai tre
   puntini in Impostazioni e dal menù del budget. Chi non ce l'ha (dati vecchi
   o appena seminati) eredita l'ordine che già vedeva — alfabetico per le
   categorie, quello della lista per i budget — e viene salvato */
async function assegnaOrdine() {
  let max = dati.categorie.reduce((m, c) => Math.max(m, c.ordine ?? 0), 0);
  for (const c of categorieOrdinate()) if (c.ordine == null) { c.ordine = ++max; await dbSalva("categorie", c); }
  let maxB = dati.budget.reduce((m, b) => Math.max(m, b.ordine ?? 0), 0);
  for (const b of dati.budget) if (b.ordine == null) { b.ordine = ++maxB; await dbSalva("budget", b); }
  dati.budget.sort((a, b) => (a.ordine ?? 1e9) - (b.ordine ?? 1e9));   // la pagina segue l'ordine
}

/* Colore della categoria nella torta: uno slot stabile (1-21), assegnato
   alla nascita e mai più cambiato. Chi resta senza slot (dati vecchi o
   importati) eredita il primo libero, nello stesso ordine della lista */
const slotLibero = () => {
  const usati = new Set(dati.categorie.map(c => c.colore));
  for (let s = 1; s <= 21; s++) if (!usati.has(s)) return s;
  return 1;   // oltre le 21 categorie gli slot ricominciano (non capiterà)
};

async function assegnaColori() {
  for (const c of categorieOrdinate())
    if (!Number.isInteger(c.colore) || c.colore < 1 || c.colore > 21) {
      c.colore = slotLibero(); await dbSalva("categorie", c);
    }
}

/* ---- Migrazione dei dati salvati con versioni precedenti dell'app ---- */
async function migraDati() {
  // Una volta esistevano le sovra-categorie (categorie "livello 1"): eliminate
  for (const c of [...dati.categorie]) {
    if (c.livello === 1) { await dbElimina("categorie", c.id); dati.categorie = dati.categorie.filter(x => x.id !== c.id); }
    else if (c.padre != null) { c.padre = null; await dbSalva("categorie", c); }
  }
  // Le icone di una volta erano emoji: diventano gli id dello sprite Lucide
  for (const c of dati.categorie)
    if (!ICONE.includes(c.icona)) {
      c.icona = DA_EMOJI[String(c.emoji)] || "etichetta";
      delete c.emoji;
      await dbSalva("categorie", c);
    }
  for (const c of dati.conti)
    if (!ICONE.includes(c.icona)) {
      c.icona = DA_EMOJI[String(c.emoji)] || "etichetta";
      delete c.emoji;
      await dbSalva("conti", c);
    }
  // I budget vecchi puntavano a una sola categoria (catId)
  for (const b of [...dati.budget]) {
    if (b.categorie) continue;
    const c = b.catId != null ? dati.categorie.find(x => x.id === b.catId) : null;
    await dbElimina("budget", b.id);
    dati.budget = dati.budget.filter(x => x.id !== b.id);
    if (c) {
      const nb = {id: b.id, nome: c.nome, categorie: [c.id], limite: b.limite};
      await dbSalva("budget", nb); dati.budget.push(nb);
    }
  }
  // La vecchia modalità "mensile a data libera" (con giorno di reset) diventa Libero
  let cambiate = false;
  if (dati.impostazioni?.periodoModalita === "mensileLibera") {
    dati.impostazioni.periodoModalita = "libero";
    await attivaLibero(true);   // i cicli si ricostruiscono col giorno di reset
    delete dati.impostazioni.resetGiorno;
    cambiate = true;
  } else if (dati.impostazioni?.periodoModalita === "libero" &&
             !dati.periodi.length && !dati.impostazioni.liberoInizio) {
    // Libero attivato in passato ma mai generato (archivio vuoto alla prima volta)
    await attivaLibero(false);
    cambiate = true;
  }
  if (cambiate) await salvaImpostazioni();
  await assegnaOrdine();    // i dati vecchi prendono il numero d'ordine spostabile
  await assegnaColori();    // e il colore stabile della torta
}

/* ---- Tasto indietro del telefono ----
   Ogni schermata che copre le sezioni base (foglio del movimento, foglio
   Impostazioni, pagina Modifica periodi, menù a tendina, finestrella/modale,
   filtro di categoria, conto o giorno) lascia una voce nella cronologia del browser:
   il tasto indietro chiude la schermata aperta. Anche Analisi e Budget
   lasciano la loro voce (voceSezione): il tasto indietro riporta prima a
   Movimenti e da lì, col secondo colpo, esce dall'app. */
const PAGINE_SCHERMO = ["form", "impostazioni", "periodi", "tracciamento"];
let pilaStoria = 0;          // voci messe nella cronologia e non ancora tolte
let storiaAspetta = false;   // in volo il popstate di una chiusura già fatta da noi
let spingeInAttesa = false;  // schermata aperta mentre quel popstate era in volo
let daIndietro = false;      // chiusura comandata dal tasto indietro: niente history.back
let voceSezione = false;     // la voce messa entrando in Analisi o Budget

function storiaApri() {
  // Se è in volo il back di una chiusura fatta un attimo prima (chiusa una
  // schermata e subito aperta un'altra nello stesso tocco, come menù →
  // calendario), la voce si mette quando quel back è arrivato: altrimenti
  // se la mangerebbe lui
  if (storiaAspetta) { spingeInAttesa = true; return; }
  pilaStoria++;
  try { history.pushState({schermata: true}, ""); } catch { pilaStoria--; }
}
function storiaTogli() {
  if (daIndietro || pilaStoria === 0) {
    // C'è una voce rimandata che non è mai partita e si sta chiudendo la
    // schermata che l'aveva chiesta: la voce si annulla e basta
    if (spingeInAttesa && pilaStoria === 0 && !daIndietro) spingeInAttesa = false;
    return;
  }
  pilaStoria--; storiaAspetta = true;
  try { history.back(); } catch {}
}

// Quale schermata è aperta, dalla più alta in cima
function chiudeSchermata() {
  if (document.getElementById("overlay").className.includes("aperto")) return chiudiModale;
  if (stato._locale) return chiudiMenuLocale;
  if (stato._menu) return chiudiMenu;
  if (stato.pagina === "form") return chiudiForm;
  if (stato.pagina === "impostazioni") return chiudiImpostazioni;
  if (stato.pagina === "periodi") return () => vai("impostazioni");
  if (stato.pagina === "tracciamento") return () => vai("analisi");   // la schermata sta sopra Analisi
  if (stato.filtro?.tipo === "budget") return chiudiBudgetDettaglio;
  if (stato.filtro && stato.pagina === "movimenti") return togliFiltro;
  // Sezione Analisi o Budget: il tasto indietro riporta a Movimenti
  if (PAGINE.includes(stato.pagina) && stato.pagina !== "movimenti") {
    voceSezione = false;
    return () => vai("movimenti");
  }
  return null;
}

window.addEventListener("popstate", () => {
  if (storiaAspetta) {   // chiusa da noi con tasto, swipe o cambio pagina: la voce era già tolta
    storiaAspetta = false;
    if (spingeInAttesa) { spingeInAttesa = false; storiaApri(); }
    return;
  }
  // Tasto indietro: chiudi la schermata aperta, senza toccare la cronologia
  daIndietro = true;
  if (pilaStoria > 0) pilaStoria--;
  const chiudi = chiudeSchermata();
  if (chiudi) chiudi();
  daIndietro = false;
});

/* ---- Avvio ---- */
(async function avvio() {
  try { db = await apriDB(); } catch { db = null; }
  if (!db) bannerMemoria();   // rarissimo, ma meglio saperlo subito
  // Un archivio che si apre ma non si lascia leggere (corrotto) non deve
  // fermare l'app su schermo vuoto: si lavora in memoria, col banner a dirlo
  try { await caricaTutto(); } catch { db = null; bannerMemoria(); }
  await migraDati();
  await semina();
  await backupAuto("giorno");   // se l'app era stata chiusa male, qui finisce la foto rimasta in sospeso (senza modifiche non fa nulla)
  if (navigator.storage?.persist) { try { await navigator.storage.persist(); } catch {} }
  applicaTema();
  // Il sistema può cambiare idea mentre l'app è aperta: lo si segue, salvo forzatura
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applicaTema);
  render();
  attivaSwipePeriodi();   // una volta sola: copre tutto lo schermo
  /* Il service worker porta l'app offline quando è pubblicata su un sito
     (https): in anteprima o da file locale non serve e non si registra */
  try {
    if (typeof location === "object" && location && location.protocol === "https:" && navigator.serviceWorker)
      navigator.serviceWorker.register("sw.js");
  } catch (e) {}
})();
